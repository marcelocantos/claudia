; Host claudia broker (unix socket, not a TCP port).
; Template: supervisor/install.sh writes supervisor.d/claudia.ini with @REPO@ expanded.
; The program runs the Homebrew Cellar binary, so a tree build never
; squats the shared socket — every consumer on the machine talks to
; this one process.

[program:claudia]
command=@REPO@/supervisor/run-claudia.sh
directory=@REPO@
environment=HOME="%(ENV_HOME)s",USER="%(ENV_USER)s",PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:%(ENV_HOME)s/.cargo/bin:%(ENV_HOME)s/.local/bin:%(ENV_HOME)s/.py/bin:%(ENV_HOME)s/go/bin:%(ENV_HOME)s/.grok/bin:/usr/bin:/bin:/usr/sbin:/sbin",TERM="xterm-256color",LANG="en_US.UTF-8"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/.local/var/log/claudia.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
