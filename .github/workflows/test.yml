name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      # tmux is required for Session mode (Agent). macOS runners have
      # it pre-installed; Ubuntu runners don't.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The test suite has two tiers of skip guards:
      #
      #   - Tests that spawn the real `claude` binary check
      #     exec.LookPath("claude") and skip when it's absent. CI does
      #     not install claude, so those tests skip here.
      #   - Tests that need tmux check exec.LookPath("tmux") and skip
      #     if absent (should not happen given the install step above).
      #   - Tests that spend API credit check CLAUDIA_LIVE and skip
      #     unless explicitly enabled. CI never sets that.
      #
      # What does run: every parse/unit test, the tmuxagent control-mode
      # parser and readiness regex tests, and the full WaitForResponse
      # settle-timer suite. That covers everything CI can reach without
      # an Anthropic key or the claude binary.
      - name: Test
        run: go test -race -count=1 ./...

  # T29 oracle: STABILITY.md must enumerate exactly the public surface of the
  # release tag its "Snapshot as of:" line names. Separate job because it needs
  # the full tag history (fetch-depth 0) that the test matrix does not.
  stability-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Check STABILITY.md against the snapshot tag's public surface
        run: make verify-stability

  # T32 oracle: the mutation evidence quoted in the acceptance of a converging
  # or achieved target must still bite. The check applies each mutation named in
  # mutation-evidence.json in a throwaway worktree of this revision and requires
  # the named tests to go RED — so a commit that edits those tests' call sites
  # (adding an argument, changing a fixture, relaxing a precondition) fails here
  # instead of passing while the evidence is silently disarmed. That is exactly
  # what 8c5e04a did to T28's, with every suite green.
  #
  # --prove-teeth runs alongside: it applies the decay each entry declares and
  # requires it to leave the suites green while turning THIS check red. An
  # oracle nothing can be shown to fail is not an oracle.
  mutation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      # The evidence lives in hermetic tests (frame fixtures and fake drivers),
      # so no tmux and no claude binary are needed here — but a test that SKIPS
      # is not evidence, and the check says so rather than reading the skip as a
      # kill.
      - name: Re-derive quoted mutation evidence
        run: make verify-mutation-evidence
