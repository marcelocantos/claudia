name: test

# The owner gate is local: scripts/hooks/pre-push runs `make gate` before
# every push, and a red gate refuses the push (docs/gate.md). This workflow
# runs the same target on Linux and macOS after the fact — a regression net
# for the platform the owner did not push from, not the thing that decides
# whether master is releasable. It is not a merge gate: master has no
# branch protection, and owner work lands by gated push, not by PR.
#
# `pull_request` stays as a courtesy for external contributors, whose PRs
# are the only ones this repo receives.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # verify-stability derives the public surface from the release tag
      # STABILITY.md names, so the tag history must be present.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      # tmux is required for Session mode (Agent). macOS runners have it
      # pre-installed; Ubuntu runners don't. A runner without it does not
      # skip the Session suite quietly: scripts/gate-test.py reports
      # "tmux not installed" as an undeclared skip and the gate goes red.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      # gofmt, go vet, go test -race -count=1 -shuffle=on with the residue
      # ledger, STABILITY.md surface check, and mutation-evidence re-derivation
      # — the same recipe the pre-push hook runs. Tests that spend API credit
      # or need a provider binary skip under their live gates (CLAUDIA_*_LIVE);
      # CI never sets those, and `make live` is the owner's release-time gate
      # for them (AGENTS.md "Live tests").
      - name: make gate
        run: make gate
