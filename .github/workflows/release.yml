name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
          - runner: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Verify version and test
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          test "v$(sed -n 's/^const Version = "\([0-9.]*\)"/\1/p' version.go)" = "$TAG"
          go test -race -count=1 ./...

      - name: Build and package
        env:
          TAG: ${{ github.event.release.tag_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${TAG#v}"
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/claudia ./cmd/claudia
          cp LICENSE README.md THIRD_PARTY_NOTICES dist/
          tar -C dist -czf "claudia-${version}-${{ matrix.target }}.tar.gz" .

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" claudia-*.tar.gz --repo "${{ github.repository }}" --clobber

  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: Justintime50/homebrew-releaser@v3
        with:
          homebrew_owner: marcelocantos
          homebrew_tap: homebrew-tap
          formula_folder: Formula
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          version: ${{ github.event.release.tag_name }}
          install: 'bin.install "claudia" => "claudia"'
          formula_includes: |
            service do
              run [opt_bin/"claudia", "broker", "serve"]
              environment_variables PATH: [
                std_service_path_env,
                "#{Dir.home}/go/bin",
                "#{Dir.home}/.local/bin",
                "#{Dir.home}/.grok/bin",
              ].join(":"), TERM: "xterm-256color", LANG: "en_US.UTF-8"
              keep_alive true
              log_path var/"log/claudia/broker.log"
              error_log_path var/"log/claudia/broker.log"
            end
          test: 'system bin/"claudia", "--version"'
          target_darwin_arm64: true
          target_linux_amd64: true
          target_linux_arm64: true
          skip_checksum: true
          update_readme_table: true
