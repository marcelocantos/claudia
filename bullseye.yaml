  T98:
    name: TestCursorSlowFirstPromptIsNotStuck finishes inside the root package's test timeout when the whole suite runs, not only when it runs alone
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Achieved 2026-09-21. Implemented by cl-t98-suite-order-park at 93723e13b128f21b184e930d56ea6b5e9e055499; adjudicated by claudia-po (🎯T31.1). Reachability re-proven at achieve time.

      MY HYPOTHESIS WAS WRONG, AND THE WAY IT WAS WRONG IS THE FINDING. I had proposed that both ~9-minute parks came from a leaked client reading a package-level `cursorPromptSilenceBound` that another test had set to `time.Hour`, reasoning that a park surviving nine minutes needed a bound longer than nine minutes. cl-t98 falsified it with the cheapest discriminator available — the stack itself. Gate 06df1f3bs dump: `goroutine 577 [select, 9 minutes]` in `(*Agent).WaitForResponse` agent.go:1864, from cursor_stuck_prompt_test.go:87. No `shortenCursorSilenceBound` site appears on that stack and the parked goroutine never read the constant. I checked at source: line 69 sets the bound to 5 SECONDS, line 84 asserts `Send` took ≥500ms, and the park is after `Send` has already returned. Both ~9m parks share NO bound rather than a long one. I inferred a long bound from a long park; the park had no bound, and a wait with no bound does not need one to last nine minutes.

      THE REAL MECHANISM. The turn ended while `Send` was still unwinding, so `WaitForResponse` subscribed after the terminal event had already been published and then waited for an event that would never come again. That is why it parks in-suite and returns in 1.36s alone: alone, the timing does not put the terminal event before the subscription. The repair is `turn_latch.go` — a latch so the wait hears a turn published before it subscribed. It REMOVES the wait. `cursorPromptSilenceBound` is untouched and the package timeout is untouched, which is what clause 3 demanded.

