  T55:
    name: Inter-provider session migration (switch Provider mid-conversation)
    status: converging
    value: 8.0
    cost: 5.0
    acceptance:
    - A public API (e.g. Agent.Migrate / Session.Migrate) migrates an in-flight Session from one Provider to another (e.g. Claude→Grok) while preserving the caller's Agent handle and enough transcript context for continuity, or fails closed with a CapabilityError naming what is missing. Intra-provider SetModel (🎯T54) remains the same-provider path. Claudia does not choose when or whether to migrate — the host calls the API.
    - 'Migration does not silently mint a blank destination session. Continuity is a distilled inert seed (Grok resume-session CORE.md shape), not a verbatim foreign transcript: goal, last recoverable user request, relevant files/commands/tests, work completed, work still open, stopping point + safest next action, and structured reader warnings. Foreign system prompts, thinking, signatures, encrypted content, and tool calls are not replayed as executable. Missing last_user_request AND last_assistant_action refuses unless the caller passes an explicit force/cold flag. Resume/RequireResume semantics stay fail-closed.'
    - The destination is a new native session (session/new, --session-id). Claudia never --resume / session/load the predecessor's native id on the destination provider. SessionID rotates; the switch Event carries the post-migrate SessionID.
    - The same SubscribeEvents subscription remains valid across the migrate — no re-subscribe required. After a successful migrate, subsequent assistant/progress Events continue on that subscription.
    - When the host calls SetModel or Migrate, a lifecycle Event is published on that stream before the new model/provider accepts work, so the switch is observable. Contract (field names may refine; semantics must not) — Type=system (or ProgressType=model_switch); carries from_provider, to_provider, from_model, to_model, reason (host-supplied or "explicit"), the post-migrate SessionID when identity rotates, and reconstruction warning codes when the seed was partial. Switches are never silent.
    - When a turn ends in a classified stuck/exhausted condition (at least rate_limit and spend/quota wall, distinct from auth and client_bug), Claudia publishes a terminal/stuck lifecycle Event on the same stream (class + short detail) and does not itself SetModel, Migrate, remint, or climb any ladder. The host decides whether/when/which next step.
    - Capability (or documented refusal) covers each provider pair claudia claims; unsupported pairs refuse loudly. Hermetic tests cover ≥1 successful migrate pair and ≥1 refused pair, plus Event shape on migrate success, subscription continuity, inert-seed (no executable foreign tool call in the destination prompt), fail-closed missing context, and stuck/exhausted Event emission without an automatic model change.
