    - The test asserts `timeout waiting for thread/start` on a host at load average >100, demonstrated by the full suite under that load rather than in isolation. The initialize and thread/start bounds are separated so that exhausting one cannot be mistaken for exhausting the other — the fake peer completes initialize on a signal rather than within a wall-clock window, or the two bounds are named constants far enough apart that load cannot invert them, with the reason stated. 🎯T33's TestHermeticTestsHaveNoWallClockDeadline is extended to cover this bound, or the target records why a product-side timeout configured short by a test is outside that guard's remit.
    context: |-
      Found 2026-09-21 by claudia-po's review of 🎯T91's finish, on a CLEAN detached worktree at e18806d (`git status --porcelain` empty), `make gate` under deliberate saturation (12 parallel `go test -race` builds, load average 121.8). GATE exit=2, root package completed 97.759s:

          --- FAIL: TestHermeticCodexThreadStartTimesOut (1.00s)
              codex_session_test.go:564: Start err = codex app-server: timeout waiting for initialize
                after 200ms, want timeout waiting for thread/start

      The test means to pin the thread/start timeout and instead pinned the initialize one: at load 122 the 200ms initialize bound expired before the handshake it was meant to let through, so Start failed one step earlier than the test's subject. The assertion is not wrong about the product — both timeouts fired correctly — it is wrong about WHICH it was testing, which is worse than a flake: on an idle machine it is a green test of thread/start, under load it is a red test of initialize, and nothing distinguishes the two runs.

