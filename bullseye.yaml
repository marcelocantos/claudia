  T4.6:
    name: Codex provider capability gaps are explicit and tested
    status: achieved
    value: 3.0
    cost: 3.0
    actual_cost: 3.0
    attestation: |-
      Product SHA 399b1c8 on local master, "T4.6: publish Codex capability gaps as typed errors, not silent no-ops". INDEPENDENT PO GATE 2026-08-09 — verifier did not write the code (🎯T31); the implementer left the achieve to the PO.

      Scope: 12 files, +811/-89 — new capability.go (383 lines: Capability names + CapabilityStatus + CheckCapability), agent.go/provider.go/task.go, four test files, and README/STABILITY/agents-guide/oracle-map doc updates.

      THE FINDING OUTRANKS THE TARGET. `codexTaskArgs` silently discarded `req.DisallowTools`: a caller stripping Bash/Write/WebFetch from a Codex agent received a fully-armed agent with no signal whatsoever. That is fail-OPEN on a safety control — the same failure shape BaseDisallowedTools documents from the ~33,000-subagent incident, one provider over. `codex exec` has no per-tool disallow flag, so the correct behaviour is to refuse before spawning, which it now does via CheckCapability(ProviderCodex, CapabilityToolRestrictions).

      ORACLE RE-RUN BY THE GATE in an isolated worktree at 399b1c8 — nine named tests added and observed passing: TestCodexCapabilityMatrixIsExplicit, TestCodexCapabilityGapsVersusClaude, TestCodexCapabilityMatrixMatchesBackendClaims, TestProviderCapabilityMatrixIsTotal, TestCheckCapabilityFailsClosed, TestCodexTaskToolRestrictionsFailClosed, TestCodexTaskWithoutRestrictionsIsNotBlocked, TestCodexTaskArgsCarryNoToolRestrictionFlags, TestStartWithBackendRejectsEmptyStart.

      MUTATION PROOF BY THE GATE — both reverted, task.go restored byte-identical:
      - C1 FAIL-OPEN REGRESSION: delete the guard so DisallowTools is silently dropped again, i.e. reintroduce the original bug verbatim → KILLED by TestCodexTaskToolRestrictionsFailClosed. The safety control is genuinely pinned, not merely present.
      - C2 OVER-BROADNESS: refuse every Codex task whether or not restrictions were requested → KILLED by TestCodexTaskWithoutRestrictionsIsNotBlocked. The capability matrix cannot silently degrade into refusing everything, which is the failure mode a fail-closed change invites. (Over-broadness mutation run at the overseer's direction; the implementer had not tried it.)

      REGRESSION: full `go test -race -count=1 ./...` exit 0 across all packages, `go vet ./...` exit 0, run with the test-control vars unset per 🎯T20.

      CONSTRAINT HELD: production Codex Session Start remains experimental/fail-closed — 🎯T4.5 is not done and nothing in this commit enables it.

      RESIDUAL / follow-ups, declared not smoothed over:
      - The general property is NOT yet enforced: this commit fixes the DisallowTools instance and builds the capability matrix that makes the general rule expressible, but nothing yet guarantees that every request field a provider cannot honour produces a typed error rather than a silent drop. DisallowTools was found only because someone was enumerating capabilities for a different purpose — nothing was watching for it. Filed as its own standing target with a worker.
      - image_input is asserted in this commit as a WHOLE-LIBRARY gap (claudia plumbs images for no provider), not a Codex-specific one. The PO is verifying separately whether jevons has an image path that bypasses claudia, since the owner pastes screenshots routinely; if so that is an unnamed fork and will be filed.
      - Gate audit of the codex task path found its remaining request fields (Prompt, Model, WorkDir, SessionID, SandboxMode, ApprovalPolicy, RawLog) are all consumed, so DisallowTools was the only silent drop on that specific path. Other provider paths are unaudited — hence the standing target.
    acceptance:
    - Provider capability reporting distinguishes supported, unsupported, and experimental Codex behaviours for rewind, cost accounting, tmux attach, terminal logs, permission/tool restrictions, image inputs, and web search.
    - Calling an unsupported Codex feature returns a typed, documented error rather than silently falling back to Claude assumptions.
    - Codex rewind is not implemented by truncating private transcript files; it is either implemented through a public fork/resume API or marked unsupported with a clear rationale.
    - 'Permission and sandbox mapping is documented: Codex approval/sandbox flags are not treated as equivalent to Claude permission modes unless tests prove the mapping.'
    - Tests cover at least one unsupported capability and one experimental capability downgrade.
    context: |-
      Codex and Claude Code have overlapping but different affordances. The dangerous path is fake parity: pretending that Claude transcript rewind, tmux attach, or permission flags mean the same thing for Codex. Capability reporting keeps the user-facing surface honest while still allowing additive support as Codex public APIs mature.
      Converging 2026-07-06: Added a typed CapabilityError, fail-closed ProviderCodex Session startup, fail-closed Codex rewind guard, and tests proving unsupported capabilities surface through errors.As rather than silent Claude fallback. Remaining work includes a fuller supported/unsupported/experimental capability matrix for terminal logs, tmux attach, cost, permission/tool mapping, images, and web search.
      Converging 2026-07-06: Split typed capability status into unsupported vs experimental constants, changed Codex Session startup to an experimental fail-closed error, and documented the capability matrix in README, agents-guide.md, and STABILITY.md. T4.6 still waits on T4.4 before retirement because the app-server proof determines whether Session/interrupt/fork semantics remain experimental or become supported.


