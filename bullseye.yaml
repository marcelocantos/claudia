  T34:
    name: A restarted consumer can recover control of its still-running agents
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`Registry` can reconstruct live `*Agent` handles after the consumer process restarts, without starting a new tmux window or a new provider process: a fresh `Registry` loaded from agents.json obtains working handles for every agent whose tmux window is still alive.'
    - There is a public adoption entry point (e.g. `Attach`/`Adopt`, and an enumeration of live claudia-owned windows). `Start` is no longer the only way to obtain an `*Agent`.
    - '`Registry.Stop(name)` terminates the agent''s tmux window and provider process even when `r.procs[name]` is absent — i.e. it is no longer a silent no-op after a restart. Proven by a test that stops an agent through a Registry that never launched it.'
    - An agent whose window is gone is reported as dead by the adoption path rather than silently re-created, preserving the fail-closed resume property in agent.go:405.
    - 'Oracle, run in CI: start N agents, kill and rebuild the Registry from disk, adopt, then stop all. Zero claudia-owned tmux windows and zero `claude`/provider processes survive. The test fails on any survivor rather than logging it.'
    - jevons upgrades to the new claudia and its restart path adopts instead of re-materialising; after a jevonsd bounce the count of live `claude` agent processes equals the count of registered agents (currently 65 vs 24).
    context: |-
      Ghost agents accumulated on the owner's Mac until 128 GB of RAM was exhausted and the kernel entered a sustained memory-compressor thrash loop (~2 GB/s compress+decompress, 59.7 GB in the compressor, 0.14 GB free, load average 107 against only 60% userland CPU). Diagnosed 2026-08-15.

      Root cause is a missing capability, not a bookkeeping bug. `Agent`'s own doc comment states the tmux substrate "provides crash-survival (the agent stays alive if the consumer process dies)" — and that is true. What is missing is any way to cash it in:

      - `procs map[string]*Agent` is created empty (registry.go:111) and written only inside `Launch` (registry.go:251). `save()` persists `r.agents` (definitions) and never `procs`.
      - The public API is `Start`, `Run`, `SessionJSONLPath`, `SessionExists`. There is no `Attach`, `Adopt`, `Reattach`, or window enumeration. `Start` always creates a NEW tmux window.
      - Therefore after a consumer restart the definitions survive, the handles do not, and cannot be rebuilt.

      Two ghost-producing paths follow, and they multiply:

      1. Restart. jevonsd re-materialises the roster with `Resume: true`, which recovers the CONVERSATION (JSONL) into a NEW process. The previous process keeps running, unreferenced. ~500 materialisations were logged in one day.

      2. Stuck-agent recovery. `Registry.Stop(name)` only acts when `r.procs[name]` exists (registry.go:310); it never consults tmux. After a restart that map is empty, so `Stop` is a silent no-op. jevons's rehydrate path (`internal/fleet/rehydrate.go`, LaunchRecovering → RehydrateLostSessionIn) calls `reg.Stop(name)` precisely to abandon a stuck session before relaunching — and that call does nothing. Because jevons aggressively rehydrates agents it judges stuck, this fires repeatedly for the whole life of the daemon, not just at boot.

      The gap is already solved for one provider and only one: `ConnectURL` + `ConnectPID` give Grok connect-mode a durable endpoint for reattach (🎯T40). Claude agents, which is what the entire fleet runs, have no equivalent. The tmux window ID is the natural analogue and is not persisted for that purpose.

      Observed spread on 2026-08-15: 24 agents per `jevons_agent_list`, 48 in agents.json, 46 tmux windows, 65 live `claude` processes. Four numbers, no reconciliation, and nothing owning the question "is this process supposed to be alive?" — so nothing able to answer no.
    origin: Diagnosed 2026-08-15 from host memory exhaustion on the owner's Mac; see ~/think session.
    discovered: 2026-08-15
