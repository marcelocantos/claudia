  T97:
    name: No hermetic test in the root claudia package lets a wall clock decide its verdict
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '17fd631 (cl-t33) is on local master. Evidence at that commit, all clean GREEN: scanner 52233cd4, guards 4e3d5321, T97 mutation evidence dd697136 (2/2 bite), T91 mutation evidence 868213f3. Full suite at the descendant 7634e06: `GATE make-gate exit=0 GREEN id=df826cc7 tree=clean@7634e06` (inside the freeze window). The t97-pkgs RED 115f3546 was TestCursorReissueKeepsAReplyRacingTheRedelivery, outside the T97 diff; 🎯T92''s 1db738d fixed it (028d9696 GREEN). claudia-po verified the records in ~/.jevons/gates. Hermetic only; no provider wire, so the live rule does not apply.'
    acceptance:
    - 🎯T33's TestHermeticTestsHaveNoWallClockDeadline (or an equivalent guard) scans the root package's hermetic *_test.go files, not only codex/, and is green. Each of the 69 present occurrences of context.WithTimeout / context.WithDeadline / time.After / time.Tick / time.NewTimer / time.NewTicker in root hermetic tests is either repaired to wait on the event the test needs, or carries an in-source exemption naming why that clock cannot outvote the assertion on a loaded host. The guard fails if it scans nothing.
    context: |-
      Found 2026-09-21 by cl-t93-codex-handshake-step while closing 🎯T93. 🎯T33 added TestHermeticTestsHaveNoWallClockDeadline but scoped it to the codex/ package directory (codex/wallclock_guard_test.go reads "." only). The root package — where most of claudia's hermetic tests live, including the whole codex_session / cursor_acp / agent / pool surface — was never covered. Measured at 02cec52: 69 occurrences of the banned constructs across 25 root hermetic test files (acp_steer_test.go 5, agent_test.go 7, cursor_acp_test.go 9, pool_test.go 10, …), e.g. agent_crash_test.go:81 `deadline := time.After(60 * time.Second)` and acp_steer_test.go:534 `context.WithTimeout(context.Background(), 4*time.Minute)`.

      This is the same disease as 🎯T33 / 🎯T65 / 🎯T90 / 🎯T92 / 🎯T93 — a hermetic verdict decided by how fast the host was — and the guard that was supposed to stop it recurring has only ever looked at one of the two packages that need it. Deliberately out of scope for 🎯T93, which closed the complementary hole (a clock living in the PRODUCT and merely armed by a test) with TestHermeticTestsDeclareTheProductBoundsTheyShorten in the root package. That guard and this one are the two halves; this half is a 69-site repair, not a one-liner.

      Some sites may be defensible (a fake's simulated delay, a bound derived from a product constant) — the acceptance allows an in-source exemption rather than forcing a rewrite, but it forces each one to be looked at and answered.

      ROUTING NOTE 2026-09-21 (claudia-po). Give this to cl-t33-codex-load, by name, when it is scheduled.

      That seat wrote the codex-scoped guard this target generalises, and it is the one that measured the scope: ~25 hermetic test files repo-wide use these constructs, and its own words were that generalising is "a real follow-up, not a free win, and not all 25 are defects". cl-t93 independently counted 69 occurrences in the root package alone. Nobody else has that context, and it is a reaped-but-recoverable address (`jevons_agent_start name=cl-t33-codex-load`), so the match survives as long as this note does. It asked for reassignment in its last report and this is the work.

      THE SCOPE NUANCE IS THE TARGET, not a caveat on it. A blanket ban over 69 occurrences would trip siblings' files immediately and would be the wrong shape: some of those occurrences are legitimate. The guard has to distinguish a wall clock DECIDING a verdict from a wall clock merely appearing in a test, and the acceptance should be written so a defensible occurrence can be annotated rather than removed. cl-t33 already hit the design tension when it deliberately scoped its own guard to codex/ rather than the module — read its reasoning before widening it.

      WHY THIS IS NOT SCHEDULED YET, so it is not re-derived as an oversight. 🎯T101 is ahead of it in my queue (recorded in ad2cd7b), and both are held while the host carries five concurrent seats at load 220-290 — which is the fleet's own load, not weather. 🎯T97 has fanout=0 and blocks nothing, so it is the right thing to hold; 🎯T101 gates every Session-wide change's live evidence, so it is the right thing to start first.

      ONE PIECE OF EVIDENCE THIS TARGET INHERITS, and it is the reason the guard matters more than it looks. 🎯T33's guard exists because a wall-clock deadline let a loaded machine decide a hermetic verdict, and 🎯T93 then showed the same disease evades a source-level guard entirely when the bound lives in the PRODUCT and is merely configured short by a test (codex_session_test.go:564, initialize vs thread/start). A grep-based guard over test sources cannot see that case. Decide explicitly whether this target covers it or whether it stays 🎯T93's residue, and say which — an oracle whose own bug class walks past it is a regression net with a hole in it.

      Achieved 2026-09-22: 17fd631 (cl-t33) is on local master. Evidence at that commit, all clean GREEN: scanner 52233cd4, guards 4e3d5321, T97 mutation evidence dd697136 (2/2 bite), T91 mutation evidence 868213f3. Full suite at the descendant 7634e06: `GATE make-gate exit=0 GREEN id=df826cc7 tree=clean@7634e06` (inside the freeze window). The t97-pkgs RED 115f3546 was TestCursorReissueKeepsAReplyRacingTheRedelivery, outside the T97 diff; 🎯T92's 1db738d fixed it (028d9696 GREEN). claudia-po verified the records in ~/.jevons/gates. Hermetic only; no provider wire, so the live rule does not apply.
