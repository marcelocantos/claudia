  T83:
    name: 'A Cursor ACP seat accepts its first prompt: a mint whose delivery sticks is detected and cleared by the harness, not by the consumer killing and reminting the seat'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'ErrCursorPromptStuck (cursor_acp.go:35) is the typed error for a session/prompt that accepts no work. Re-issue recovery happens inside the harness. Hermetic: TestCursorStuckFirstPromptFailsTypedAndLeavesSeatUsable and TestCursorStuckFirstPromptRecoversOnReissue (cursor_stuck_prompt_test.go), both green in `GATE make-gate exit=0 GREEN id=df826cc7 tree=clean@7634e06` and in 028d9696@1db738d. 🎯T92 made the silence watch load-robust, and 🎯T107 pinned the re-delivery window deterministically. Cursor live: `GATE make-live exit=0 GREEN id=1bc0a9f6 tree=clean@994f0e8`. claudia-po verified the records.'
    acceptance:
    - A freshly minted Cursor ACP seat either accepts the first prompt or fails with a typed error naming the stuck delivery; it does not sit accepting nothing while the consumer's queue pins behind it.
    - The stuck-delivery case is recoverable inside the harness (re-issue or re-establish the session) so a consumer does not have to stop, park, start, kill and remint to clear one held brief.
    - 'Hermetic: a fake Cursor ACP peer that accepts session/new and then never answers session/prompt yields the typed error within a bounded wait, and the seat is left in a state a retry can use.'
    context: |-
      Observed 2026-09-20 in an owner-driven jevons smoke test. jevons spawned cl-t81-grok-billing on Cursor; the brief never landed and the seat stayed PINNED with the mint turn never started (no transcript). The overseer's own narration: 'Worker is PINNED — mint turn never started (no transcript). Unsticking via stop/start to drain the held brief… Still PINNED — killing and reminting the seat to clear the stuck sendq. Cursor ACP stuck again on delivery.' Four lifecycle cycles (stop, park, start, kill, remint) inside four minutes before the seat took work. Consumer-side siblings: jevons 🎯T530 / 🎯T599 (held sendq pins a seat), 🎯T629 (never-materialized Cursor seat). Prior art here: 🎯T72.1 (ACP steer prompt-id stack), the Cursor session/load refusal remint.

      MECHANISM, characterised hermetically rather than guessed — from cl-t79-cursor-stream's scout note (stored report 20260920T121857Z-4dc0882c, delivered 2026-09-20T12:18:57Z but routed past the PO hop and only read 2026-09-21 by claudia-po). Recorded here because it is the clearest statement anywhere of why the owner's seat pinned, and it outlived the seat that wrote it.

      Driven against a real Start() with the existing FAKE_ACP_WITHHOLD=session/prompt fixture (no new fixture needed):

          session minted OK: "sess-fake-cursor-1" alive=true
          Send#1 returned err=<nil> after 0s
          Send#2 returned err=cursor acp: prompt already in flight  errors.Is(ErrTurnInFlight)=true
          Send#3 after 2s err=cursor acp: prompt already in flight  alive=true

      The chain:

      1. `cursorACPClient.Prompt` pushes an id on the prompt stack and calls `c.write`, which returns nil the moment the WRITE succeeds. Nothing waits for the peer.
      2. `Agent.Send` returns that nil. So a Send that succeeded is NOT evidence the seat accepted work — it is evidence a line reached a pipe. The harness making the mistake the fleet already learned in jevons 🎯T416: a send is confirmed, not assumed.
      3. The pushed id never settles, because settle runs only on an inbound result. `prompts.inFlight()` stays true forever.
      4. Every later Send hits the inFlight guard and returns `ErrTurnInFlight`, whose wording `agenterr.IsPromptBusy` classifies as BUSY. The consumer sees a live, healthy, permanently-busy seat and queues behind it. That is the pin.

      Why the owner had to kill and remint: from outside there is no difference between "working hard on a long turn" and "never started" — both are alive and busy. Nothing in the harness ever reconsidered, so the seat could only be cleared by destroying it.

      WHY THE BOUND IS NOT A TURN TIMEOUT. A turn timeout would kill long healthy work. The observable that separates the two states is FIRST SIGN OF LIFE: after session/prompt is written a healthy peer sends something inbound for that session — agent_message_chunk, agent_thought_chunk, tool_call, or the result. A stuck mint sends nothing, ever. So the bound is on silence before the first inbound byte of the turn, disarmed by the first inbound message. A ten-minute turn that starts talking in two seconds is never touched.

      TWO RULINGS cl-t79 asked for and did not receive before proceeding. Both are now settled by what shipped in 9bfe2d8, and both were decided the way they proposed; recorded so the decision is not re-litigated by the next reader:
        (a) FIRST PROMPT ONLY, not every prompt. Smaller blast radius, and 🎯T83 is scoped to a freshly minted seat. TestCursorSecondPromptIsNotWatched is the oracle that holds it. A mid-life wedge is out of scope here.
        (b) Send BLOCKS briefly on that first prompt, up to the bound. `Agent.Send` is already synchronous and error-returning, so it is in contract, and the acceptance asks for a typed error on the call that failed — which the IsError-event alternative could not give.

      The Grok sibling of this shape (grok_acp.go:580) is filed as 🎯T89.

      STATUS 2026-09-21: not achieved, and not achievable yet on its own third acceptance clause. That clause asks for a hermetic oracle that "yields the typed error within a bounded wait" — and `TestCursorStuckFirstPromptRecoversOnReissue`, the recovery oracle, is the test that parks indefinitely under load (🎯T92) and takes the whole root package with it. 🎯T83's product behaviour looks right and its five oracles pass on an idle host; what is missing is an oracle whose verdict does not depend on how fast the machine was.

      Achieved 2026-09-22: ErrCursorPromptStuck (cursor_acp.go:35) is the typed error for a session/prompt that accepts no work. Re-issue recovery happens inside the harness. Hermetic: TestCursorStuckFirstPromptFailsTypedAndLeavesSeatUsable and TestCursorStuckFirstPromptRecoversOnReissue (cursor_stuck_prompt_test.go), both green in `GATE make-gate exit=0 GREEN id=df826cc7 tree=clean@7634e06` and in 028d9696@1db738d. 🎯T92 made the silence watch load-robust, and 🎯T107 pinned the re-delivery window deterministically. Cursor live: `GATE make-live exit=0 GREEN id=1bc0a9f6 tree=clean@994f0e8`. claudia-po verified the records.
