  T88:
    name: Concurrent `make live` runs on one host serialize or fail loudly, so a live RED means the code is broken and not that two agents shared a machine
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Two `make live` invocations started concurrently on one host do not both proceed against the same contended resources. The second either waits for the first, or refuses immediately with a named, greppable error saying a live run already holds the host — never runs anyway and reports failures that are really contention.
    - 'The mechanism is a host-wide lock held for the duration of a live run (a lockfile under the claudia state dir, same shape as the plan-usage throttle''s durable state), not an in-process flag: two separate `go test` processes must see each other.'
    - A live run that waited reports that it waited, and for how long, so a slow gate is distinguishable from a hung one in the transcript an agent cites.
    - 'The refusal or wait is provable without real backends: a test takes the lock, starts a second run, and asserts the named error or the wait, with no provider spend.'
    - AGENTS.md's live-tests section states the rule, so an agent reading the gate contract learns that live runs are exclusive before it burns a cycle discovering it.
    context: |-
      Found 2026-09-20 by claudia-po while running seven Opus seats in one checkout, several carrying mandatory live gates.

      cl-t77-live-tmux produced the decisive evidence: its first live run went RED across BOTH packages, including `daemon`, which its change does not touch and which already uses private tmux sockets. A single symptom spanning a package it never edited is not a regression — it is host contention. Its own conclusion, before any prompting: "this is host-wide, not my regression. Checking for a concurrent live run."

      Live runs contend for more than the tmux socket: provider auth, the shared daemon, and — decisively — plan capacity. Precedent from 2026-09-12 in this repo: "Confirmed the Claude usage endpoint is returning HTTP 429 (plan exhausted), which explains the blank panes/early exits on Claude seats while Grok and Cursor pass." The blank-pane fast-exit signature is what plan pressure looks like from inside a live test, and two concurrent live runs make it far likelier.

      Why this matters beyond one night's fleet: AGENTS.md makes `make live` a hard gate and says "You are the gate." A gate that goes RED for reasons unrelated to the diff teaches agents to re-run until green, which is precisely the habit that makes a green uncitable. 🎯T33 and 🎯T65 are the same disease at hermetic scale (load-sensitive tests); this is its live-tier form, and it is worse because a live RED costs plan capacity to reproduce.

      The workaround tonight was a human-held mutex: the PO telling one seat to run and the others to hold. That does not survive the PO being unreachable — which is exactly what happened minutes later when the fleet MCP server dropped, leaving the mutex grant undelivered.
    tags:
    - live
    - tests
    - gates
    - concurrency
    - host
    origin: manual
    discovered: 2026-09-20
