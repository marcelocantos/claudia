  T79:
    name: Every Session backend's turn text concatenates append-flagged streamed deltas, so WaitForResponse and the goal loop judge the reply the provider actually sent
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`CLAUDIA_CURSOR_LIVE=1 go test -run ''^TestCursorSessionLiveSmoke$'' .` passes: a reply streamed as several agent_message_chunk updates ("p", "ong") is returned as "pong", not "p\nong".'
    - 'The fix is in the SHARED turn accumulator, not the Cursor path: `agent.go` WaitForResponse and `goal.go` noteGoalEvent both honour `PreviewUpdateAppend` (concatenate the suffix delta) and keep the newline join for events that are not append-flagged. A Cursor-only fix does not satisfy this target.'
    - 'Grok Session is proven fixed too, not assumed: `grok_acp.go` sets the same append flag, so the `CLAUDIA_GROK_LIVE=1` rows — including `TestGoalJourneyLiveBackends/grok` — are green, and the goal loop no longer judges a corrupted turn on an ACP backend.'
    - 'Claude''s block-newline behaviour is pinned and unbroken: one terminal message spread across content blocks still joins with newlines, proven by a hermetic case AND by the `CLAUDIA_LIVE=1` Claude rows including `TestGoalJourneyLiveBackends/claude`. This is the regression the fix could silently cause.'
    - 'Hermetic: a Cursor ACP fixture publishing a reply in multiple chunks yields the concatenated text from WaitForResponse; the mutant that joins chunks with "\n" fails it. The ACP fake can stream a reply as several deltas (it previously always replied in one chunk, which is why the suite never saw this), and its default behaviour is unchanged when that mode is off.'
    context: |-
      Found 2026-09-17 in the v0.37.0 release live gate: TestCursorSessionLiveSmoke failed with `response "p\nong", want pong`, and fails identically on fde8a89 (before the 🎯T75 work), so it is pre-existing.

      2026-09-20, cl-t79-cursor-stream diagnosed the mechanism and it is NOT in the Cursor path. `cursor_acp.go` already publishes each agent_message_chunk correctly flagged `PreviewUpdate=PreviewUpdateAppend` ("Text is a suffix delta to append"). The corruption is in the shared turn accumulator, which ignores that flag and inserts "\n" between every assistant event: `agent.go:1841-1844` (WaitForResponse — the "p\nong" the live smoke reports) and `goal.go:101-105` (noteGoalEvent — so the goal loop judges a corrupted turn on EVERY ACP backend). `grok_acp.go:442` sets the same flag, so Grok Session carries the bug too.

      The newline is correct for Claude (one event per content block) and wrong for ACP token deltas, which is why the fix must be flag-driven rather than a blanket change of the join.

      The hermetic suite never caught it because `testdata/cursor/acp/fake_acp.py` always replied in a single chunk — the fixture could not express the failing shape. Widening the fake is part of the fix, not incidental.

      Target renamed and widened 2026-09-20 by claudia-po: the original wording ("A Cursor Session's WaitForResponse...") would have been satisfied by a Cursor-only patch, leaving Grok Session and the goal loop broken on the same defect. AGENTS.md's live rule — a Session-wide change is every Session backend you can authenticate, the T39 lesson — is what makes the three live gates load-bearing here rather than optional.
    tags:
    - cursor
    - grok
    - acp
    - session
    - live
    - regression
    origin: v0.37.0 release live gate
    discovered: 2026-09-17
