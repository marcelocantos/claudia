      (2) TestGrokTaskToolRestrictionsFailClosed (hermetic, GROK_BIN -> fake CLI that SUCCEEDS, so it cannot pass for the wrong reason on hosts with grok installed). Mutation-tested: deleting the guard makes it FAIL with "Grok Task.Run dropped DisallowTools and spawned anyway". Over-broadness covered by TestGrokTaskWithoutRestrictionsIsNotBlocked, which requires an unrestricted task to reach a TaskEventResult through the real backend.

      (3) TestGrokCapabilityMatrixIsExplicit + TestGrokCapabilityMatrixMatchesBackendClaims (union-over-backends, since Grok splits Task/Session across grokTaskBackend and grokAgentBackend; has a t.Fatal vacuity guard). Found and closed a real blind spot: backendCapabilityNames has no providerCapabilities field for tool_restrictions, so the wired/claimed ratchet structurally could not see it — flipping the claim AND the want map left everything green with argv unwired. Added TestGrokToolRestrictionsClaimTracksTheArgvBuilder, mutation-verified to go red on exactly that edit.

