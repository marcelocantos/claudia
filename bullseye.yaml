  T74:
    name: 'Grok plan usage survives the six-hour access token: a billing 401 rotates the login token through the CLI and retries, so usage reporting no longer needs a manual grok login every six hours'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Landed on claudia master (this commit). fetchGrokBilling answers a billing 401 by rotating the login token — PlanUsageArgs.GrokTokenRefresh, default defaultGrokTokenRefresh: one headless grok -p turn (max-turns 1, throwaway cwd, 90s bound) which rewrites ~/.grok/auth.json the way the CLI does on start — then reloads the token and retries the GET once; a 401 that survives, or a failed rotation, is reported naming the attempt; rate-limited to one rotation per ten minutes per process (grokRefreshGate); never for a non-401 failure; GrokRefreshDisabled turns it off. Hermetic: TestGrokPlanUsage401RotatesTokenAndRetries (401 → rotation → retry with the new bearer; second 401 inside the window does not rotate; after the window it does; failed rotation is loud) and TestGrokPlanUsageNon401DoesNotRotate; TestGrokPlanUsageLive unchanged (opt-in). make gate: vet, tests (-race), stability surface, mutation evidence all green 2026-09-16. docs/plan-usage.md and agents-guide.md say the token is rotated on 401 and grok login is needed only when the refresh token is gone. Mechanism verified live 2026-09-16 16:02 local before implementation: with expires_at in the past, one headless grok call rewrote auth.json and the next billing GET answered weekly=29%. Residue: the running development broker is the v0.35.0 image; this reaches production on the next release and broker restart, and the first natural token expiry after that is the owner-visible proof.'
    acceptance:
    - fetchGrokBilling answers an HTTP 401 by rotating the login token — one headless grok one-shot (grok -p, max-turns 1, throwaway cwd, bounded) which rewrites ~/.grok/auth.json the way the CLI does on start — then reloads the token and retries the GET once. A 401 that persists after the rotation is reported as such, naming the attempt.
    - The rotation is rate-limited to one attempt per ten minutes per process, never runs for a non-401 failure (missing auth.json, network, parse), and is injectable (PlanUsageArgs.GrokTokenRefresh) so hermetic tests and consumers can observe or replace it.
    - 'Hermetic: an httptest billing server answers 401 until a fake refresher rewrites the auth file, then 200 with the captured fixture; the oracle asserts the retry carries the new bearer, the refresher ran once, and a second 401 inside the window does not run it again. TestGrokPlanUsageLive (opt-in) still passes against the real endpoint.'
    - docs/plan-usage and agents-guide say the token is rotated automatically on 401 and that grok login is only needed when the refresh token itself is gone.
    context: 'Owner 2026-09-16: ''Why is grok failing to report usage again? I just refreshed the login.'' then ''This is a claudia requirement.'' Evidence: xAI writes ~/.grok/auth.json with a six-hour access token (create_time 2026-09-15T07:00:31Z, expires_at 13:00:31Z) plus a refresh_token and the offline_access scope; loadGrokToken reads only the access token and fetchGrokBilling reports a 401 as ''run grok login''; the grok CLI rotates the pair only when it starts. Experiment 2026-09-16 16:02 local: with expires_at set to the past, one headless grok -p call rewrote auth.json (create_time 06:02:43Z) and the forced re-fetch then reported weekly=29%. A jevons-side one-shot (jevons d2f8ba88) proved the mechanism and was reverted the same day as the wrong layer; jevons 🎯T666 is set aside pointing here. Exchanging the refresh_token at auth.x.ai directly would avoid the model call, but the CLI''s own rotation is the sanctioned path and needs no reverse-engineered endpoint.'
