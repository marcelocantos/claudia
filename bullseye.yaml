  T105:
    name: A turn ended by a dropped broker frame is diagnosed as a dropped frame, not as silence
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '936b265 (cl-t108): ErrFramesDropped alongside ErrTurnAbandoned. turn_wait_t105_test.go has three tests, each RED under its mutation. Gates: `GATE t105-make-gate exit=0 GREEN id=109978cc tree=clean@936b265`, and the full suite at the descendant 7634e06, `GATE make-gate exit=0 GREEN id=df826cc7` (inside the freeze window). claudia-po verified both records. Residue: no live run. Only the text and the wrapped errors of an existing silence conviction change; no provider protocol does.'
    acceptance:
    - When brokerClient.readLoop skips an unrelayable frame and the turn that frame belonged to then ends on the silence bound, the error the caller receives distinguishes that cause from a genuinely silent agent — it does not report only ErrTurnAbandoned ("turn went silent and never ended"), which in that case is false. A hermetic test drops a terminal event as an oversized frame and asserts the resulting error names the drop.
    context: |-
      Found by cl-t73-frame-cap-land while checking that 🎯T73 composes with 🎯T96, at source level under the evidence freeze (no gate run). 🎯T73 deliberately turned an unrelayable frame from a connection-wide failure (the 🎯T661 incident: a 1.2 KB send died behind a screenshot) into a single lost event; broker_client.go readLoop now continues on broker.ErrFrameTooLarge. 🎯T96s silence bound is what stops the resulting hole being an infinite park, and that part composes well. The gap is the DIAGNOSIS: turn_wait.go:15-22 defines ErrTurnAbandoned as nothing at all arrived, no event of any type, no terminal byte — which is not what happened. The true cause sits in brokerClient.dropped/lastDrop, but brokerClient is unexported so nothing surfaces it (cl-t73-frame-caps comment claimed a consumer could find out; corrected in fb2927f to say it cannot). Narrow: with producer-side bounding in place a terminal event is essentially always framable, degrading to elision markers plus Truncated, so this is a backstop against a peer that does not bound rather than an expected path. Filed not fixed, because surfacing the count is a public API decision 🎯T73 did not ask for.

      Achieved 2026-09-22: 936b265 (cl-t108): ErrFramesDropped alongside ErrTurnAbandoned. turn_wait_t105_test.go has three tests, each RED under its mutation. Gates: `GATE t105-make-gate exit=0 GREEN id=109978cc tree=clean@936b265`, and the full suite at the descendant 7634e06, `GATE make-gate exit=0 GREEN id=df826cc7` (inside the freeze window). claudia-po verified both records. Residue: no live run. Only the text and the wrapped errors of an existing silence conviction change; no provider protocol does.
