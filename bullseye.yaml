    - 'Cost tracking is exported library API (🎯T75): an accumulator sums spend in real time from per-turn token counts (Task mode CostUSD field; Session mode derived from usage blocks + built-in price table) for the agents it watches. An in-process application gets rolling cost with no daemon.'
