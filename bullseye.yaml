  T16:
    name: Model selection never fails silently — the resolved model is observable and an unusable model is a loud error
    status: achieved
    value: 5.0
    cost: 5.0
    actual_cost: 5.0
    attestation: 'Independent PO gate: product SHA 759b59e17552f4ea25fbf2b8d4ef294535dc4576 — T16 model selection never fails silently (resolve + fail-loud). Additive TaskEvent.Model/Task.Model + Event.Model/Agent.Model; Claude parse model_not_found loud; Codex app-server model + failure; Bedrock resolved model hermetic. Oracle EXIT 0: go test -count=1 -timeout 120s -run ''TestParseEventCapturesResolvedModel|TestParseEventModelNotFoundIsError|TestParseTaskSystemCapturesResolvedModel|TestParseTaskResultErrorIsLoud|TestParseTaskResultIsErrorTrueDespiteSuccessSubtype|TestParseTaskModelNotFoundFixture|TestWaitForResponseModelNotFoundIsLoud|TestCodexAppServerThreadStartReportsModel|TestCodexAppServerFailureIsErrorEvent|TestHermeticBedrockTaskReportsResolvedModel|TestHermeticBedrockTaskMissingModel'' . → ok. Residual class-3: CLAUDIA_LIVE ModelObservable/ModelNotFoundLive. Local master T104; library not daemon (T194 N/A).'
    acceptance:
    - 'Every backend (claude stream-json, codex app-server, bedrock) reports the RESOLVED model on the session, exposed additively: Task mode via `TaskEvent.Model` on the init event plus a `Task.Model()` accessor; Session mode via `Event.Model` parsed from the assistant event''s `message.model` plus an `Agent.Model()` accessor. A consumer can assert requested-vs-resolved and detect drift or silent fallback.'
    - 'A model a backend cannot serve NEVER fails silently. Task mode: it surfaces as `TaskEventError` whose message names the offending model (verified against the real claude shape — an unknown model is echoed in init, then fails mid-turn with a `<synthetic>` model and an error result). Session mode: `WaitReady`/`WaitForResponse` returns a descriptive error instead of hanging to context timeout. The load-bearing failure shapes are resolved by a live experiment FIRST (T5-style), then the detector is built against them.'
    - 'NO hardcoded or validated model allowlist is added to the public API. Rationale (empirically established): the `claude` CLI cannot enumerate models (no `--list-models`/`claude models`; `--model` help gives examples only), models churn constantly, and a static list would churn the frozen-v1.0 surface and reject models the installed binary already supports. `model` stays a free-form string; correctness comes from resolution + error observability, not a maintained list.'
    - Genuinely closed, CLI-enumerated choice sets MAY gain typed constants/validation — `--permission-mode` (acceptEdits/auto/bypassPermissions/manual/dontAsk/plan), `--effort` (low/medium/high/xhigh/max), `--output-format` — because `claude --help` enumerates them, they change rarely, and invalid values fail. This is the deliberate opposite call from `model`.
    - Additive only — no public-API removals, signature changes, or exported-field type changes — so the T1.6 shakeout clock is not disturbed. Each backend's init/error/model parsing is unit-tested with transcript fixtures; the end-to-end fail-loud path is covered by a CLAUDIA_LIVE test per backend.
    - 'Docs (agents-guide.md + STABILITY.md) state: the model is fixed at process launch, must be passed on every spawn, and cannot be changed on an already-running/attached instance except via an in-session `/model`; and document the resolved-model accessors and the fail-loud contract.'
    context: |-
      User mandate 2026-08-08: 'I don't want silent failures.' Empirical findings this session (claude CLI v2.1.201): `--model fable` resolves to `claude-fable-5` and is honored on fresh `-p` and on `--resume`; an INVALID model is NOT rejected at launch — it is echoed verbatim in the init event, then the turn fails mid-stream with a `<synthetic>` model and an error result (the silent-ish hazard). The CLI has no model enumeration (only `--help`, which does list `choices:` for the closed flags permission-mode/effort/output-format). Persisted transcripts (what Session mode tails) carry the resolved model on `assistant` events at `message.model`; Task-mode stdout stream-json carries it on the init event. The original trigger was jevons (remote control for Claude Code instances) appearing to 'stick with opus 5' when set to fable — root cause was jevons not passing `--model` / attaching to a running instance, but it exposed that claudia gives no way to observe the resolved model and no loud signal when a model is rejected (Session mode just hangs to ctx timeout). Design decision (delegated to the agent): observability + fail-loud at the backend-interface level, NOT an allowlist. NOTE the codebase now has three backends (task.go/claude, codex_app_server.go, bedrock.go) all implementing RunTask, so the contract must be defined on the backend interface; relates to T14 (Codex support) which must comply. Deliberately NOT rushed into a single PR at the tail of a long session because a reliability change across an evolving multi-backend abstraction edited by concurrent sessions must be built carefully with per-backend oracle coverage — rushing it would risk introducing the very silent bug it aims to remove.

      Achieved 2026-08-09: Independent PO gate: product SHA 759b59e17552f4ea25fbf2b8d4ef294535dc4576 — T16 model selection never fails silently (resolve + fail-loud). Additive TaskEvent.Model/Task.Model + Event.Model/Agent.Model; Claude parse model_not_found loud; Codex app-server model + failure; Bedrock resolved model hermetic. Oracle EXIT 0: go test -count=1 -timeout 120s -run 'TestParseEventCapturesResolvedModel|TestParseEventModelNotFoundIsError|TestParseTaskSystemCapturesResolvedModel|TestParseTaskResultErrorIsLoud|TestParseTaskResultIsErrorTrueDespiteSuccessSubtype|TestParseTaskModelNotFoundFixture|TestWaitForResponseModelNotFoundIsLoud|TestCodexAppServerThreadStartReportsModel|TestCodexAppServerFailureIsErrorEvent|TestHermeticBedrockTaskReportsResolvedModel|TestHermeticBedrockTaskMissingModel' . → ok. Residual class-3: CLAUDIA_LIVE ModelObservable/ModelNotFoundLive. Local master T104; library not daemon (T194 N/A).
    origin: user request 2026-08-08 (no silent failures)
    discovered: 2026-08-08
    achieved: 2026-08-09
