      `make gate` on a CLEAN detached worktree at ed0a30b, exit 2:

          panic: test timed out after 10m0s
            running tests:
              TestCursorStuckFirstPromptRecoversOnReissue (9m31s)
          goroutine 460 [select, 9 minutes]:
            (*Agent).WaitForResponse  agent.go:1864
            TestCursorStuckFirstPromptRecoversOnReissue  cursor_stuck_prompt_test.go:114
          FAIL  github.com/marcelocantos/claudia  600.544s

      Every other package was green in that run. The last line before the park is this target's own warning — `bound=400ms observed="no inbound message of any kind in 402ms"`. So: the 400ms bound convicts a peer that was about to answer, the harness re-establishes the turn, and the reply the caller is waiting for belongs to the abandoned delivery. Whether that shows up as `reply ""` or as an indefinite hang is a race between the late reply and the assertion — two faces of one fault, and the hang is the expensive face because it costs the whole suite rather than one test.

      Reproduced at the PARENT commit too, which is how it was attributed away from 🎯T91: on a clean worktree at e18806d, `go test -count=20 -race -timeout 180s -run '^TestCursorStuckFirstPromptRecoversOnReissue$' .` under sustained load → exit 1, `panic: test timed out after 3m0s`, the same goroutine parked at the same agent.go:1864 from the same cursor_stuck_prompt_test.go:114, after `observed="no inbound message of any kind in 407ms"`. The same command passed 20/20 in 17.436s at load average 61 — timing-sensitive, not deterministic, which is the argument for fixing the bound rather than chasing the flake.

