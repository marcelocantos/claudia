      (1) The first draft called `cursorPromptSilenceBound` "a constant chosen against an idle machine". It is not. cursor_acp.go:95-113 documents the measurement: three real cursor-agent mints timed from session/prompt to first inbound message — 14.0s, 14.1s, 18.3s, first arrival an agent_thought_chunk rather than reply text — with the bound at 120s, ~6.5x the worst observed, and the asymmetry stated outright ("Recovery is cheap and a false positive is not, so the generous side is the correct side to err on"). It also bounds SILENCE BEFORE THE FIRST INBOUND MESSAGE, disarmed by the first thing the peer says, not turn duration — which is what makes a bound safe here at all. That is a well-built constant and it is not the defect.

      The defect is the ORACLE's bound. `shortenCursorSilenceBound(t, 400*time.Millisecond)` gives the fake peer a margin of about 1.0x — the failing run observed 402ms against a 400ms bound — where the product gives a real peer 6.5x. The test is therefore not a scaled model of the shipped behaviour; it is a much tighter experiment that fails for a reason the product would not. Preserve the margin or, better, drive the fake peer from a signal so no clock decides the verdict. That is exactly 🎯T33's repair, now owed to a test in 🎯T33's own family.

      (2) cl-t79's finish report (stored report 20260920T142957Z-d18e9923) carries this residue line: "root package in the SHARED DIRTY TREE parks 60s in WaitForResponse (agent.go:1864) from another seat's uncommitted work; reproduced deterministically at load 116 and 214; passes clean at same SHA; not diagnosed, not my paths". The observation is real and the attribution is wrong, and acting on it would have sent someone hunting through cl-t47.1's uncommitted broker work for a defect that is in committed code. The same park reproduces on CLEAN detached worktrees with `git status --porcelain` empty, at both e18806d and ed0a30b, in the same frame — see the evidence above. cl-t79 was not careless: their clean run of this test passed once, in 1.00s, and their scoped regex (`^TestACP|^TestT50|^TestAwaitPeerActivity|^TestCursorPromptWithoutWakePath`) did not cover it. One green sample of a load-sensitive test is the thing this whole target family exists to distrust.

      Also worth keeping: cl-t79 was instructed not to run the full-suite `make gate` ("residue full-suite make gate NOT run, per your instruction"), which is why the hang reached the review rather than being caught at the seat. A scoped green is cheaper, and on a load-sensitive package it is not evidence the suite finishes.

