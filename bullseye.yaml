  T75:
    name: Every claudia capability that does not imply a server is available to an in-process library consumer; the daemon adds host-wide scope and passes the rest through
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'claudia 4088dca..414cc06 (16 commits, local master). Every non-server mechanism is exported library API with direct-mode oracles (Registry.ResumeAll, SubscribeSeatEvents, Migrate recording, Registry.Rewind, PlanUsageMonitor + direct 429 invalidation, MCPHost/SetMCPHost, RunModelIntelRefresher, AcquireDirect, SetDirect/StartDirect); the daemon is package claudia/daemon built only on exported API (import-graph test in make gate); Rewind, GoalCompleteCheck, Task.SetRawLog and Acquire/Release pass through to daemon-held seats; agents-guide.md and docs/metaharness.md state the rule. All children T75.1–T75.10 and T64 achieved on independent vcheck PASS. vcheck PASS 2026-09-17 at 414cc06: `make gate` → exit 0; 16 named root direct-mode tests → PASS; 9 named daemon pass-through tests + TestDaemonImportsOnlyTheLibraryAndTheWire → PASS; live TestAcquireLive PASS (TestRewindLive, TestGoalCompleteCheckLive PASS in child checks). Residue: Codex live gates unverified (ChatGPT usage limit until 2026-09-19 18:10); pooled agents publish no turn events (🎯T78); auto-actuating policy (T2.2–T2.6, T2.12) not built; completeness of the capability list rests on the 2026-09-17 audit, not an oracle.'
    acceptance:
    - 'An application that imports claudia with no daemon (no socket, or `CLAUDIA_NO_BROKER=1`) gets every capability a daemon consumer gets, except the ones that imply a server: the socket and wire, connection-scoped seat ownership (`grant_held`, `not_owner`), seats outliving the consumer process, the unowned-seat replay ring and reclaim by name, being the single usage evaluator for the host, and service install plus the `claudia broker` CLI.'
    - 'Daemon handlers are pass-through: each decodes a request, calls exported library API, and encodes the reply. Mechanism and policy (resume, persistence, usage tracking, MCP hosting, lifecycle events, and every future scheduler or controller) live in the library; the daemon supplies host-wide scope and turns opt-in behaviour on.'
    - 'The reverse also holds: every library capability that can cross a socket is reachable on a daemon-held seat or run. 🎯T64 (Acquire and the pool) is part of this set.'
    - '`agents-guide.md` and `docs/metaharness.md` state the rule, and the guide''s list of what direct mode lacks contains only the server-implying items above.'
    - All dotted children are achieved.
    context: |-
      Owner 2026-09-17: claudia moved from a library to a server, but some applications still need it as a library. Rule set that day: everything that can feasibly be implemented in the library is, including future work; the server exposes it by pass-through. This amends the 2026-09-12 metaharness split, which assigned rebind, reaping, preemption, AIMD and cost tracking to the daemon on principle (🎯T2, 🎯T2.2, 🎯T2.4, 🎯T2.5, 🎯T2.6, 🎯T2.12 are reworded to match).

