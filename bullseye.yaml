      Process groups cannot do this. The claude processes are children of the claudia tmux server, not of jevonsd, and cmd/detach exists specifically so a process-group sweep of the caller does not reach the work. On macOS a dead parent reparents children to launchd; the group is not signalled. Linux PR_SET_PDEATHSIG has no macOS equivalent.

      The load-bearing cleanup is therefore named, not implicit: Stop/StopAll must kill the session's tmux window even when r.procs is empty, and Launch/StartAll must reap any leftover window for that session before spawning a replacement with --resume. Crash leftovers are reaped on the next StartAll. The watchdog is the crash supervisor; it does not need to own a process group.

