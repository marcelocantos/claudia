  T20:
    name: A claudia fleet agent's test environment is not silently mutated by the harness it runs under
    status: achieved
    value: 4.0
    cost: 2.0
    actual_cost: 2.0
    attestation: |-
      Product SHA 0961582 on local master, "T20: stop test-control env vars leaking into fleet agent shells". INDEPENDENT PO GATE 2026-08-09 — verifier did not write the code (🎯T31); the implementer reported evidence and left the achieve to the PO.

      ROOT CAUSE (correctly diagnosed, spawn-side not test-side): a tmux server freezes the environment of whichever process started it as its GLOBAL environment, and windows inherit that global env rather than the env of the client running new-window. TestCrashSurvivalHelper is by design a process that outlives its parent, so when it brought the shared claudia server up, CLAUDIA_CRASH_TEST_HELPER=1 was baked in for the server's life — every fleet agent window created since inherited it. The implementer also found a second helper pair (CLAUDIA_POOL_CRASH_HELPER/WORKDIR) the PO had not spotted.

      Scope: 6 files, +500/-2 — Makefile, internal/testctlenv/{testctlenv.go,testctlenv_test.go}, internal/tmuxagent/{server.go,server_test.go}, testctlenv_leak_test.go. Gate confirmed via `git show --stat 0961582 -- agent_crash_test.go pool_test.go` that both guarded test files are UNTOUCHED: the variable was not renamed and TestCrashSurvival's coverage was not weakened, as required.

      ORACLE RE-RUN BY THE GATE in an isolated worktree at 0961582 — six named tests, all observed PASS, no skips: TestNoTestControlEnvLeak (root), TestRegistryMembershipPinned / TestStripRemovesOnlyTestControl / TestLeakedHelpersReportsPresentEvenWhenEmpty (internal/testctlenv), TestEnsureServerStripsTestControlEnv / TestEnsureServerScrubsAlreadyRunningServer (internal/tmuxagent).

      THE DECISIVE CHECK — oracle behaviour UNDER an injected leak, run by the gate: `CLAUDIA_CRASH_TEST_HELPER=1 CLAUDIA_CRASH_TEST_WORKDIR=/tmp/fake go test -run TestNoTestControlEnvLeak .` → FAIL, exit 1, naming both variables and printing the tmux show-environment command to locate the source. The former silent 600s hang is now a fast, self-explanatory failure. This is the property the target exists for.

      MUTATION PROOF BY THE GATE — each reverted, sources restored byte-identical:
      - M1 drop CLAUDIA_CRASH_TEST_HELPER from the Helpers() registry → KILLED by TestRegistryMembershipPinned, TestStripRemovesOnlyTestControl.
      - M3' neuter scrubServerEnv, the sole production guard (early `return nil`) → KILLED by TestEnsureServerScrubsAlreadyRunningServer AND TestEnsureServerStripsTestControlEnv.
      - M4 over-broadness: add provider config CLAUDIA_CODEX_AUTH_PATH to the strip → KILLED in two independent places, TestRegistryMembershipPinned and TestEnsureServerStripsTestControlEnv. The strip is pinned in both directions: it cannot silently narrow, and it cannot widen into agent configuration.

      WIRING (the target requires a standing enforcement point, not an unwired helper): all six are ordinary Go tests in packages `go test ./...` already covers, and .github/workflows/test.yml invokes `go test -race -count=1 ./...` bare. The implementer additionally removed a status-swallowing pipe from the Makefile `bullseye` gate — it ran `go test ... | tail -n 5 && echo "✓ tests"`, so a FAILING suite printed "✓ tests" and exited 0. That is the same exit-status trap that produced a false green earlier in this session; an oracle behind that pipe was not wired at all. Gate confirms it is now bare.

      DISCREPANCY FOUND BY THE GATE, recorded rather than smoothed over: the implementer's report claims the server is started with `cmd.Env = testctlenv.Strip(os.Environ())`. It is not — server.go:99 starts it with raw `os.Environ()`, and `testctlenv.Strip` has NO production call site anywhere in the tree (verified by grep across all non-test .go files; only `All()` is used, by scrubServerEnv). The leak is nonetheless genuinely closed, because scrubServerEnv runs on EVERY EnsureServer call and covers both the new-server and existing-server paths — mutation M3' proves that guard is real and oracled. So the acceptance holds, but the belt-and-braces described in the report is absent, and Strip is exported, unit-tested, and dead. Residual, filed as follow-up rather than blocking: (a) remove or actually use Strip; (b) the brief window between `new-session` with a polluted env and scrubServerEnv is theoretically inheritable, though EnsureServer completes before any agent window is created.

      REGRESSION: full `go test -race -count=1 ./...` exit 0 and `go vet ./...` exit 0. Notably the gate's own shell now reports no CLAUDIA_* variables at all and the live tmux server's global environment is clean — the implementer scrubbed the running server by hand so the in-flight fleet was fixed immediately rather than at next spawn.

      ACCEPTED JUDGEMENT CALL (flagged by implementer, PO concurs): two enforcement tiers. Handshake vars hard-fail the process-start oracle since no human legitimately sets them; LIVE gates are stripped at spawn but NOT asserted-unset at process start, because `CLAUDIA_LIVE=1 go test ./...` is a legitimate owner invocation and is indistinguishable from a leak by inspection. The spawn-side strip still guarantees no fleet agent inherits them ambiently, which is the property the target needs.
    acceptance:
    - '`go test ./...` behaves identically inside a claudia-spawned tmux fleet agent and in the owner''s own shell — no test is un-skipped, skipped, or rerouted purely because of who launched the shell.'
    - 'Specifically: CLAUDIA_CRASH_TEST_HELPER (and CLAUDIA_CRASH_TEST_WORKDIR) do not reach an agent''s interactive shell. The crash-test helper''s control variables are scoped to the subprocess TestCrashSurvival spawns and no further.'
    - An executable oracle fails when a test-control variable leaks into an agent environment — e.g. a test that asserts the documented set of CLAUDIA_* test-control variables is unset at process start, so any future leak is caught rather than silently changing what the suite does.
    - 'Mutation-verified: reintroducing the leak (exporting CLAUDIA_CRASH_TEST_HELPER=1 into the agent''s environment) turns that oracle RED. An oracle that stays green with the leak present is worthless.'
    - The guard is wired to a standing enforcement point (the normal `go test ./...` path or a CI/hook gate), not left as an unwired helper an agent must remember to run.
    context: |-
      Found by the claudia PO gate on 🎯T4.4 (2026-08-09), and it cost real time. `TestCrashSurvivalHelper` in agent_crash_test.go is guarded by `if os.Getenv("CLAUDIA_CRASH_TEST_HELPER") != "1" { t.Skip(...) }` — correct in isolation. But claudia fleet agents run *inside* claudia-spawned tmux sessions, and that variable (plus CLAUDIA_CRASH_TEST_WORKDIR, pointing at a stale TestCrashSurvival temp dir) was present in the agent's own shell environment. The helper therefore did NOT skip: it called Start(), launched a real agent, and blocked forever, so `go test ./...` hung until the 600s panic timeout. The gate nearly filed a non-existent repo defect over it; re-running with `env -u CLAUDIA_CRASH_TEST_HELPER -u CLAUDIA_CRASH_TEST_WORKDIR` was green in ~10s.

      Why this is not cosmetic: every green a claudia fleet worker reports is produced under an environment the owner never runs. Today it manifests as a hang (loud). The dangerous version is the inverse — a leaked variable that makes a test SKIP inside a worker while passing on the owner's machine, so a worker reports green for a test that never executed. That is exactly the verification-honesty failure mode the fleet's oracle-first doctrine exists to prevent (headline numbers must come from the shipped path, and gate inputs must not be self-owned by the executor's environment).

      Note the fix is likely in how the agent process is launched (environment inheritance at spawn) rather than in the test itself; investigate both sides before choosing. Do not "fix" it by renaming the variable — that moves the leak, it does not close it.

