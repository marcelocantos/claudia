    context: 'Spike 2026-07-26 (scripts/spike-grok-tmux.sh): all 8 gates PASS — spawn, ready, send, wait via updates.jsonl, MCP new, MCP resume, interrupt, no menu wedge with -s uuid. Motivated by Grok ACP session/load ignoring mcpServers (CLI bug). ACP may remain available as alternate transport later.'
