    attestation: Product SHA d8a0309899a75fbbd0d1021fe1b2e92e18e0cd5f on local master. parseGrokBilling treats absent creditUsagePercent as 0% used when config.currentPeriod.type is USAGE_PERIOD_TYPE_WEEKLY; without weekly descriptor still unavailable. Hermetic oracle go test -count=1 -run 'TestParseGrokBilling|TestGrokPlanUsage' . → PASS (ok github.com/marcelocantos/claudia). Fixture testdata/grok/billing_rollover.json pins the 2026-09-19 rollover case; TestParseGrokBillingFailLoud mutant-kills treating any absent percent as zero. Local only (T104).
    acceptance:
    - '`parseGrokBilling` treats an absent `config.creditUsagePercent` as 0% used (100% remaining) when the payload is otherwise a well-formed weekly view (`config.currentPeriod.type == USAGE_PERIOD_TYPE_WEEKLY`), because the surface is protobuf-JSON and omits zero-valued scalars.'
    - 'A payload with neither `creditUsagePercent` nor a weekly `currentPeriod` still reports unavailable with the surface-changed reason: absence alone never becomes a number.'
    - 'Hermetic: the captured 2026-09-19 rollover payload yields weekly remaining 100%; the same payload without `currentPeriod` yields unavailable; a payload carrying a percent is unchanged. A mutant that returns 0% used for any absent percent fails the second case.'
    context: |-
      Found 2026-09-19 answering "what's wrong with Grok?": `claudia broker usage` reported grok unavailable with "response carries no creditUsagePercent (private surface may have changed)". Evidence: the endpoint answers HTTP 200 with the weekly descriptor and no percent; the weekly period had rolled over that morning at 01:53Z; Grok's own usage panel read "0% used, resets September 26 at 11:53 AM" at the same moment, matching the payload's period end exactly (owner screenshot); and the installed grok CLI 1.0.34 binary still contains the string `creditUsagePercent`, so the field is still in the contract.

      Why the field is absent is not established. The payload is protobuf-JSON (`.val` wrappers, `USAGE_PERIOD_TYPE_*` enums), which omits zero-valued scalars; the owner's reading is that usage is summed from turn records and an empty set returns null. A single small Grok turn did not bring the field back within a couple of minutes, which distinguishes neither (billing lag is unmeasured). Both readings mean the same thing for the parser, so the fix does not depend on it. The fail-loud rule stays for a genuinely changed surface; only the zero case is reinterpreted, anchored on the weekly descriptor.

