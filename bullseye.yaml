    acceptance:
    - '`Agent.WaitForResponse` cannot park indefinitely on a context that does not expire: given a turn whose terminal event is never delivered, it returns an error that names the turn it was waiting for and what it last saw, rather than blocking until the caller''s context is cancelled. A hermetic test drives exactly that — subscribe, dispatch a non-terminal update, never send a terminal — and asserts the error arrives, with `-count` high enough that a 50/50 race would have been caught. The bound is not a bare wall-clock constant chosen against an idle machine (that is the 🎯T33/🎯T92/🎯T93 mistake): it is derived from something the peer must do, or it is a named constant whose value has a stated reason. Existing callers that legitimately wait a long time still do, or the target records which ones changed and why.'
