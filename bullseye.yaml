  T82:
    name: Model selection sees per-model exhaustion, not just per-provider plan remaining, so a seat is never resolved onto a model that has no tokens left
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Resolve now filters candidates with ModelHasAvailableTokens rather than HasAvailableTokens, on both the catalog path and the intel path, so a model whose own published window is spent is ineligible while its provider''s plan still has headroom. The signal is observed, not guessed: it is the vendor''s own per-model weekly window from limits[] (🎯T86), read from a payload this product stored (🎯T84) rather than from a codename inferred off a binary. A model with no window of its own is judged by the plan alone — absence of a figure is never exhaustion. Oracle: TestT86SpentModelIsIneligibleWhileThePlanIsFine (plan has tokens; Fable at 100% refused; Opus and a window-less Haiku unaffected; ExhaustedModels reports [Fable]) and TestT86ResolveSkipsTheSpentModel, which drives Resolve end to end for a frontier Claude session seat and asserts it does not land on claude-fable-5. Gate: make gate exit=0. Residual, declared: this governs selection. A caller that pins an exhausted model explicitly is still honoured — claudia does not veto an operator''s explicit pin — so a consumer that hardcodes a model bypasses this. jevons 🎯T585 is the consumer-side fallback.'
    acceptance:
    - Resolve and the mint path treat a model whose own quota is exhausted as ineligible even when the provider's plan windows have headroom; the picked ModelPick names a model that can actually accept a turn.
    - 'The exhaustion signal is observed, not guessed: a provider refusal naming the model (or a published per-model allowance where one exists) marks that model spent for a bounded period, and the outcome says which model was skipped and why.'
    - A seat pinned to an exhausted model falls back along the catalog ladder rather than failing the turn, and the fallback is reported once rather than silently substituted.
    - 'Hermetic: a fixture provider whose plan windows are green but whose default model refuses with an exhaustion error resolves onto the next model; a green model is never displaced.'
    context: |-
      **Source established 2026-09-20 by reading the Claude Code CLI bundle (`~/.local/bin/claude`, a compiled binary), with no probing of the usage endpoint.**

      Per-model usage is **not** a codenamed top-level bucket. It arrives in the usage payload's `limits[]` array: entries with `kind == "weekly_scoped"` carrying `scope.model.display_name`, a utilization and a `resets_at`. The CLI projects those into a `model_scoped` array and renders one row per entry titled `Current week (${display_name})`, which is where the owner's "Current week (Fable)" comes from. The CLI's own schema describes the field as "Server-supplied label for the model bucket (e.g. 'Fable')", so the name arrives from the server and nothing has to be guessed or hardcoded.

      **A discarded wrong reading, recorded so it is not re-derived:** the bundle's label table maps `seven_day_overage_included` to the string "Fable limit", and this target briefly said that was the field. The owner's reading is the correct one: overage-included is the weekly window *including* an occasional grant of extra capacity, not a model. The surrounding code agrees — the label switch returns null for that bucket and the limit-name aggregator folds it into "weekly". Building selection on that field would have refused seats on a misread number.

      claudia's `claudeOAuthUsage` struct parses only `five_hour` and `seven_day`, so `limits[]` is dropped before anything can see it. That is the whole gap.

      Owner correction 2026-09-20: this is not a reporting feature. The reading must reach model selection so claudia declines to place a seat on a spent model; the cockpit bar is the visible half of the same number.

      Achieved 2026-09-20: Resolve now filters candidates with ModelHasAvailableTokens rather than HasAvailableTokens, on both the catalog path and the intel path, so a model whose own published window is spent is ineligible while its provider's plan still has headroom. The signal is observed, not guessed: it is the vendor's own per-model weekly window from limits[] (🎯T86), read from a payload this product stored (🎯T84) rather than from a codename inferred off a binary. A model with no window of its own is judged by the plan alone — absence of a figure is never exhaustion. Oracle: TestT86SpentModelIsIneligibleWhileThePlanIsFine (plan has tokens; Fable at 100% refused; Opus and a window-less Haiku unaffected; ExhaustedModels reports [Fable]) and TestT86ResolveSkipsTheSpentModel, which drives Resolve end to end for a frontier Claude session seat and asserts it does not land on claude-fable-5. Gate: make gate exit=0. Residual, declared: this governs selection. A caller that pins an exhausted model explicitly is still honoured — claudia does not veto an operator's explicit pin — so a consumer that hardcodes a model bypasses this. jevons 🎯T585 is the consumer-side fallback.
