      ATTRIBUTION PINNED 2026-09-20 by claudia-po, by bisect over clean detached worktrees, one commit per worktree, each running `go test -count=1 -timeout 45s -run 'TestACPSteerPromptIDStack|TestT50_2PromptAcceptedBeforeWriteAndPermissionBeforeReply' .`:

      - 854822f (pre-wave) — ok, 0.502s
      - fe85b82 (🎯T79 helper + fixture) — ok, 0.489s
      - 2bd849d (🎯T79 call sites wired into the shipped path) — ok, 0.496s
      - **9bfe2d8 (🎯T83 "a mint that swallows the opening brief is the harness's problem") — FAIL**
      - fcf98c2 (docs) — FAIL, 60.459s

      So the hang is introduced by 9bfe2d8, the 🎯T83 stuck-mint guard, not by the 🎯T79 chunk-join fix and not by anything pre-existing. The 🎯T83 work added the peer-activity wait that the hermetic fake peer never satisfies; cl-t79's own narration names the shape ("a transport that dies mid-wait must end the wait rather than burn the bound"). Route to cl-t79-cursor-stream, which owns both the commit and the fix.

