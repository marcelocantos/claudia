      Scope: 2 files — grok/realtime.go (+1/-7) and grok/client_test.go (+66). Committed with `git commit --only`; nothing outside ./grok.

      DISPOSITION — VESTIGIAL, removed, and the reasoning was done rather than assumed. `git log -S pendingCalls` shows the field added in the original Grok client drop (18a48ec) and never read in any commit since. The correlation it would have provided is not missing but redundant: the Realtime protocol carries call_id on response.function_call_arguments.done, handleFunctionCall reads it off that event, and sendFunctionResult echoes the same id back on function_call_output, so no state needs to survive between the two. That echo is itself pinned — mutating "call_id": callID to "bogus-"+callID fails TestFunctionCallRoundTrip. This satisfies the target's requirement to determine which disposition applies before deleting.

      THE VALUABLE PART — the over-broadness work found a genuine hole. Because the client keeps no record of outstanding calls, nothing caught a dispatch firing the tool path on the WRONG event. The implementer demonstrated two mutants that SURVIVED the pre-fix suite: handleFunctionCall added to the response.done case, and to the default unhandled-event case. Both silent. TestFunctionCallDispatchIsSpecific now closes that: three decoy events (response.done, session.updated, an unhandled type) each carrying a full call_id/name/arguments payload, then two genuine round trips asserting every frame in between.

      MUTATION PROOF BY THE GATE — reverted, realtime.go restored byte-identical:
      - P3 fire the tool path on response.done (one of the two mutants that previously survived) → KILLED by TestFunctionCallDispatchIsSpecific. The gate independently reproduced the kill the implementer reported.

      SWEEP (acceptance #4): implementer reports no other assigned-but-never-read fields in grok/realtime.go — every Config field, both DialArgs fields, and all four remaining Client fields (cfg, conn, mu, closed) are consulted; Tool's fields have no direct Go reads but are the wire schema, marshalled into session.tools and asserted by TestSessionConfigVoicePromptAndTools.

      GATES re-run BY THE GATE at 8dadc39: `go test -count=1 -cover ./grok/` → coverage: 92.2% of statements, exactly matching the 67121e0 baseline — no regression; `go test -race -count=1 ./...` exit 0 all packages; `go vet ./...` exit 0.

      HONEST READING OF THE COVERAGE NUMBER, as the implementer flagged: 92.2% is unchanged because removing the field deleted no statement (the make was inside a composite literal that remains) and the new test exercises already-covered lines. It means "did not regress", not "the new test raised coverage" — the test's value is in the mutation kill, not the percentage. The PO endorses that reading; coverage was the wrong instrument here and the mutation was the right one.

      RESIDUAL raised by the implementer, correctly not filed by a worker and now filed by the PO: handleFunctionCall runs one goroutine per call and each ends by sending its own response.create, so parallel tool calls in a single turn would mean N continuation requests for one turn. The implementer could not determine from hermetics whether xAI's Realtime API emits parallel function_call_arguments.done events, so this is a genuine unknown needing live observation rather than a confirmed bug.
