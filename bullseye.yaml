    attestation: 'claudia 4eea78f (Acquire consults the daemon: grant.pool; daemon runs AcquireDirect and grants the warm seat; Release maps return/keep_alive_for to reuse and drop to stop; closed connections return pooled seats; AcquireDirect in-process) + 414cc06 (oracles). vcheck PASS 2026-09-17 at 414cc06: `go test -race -count=1 -run ''TestAcquiredHandleOpsKeepAliveAndDirect|TestAcquireSharesOneWarmSeatAcrossConsumers|TestAcquiredSeatReturnsWhenConsumerLeaves'' -v ./daemon/` → 3 PASS (warm reuse across consumers; departed seat returned; Resize 97x31 on the pooled window; keep_alive_for deadline set; AcquireDirect stays in-process); `go test -race -count=1 ./daemon/ ./internal/broker/...` → ok; live `CLAUDIA_LIVE=1 go test -run ''^TestAcquireLive$'' -v ./daemon/` → PASS (checker re-run: warm re-acquire of @1 in 46ms). Residue: answer readback from pooled agents is 🎯T78; Interrupt on a pooled handle not separately adjudicated.'
    acceptance:
    - 'When a daemon answers, `Acquire` sends the Config and pool policy/cap over the socket; the daemon runs the library''s own `Acquire` in its process and grants the resulting warm seat to the connection as an anonymous seat; the consumer receives a daemon-held handle whose seat operations reach the pooled process (hermetically: Resize changes the pooled tmux window; live: Send is accepted).'
    - '`Agent.Release` on that handle carries the disposition (`return`, `drop`, `keep_alive_for:<secs>`) to the daemon, which calls the library `Release`; a returned seat is available to the next Acquire from any consumer; keep_alive_for leaves the pool''s deadline on the window. A dropped connection releases its acquired seats with `return` rather than leaving them held forever.'
    - Without a daemon, `Acquire` is today's in-process `pool.go`, unchanged; `AcquireDirect` keeps the pool in-process with a daemon listening.
    - 'Hermetic, with real tmux and brokertest''s fake claude binary: two consumer connections through one in-process daemon — the first acquires and returns, the second acquires the same warm window without a second spawn; a consumer that leaves without releasing returns its seat; mutants (spawn on every acquire, departed seat stays held, Acquire ignores the daemon) go red.'
    - 'Live: a CLAUDIA_LIVE=1 acquire → send → return → re-acquire through an in-process daemon (private tmux server) reuses the same real Claude window, or the skip is named as residue. Reading the answer back from a pooled agent is 🎯T78: pooled agents publish no turn events on either path. Interrupt on a pooled handle uses the same daemon op as on any grant (covered for grants by the daemon suite) and is not separately adjudicated here: the fake claude''s tty cannot observe a lone Escape.'
