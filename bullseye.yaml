  T101:
    name: 'The Claude Session live gate can be run on this host: a live Send reaches the TUI composer instead of failing "composer empty after paste"'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: '9847454 (cl-t101): submitEvidenceTimeout, and the typed branch takes the same `landed` evidence as the paste branch. Acceptance command: `GATE go-test-TestAgentSendAndWaitForResponse exit=0 GREEN id=151ccf6e tree=clean@9847454` (CLAUDIA_LIVE=1, load 306), plus 624aed9b TestAgentMultiTurn. The CLAUDIA_LIVE=1 row now runs to completion: a89d8f7b@d152848 completed. Its failures were independent of the submit path and reproduced with 🎯T108 reverted (🎯T113 and 🎯T114 have since fixed two of them, and the goal journey passed at low load in cf8890f9). Full suite: df826cc7@7634e06. claudia-po verified the records.'
    acceptance:
    - '`CLAUDIA_LIVE=1 go test -run ''^TestAgentSendAndWaitForResponse$'' .` passes on a clean worktree of HEAD on this host, and the CLAUDIA_LIVE=1 row of AGENTS.md''s live-gate table can be run to completion. Until then, any finish report citing the Claude live gate names it as blocked residue with a control run, never as a skip or a pass. If the cause is host saturation rather than the submit path, the target is satisfied by a documented load condition under which the gate does run, recorded where the next agent will find it.'
    context: |-
      Found 2026-09-21 by cl-t96-waitforresponse-bound while trying to run 🎯T96's required live gate.

      Three attempts to run a live Claude Session turn failed identically at Send: `turn not submitted: composer empty after paste (brief never reached pane)` — the 🎯T30 submit path reporting that the payload never reached the pane. The prompt was ~130 characters, so this is not a large-payload paste.

      CONTROL, which is what makes this a repo fact rather than one seat's change: the same failure reproduces at unmodified HEAD (1681598) on a pristine detached worktree (`git status --porcelain` empty) running the repo's own live smoke — `CLAUDIA_LIVE=1 go test -count=1 -run '^TestAgentSendAndWaitForResponse$' -v -timeout 10m .` → `agent_test.go:557: Send: turn not submitted: composer empty after paste (brief never reached pane)`, `--- FAIL: TestAgentSendAndWaitForResponse (15.06s)`. The agent starts and the tmux window is created; only the submit fails.

      Host at the time: load averages 243–335 with 21 users, sustained over the whole session. The obvious hypothesis is that readiness/submit detection cannot get a rendered pane out of the TUI while the machine is that saturated (readyOverallTimeout is 30s; the failure lands in ~15s). The alternative hypothesis — a Claude Code TUI version whose composer no longer matches the submit path's expectations (~/.local/bin/claude → versions/2.1.278) — has not been excluded, and the two need different fixes.

      Consequence today: AGENTS.md's CLAUDIA_LIVE row cannot be honoured on this host, so every Session-wide change (🎯T96 is the live example) must name Claude live as blocked residue. Grok and Cursor ACP live paths are unaffected — they do not go through the TUI.

      PO NOTE 2026-09-21 (claudia-po), on separating the two hypotheses and on who is making the weather.

      The saturation hypothesis is confounded by the fleet itself. The load averages recorded above (243-335) are substantially MY seats: five claudia workers were running concurrently while this was measured, and cl-t96 said in the same turn that it was sequencing rather than parallelising precisely because of host pressure. So "the host was at 300" is not an independent environmental fact — it is a consequence of how many seats I had spawned. That cuts both ways: it makes saturation the more likely cause, and it makes a saturation-only fix untestable while the fleet is busy.

      Consequence for scheduling, recorded so it is not re-derived: I am deliberately NOT spawning a worker for this target yet, although it is an unblocked ready leaf and 🎯T193 would normally require one in the filing turn. Spawning a sixth seat to diagnose a failure whose leading hypothesis is too many seats would corrupt the measurement and make the symptom worse. This is first in the queue the moment concurrent seats drop, ahead of 🎯T97.

      The two hypotheses are cheaply separable, and the cheap one does not need load at all. The TUI-version hypothesis (~/.local/bin/claude to versions/2.1.278, a composer the 🎯T30 submit path no longer matches) is testable by driving the submit path against that binary on an otherwise idle host, or by checking the submit path's pane expectations against what 2.1.278 actually renders. Do that FIRST: it is decidable without waiting for a quiet machine, and if it holds, the load story is a red herring that would otherwise have cost a night of waiting. Only if the composer matches 2.1.278's rendering does the saturation branch need a low-load window.

      One measurement worth taking either way, because it turns the question into a number: readyOverallTimeout is 30s and the failure lands in ~15s, so the submit path is not timing out — it is concluding the composer is EMPTY. A composer empty at 15s under load and non-empty at 15s idle is saturation; a composer the path cannot read at all, at any load, is the version hypothesis. Instrument what it actually saw rather than how long it waited, which is the lesson 🎯T91 learned about a bare duration, one layer up.

      Achieved 2026-09-22: 9847454 (cl-t101): submitEvidenceTimeout, and the typed branch takes the same `landed` evidence as the paste branch. Acceptance command: `GATE go-test-TestAgentSendAndWaitForResponse exit=0 GREEN id=151ccf6e tree=clean@9847454` (CLAUDIA_LIVE=1, load 306), plus 624aed9b TestAgentMultiTurn. The CLAUDIA_LIVE=1 row now runs to completion: a89d8f7b@d152848 completed. Its failures were independent of the submit path and reproduced with 🎯T108 reverted (🎯T113 and 🎯T114 have since fixed two of them, and the goal journey passed at low load in cf8890f9). Full suite: df826cc7@7634e06. claudia-po verified the records.
