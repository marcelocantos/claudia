  T94:
    name: 'daemon: a seat a departed consumer left warm is the one the next Acquire gets, on a loaded host as well as an idle one'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Achieved 2026-09-21. Implementation by cl-t94-warm-seat-reuse; verified independently by claudia-po, who did not write it (🎯T31.1).

      MECHANISM — and it is a third answer, better than either the acceptance offered. The pool had not yet observed the release because THE RELEASE HAD NOT YET HAPPENED. `ConnClosed` deletes the grant under `d.mu` at daemon/daemon.go:398 (`unbindPooledLocked`), while the return itself runs afterwards outside the lock at daemon/daemon.go:419 → `Agent.Release("return")` → `SetWindowOption(@1,"claudia-held","0")` (pool.go:545). The test waited on the first (daemon/pool_test.go:135); the pool reads the second (pool.go:213-228, `classifyPoolWindow` pool.go:87-96) → `poolHeld` → `spawnPoolWindow` (pool.go:366, the "cold spawn" line in the failure log). Probe on unfixed code measured the window: 15-28 ms during which `@claudia-held` was still "1" while `len(grants)` had already hit 0.

      FIX IS ORDERING, not a widened wait and not a new bound — which is what acceptance required of this family. The grant stays `returning` and unhandable via `liveGrantLocked` until the window is really back; `forgetReturned` removes it after. `handleRelease` takes the same order, so an explicit Release now also implies the window is free. The test reads `@claudia-held` itself rather than the grant count.

      EVIDENCE, verified by claudia-po this turn rather than quoted:
      - `git merge-base --is-ancestor 03b30141d0118090250f0b1ff8df0892df32baea HEAD` → exit 0 (HEAD 9712ef0). Commit: "🎯T94: the daemon forgot the seat before the pool could have it back".
      - `jevons_gate_show c7a2b82f` → found=true, exit_status=0, status_known=true, verdict GREEN, dur=7m35.3s, and critically `tree.clean=true` at commit 03b30141d011 in an isolated checkout, with the shared repos 19 dirty files recorded as deliberately not measured (🎯T397). This is a clean-tree citation, not the dirty-tree kind the daemon flags.
      - Acceptance asked for the full suite UNDER LOAD rather than in isolation: the run spanned load averages 363 → 247; daemon package ok 21.567s; vet, tests, stability surface and mutation evidence all green.
      - Oracle teeth, by hand: daemon fix reverted with the new assertion kept, `-race -count=2` at load 241 → FAIL "the daemon forgot the grant while @1 is still @claudia-held=\"1\"". With the fix: `-run TestAcquiredSeatReturnsWhenConsumerLeaves -race -count=8` at load 247 → ok; `-run "TestAcquire|TestAcquired" -race -count=4` → ok.

      RESIDUE, named not passed: no provider wire touched (daemon pool bookkeeping only), so AGENTS.mds live-backend rule does not bind and `daemon.TestAcquireLive` was not run. No mutation-evidence.json entry — the seat declined one on the ground that the minimal inversion reds only probabilistically (1 of 2 at load 241), so a standing entry would itself be a verdict decided by host speed, which is the 🎯T33/🎯T65/🎯T90/🎯T92/🎯T93 disease this target belongs to. I accept that reasoning; the by-hand teeth above stand in its place, and the file also carries cl-t47.1's uncommitted edits.

