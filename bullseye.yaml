  T27.1:
    name: Every layer behaves like an agent, so every layer has tools — a layer-facing tool surface distinct from the model's, over one action registry
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - A LAYER HAS ITS OWN TOOL SURFACE. Non-model layers call tools registered for them, which need not mirror — and generally should not mirror — the tools exposed to models. The principle is that a layer behaves like an agent and therefore acts through tools, NOT that it acts through the same tools.
    - ONE IMPLEMENTATION PER ACTION IS THE ANTI-DRIFT PROPERTY, and it is structural rather than tested by comparison. Both surfaces are THIN ADAPTERS over a single action registry, so 'send to agent' has exactly one implementation regardless of which surface reached it. Two implementations of one action is how layers stop agreeing about what an action means.
    - 'ADAPTERS ARE DUMB: shape translation only. No defaulting, no policy, no argument synthesis. An adapter that fills in an argument differently from its counterpart is a fork wearing a different hat, and would be invisible to a handler-level check.'
    - THE SURFACES DIFFER DELIBERATELY IN GRANULARITY AND SHAPE. Model-facing tools are intent-shaped so one intent costs one call, and may return prose. Layer-facing tools are fine-grained primitives composed in code, and return TYPED results and TYPED errors, because a deterministic caller re-parsing prose is a defect.
    - READS AND ACTIONS ARE SEPARATE SURFACES AND SEPARATE TYPES. A READ is side-effect-free, is available to a classifier, and has its RESULT RECORDED INTO THE REQUEST RECORD so replay is deterministic without forbidding lookups. An ACTION is effectful and reachable only from an actuator. They are distinct Go types (claudia.Read, claudia.Action) so a manifest cannot list one where the other belongs.
    - 'A VERDICT NAMES AN ACTION; IT DOES NOT PERFORM ONE. A layer returns a declarative verdict — abstain, decide, or ''do this action with these arguments'' — and the actuator is the only thing that touches the registry. Three consequences: manifest enforcement happens at VERDICT VALIDATION before anything executes, an interpreted rule needs no effectful injection at all, and replay replays the verdict rather than re-executing the effect.'
    - SURFACES ARE INJECTED AT CONSTRUCTION AND HANDLES ARE UNFORGEABLE. Registration returns an opaque handle value whose identifying field is UNEXPORTED, so only the registry can mint one; manifests are assembled from handles, never from strings. A zero-value handle is rejected rather than silently meaning something. There is NO dynamic plugin loading — a layer that must live out of process is the consumer's own layer talking over a socket, and claudia never learns what a plugin is.
    - THE MANIFEST IS THE SURFACE, RESOLVED AT CONSTRUCTION. A layer's scope is which tools exist in its namespace, so 'this layer may reap but not spawn' is enforced by construction rather than by an argument-level policy check on a shared schema. Naming something unavailable fails at compile or construction time, never as a 3am runtime denial. Scope is PER LAYER, not per consumer or per agent.
    - STRINGS REMAIN THE INVOCATION VOCABULARY FOR RULES AND MODELS, AND RESOLUTION RUNS ONE WAY. A rule or a model names an action by string; handle-to-string is total, string-to-handle can fail. For interpreted rules that resolution happens at LOAD time against the layer's manifest, so a rule naming anything outside its scope is rejected on load — alongside its own failing tests — and a rule that could ever escape its manifest never becomes active at all.
    - A LAYER TOOL WITH NO MODEL-FACING COUNTERPART IS A DECLARED DECISION, never an incidental one. Otherwise the least-supervised actor in the system acquires capabilities the supervised one never had — privilege escalation by surface rather than by promotion.
    - SCOPE WIDENS ONLY BY A DELIBERATE ADMINISTRATIVE ACT, never as a side effect of a rule proving reliable. Cognition may be learned; authority is declared. A promoted rule inherits exactly the authority its action class already had.
    - DRIFT IS DETECTED AND IS THE LOAD-BEARING EVENT KIND. A denial is loud and self-reporting; drift — a layer handling a class its manifest does not cover — is quiet, and quiet failure is this architecture's characteristic weakness on both axes.
    - 'Oracle: hermetic tests that no action has two implementations; that a verdict naming an action outside the layer''s manifest is refused before execution; that a zero-value handle is rejected; that a rule naming an unavailable action fails to LOAD; that a recorded read replays identically without re-issuing the query; that a layer-declared tool without a model counterpart is flagged as such; and a drift test where a layer handling an uncovered class fires an event rather than succeeding silently.'
    context: |-
      Owner's correction, 2026-08-10, and the precondition for everything else in 🎯T27.

      The earlier position — inherited from jevons 🎯T403.9 — was 'the same tools, not parallel implementations', justified by the drift argument. That criterion conflated two separate things: one implementation per ACTION (the property that actually prevents drift) and one tool SURFACE (which does not, and which forces a mediation problem). Keep the first, drop the second, and drift is still impossible.

      Dropping it removes the objection that killed claudia as a host. Claudia observes tool calls but does not gate them — TaskEventToolUse is emitted downstream of the CLI's own execution, and DisallowTools is a spawn-time argv flag that 🎯T23 established is Claude-only. If layers have their own surface, that surface is an ordinary Go registry with a manifest rather than an MCP server, and it lives wherever the layers do.

      Separate surfaces are better on three counts, not merely acceptable. First, granularity pulls in opposite directions: an intent-shaped tool ('ensure this target has an engaged worker') exists to stop a MODEL spending four calls walking a path, while a deterministic layer reasoning about HOW wants fine primitives it composes in code where calls are free. One schema cannot satisfy both. Second, result shape follows the same split — models want prose, code wants structs. Third, the budgets differ: model-facing schemas cost context on every single turn, so that surface must stay small, while layer-facing schemas cost nothing because no model reads them, so that surface can be as large and specific as code wants.

      HOW TOOLS REACH A LAYER (owner, 2026-08-10): dependency injection through constructor parameters, and nothing more exotic. The consumer builds a registry, registration returns handle values, and a layer is constructed with a manifest assembled from those handles. Go plugins were never a candidate — exact toolchain matching, no unload, platform gaps — and are not needed, because Go-native layers simply close over what they need and only interpreted rules require injection at all.

      The handle carries an unexported name so it cannot be forged, which converts a whole class of error from runtime denial to compile error: a name that was never registered cannot be written down. Strings survive as the vocabulary an agent or a rule uses to SAY which tool it wants, which is a different concern from what Go code passes around, and the asymmetry between the two is deliberate — the untrusted side resolves and can fail, the trusted side cannot.

      A CORRECTION TO AN EARLIER OVERSTATEMENT IN THIS TARGET: 'the classifier performs no I/O' was too strict, and pre-assembling every fact a layer might need is not a real option. What the replay oracle actually requires is DETERMINISM, not abstinence. Recorded reads supply that — a classifier may look something up, and replay serves the recorded answer rather than re-issuing the query. Effects remain the actuator's alone. This is also what makes 🎯T27.4's reference resolution workable without flattening the consumer's whole world into the request.

      WHY THIS IS A PRECONDITION AND NOT A FEATURE. Promotion observes a model making the same decision N times and crystallises it into a rule. That is only coherent if the rule can PERFORM what the model performed. Without layer tool access there is nothing to promote into and the ladder is decorative.

      The confinement story improves as a consequence of surface separation. Capability by construction — the tool simply does not exist in the layer's namespace — is cheaper to audit and harder to bypass than capability by gate. This is what jevons 🎯T403.8 was reaching for when it hit the in-process confinement problem: seatbelt cannot confine a function call, but a namespace can be empty.

      Second-order cost note: MCP tool definitions are themselves context. Work moved to a deterministic layer carries none of that overhead, so shifting an action down removes both the turn and its share of tool-schema context.
