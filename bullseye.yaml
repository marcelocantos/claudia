  T84:
    name: 'A plan-usage response can be re-read after the fact: the raw payload is kept briefly, so a shape question never requires a fresh request'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'vcheck PASS 2026-09-21 (cl-t84-t85-vcheck): landed 86e49f93942bf4f389b0e6bd1fb972b31c231d2f (same commit as T85). Clean-tree oracle — GATE go-test-TestT84 exit=0 GREEN id=7b8efef9 tree=clean@86e49f9. plan_usage_record.go verified live (plan_usage.go:267-268 → recordingClient → RecordPlanRawPayload consumes rec.result()); dead-code flag withdrawn.'
    acceptance:
    - Each successful plan-usage fetch retains its raw response body in a bounded local store (ring or age cap, 0600, outside any repo), addressable by provider and fetch time, so the last several payloads per provider can be read back without issuing a request.
    - A payload carrying keys the parser does not map is retained in preference to one that parses cleanly, so a surface change is visible after the fact rather than silently dropped.
    - Nothing in the store is published, logged at info level, or committed; a test proves the file mode and that the store is bounded.
    context: |-
      Found 2026-09-20 when the owner asked whether raw responses are kept anywhere. They are not, at any layer:

      - claudia's shared on-disk snapshot stores `planCacheSnapshot{fetched_at, backends []PlanUsage}` — the parsed struct, never the wire body.
      - jevons' `plan_readings` table is `(provider, window, resets_key, fetched_at, remaining)`. One float per window. No used percent, no status, no reason, no payload.
      - Neither `plan_usage_claude.go` nor `plan_usage_grok.go` logs a body. The only wire text that survives anywhere is the 200-byte truncation inside a failure reason on a non-200.

      Two costs, both already paid once. First, every field the parser does not name is discarded at parse time, which is exactly how Anthropic's per-model weekly windows (🎯T82) stayed invisible for weeks while sitting in each response. Second, a question about what the server actually said can only be answered by issuing a fresh request, and on the Claude usage endpoint that is the very act that triggers the rate-limit bucket — the 2026-09-20 incident that produced jevons 🎯T681 and 🎯T677. The owner asked to see an earlier payload during that session and nothing could be produced.

      Payloads here are utilization percentages and reset timestamps, not conversation content, so the sensitivity is account-shaped rather than user-content-shaped: keep them local, 0600, outside any repo, and bounded.

      Achieved 2026-09-21: vcheck PASS 2026-09-21 (cl-t84-t85-vcheck): landed 86e49f93942bf4f389b0e6bd1fb972b31c231d2f (same commit as T85). Clean-tree oracle — GATE go-test-TestT84 exit=0 GREEN id=7b8efef9 tree=clean@86e49f9. plan_usage_record.go verified live (plan_usage.go:267-268 → recordingClient → RecordPlanRawPayload consumes rec.result()); dead-code flag withdrawn.
