  T8:
    name: Package claudia/grok (Realtime voice) has hermetic tests covering Connect lifecycle and core client methods
    status: achieved
    value: 2.0
    cost: 5.0
    actual_cost: 5.0
    attestation: |-
      Product SHA 67121e0 on local master, "T8: hermetic tests for grok Realtime Connect lifecycle and client methods". INDEPENDENT PO GATE 2026-08-09 — verifier did not write the code (🎯T31); the implementer reported evidence and left the achieve to the PO.

      Scope: 5 files, all under ./grok — client_test.go (+482), connect_test.go (+401), fake_test.go (+242), realtime_live_test.go (+50), realtime.go (+35/-2). The only production change is the test seam: a realtimeURL const plus Config.Dial (*DialArgs{URL, Dial}) where nil preserves the production path, mirroring codex's Config.Resolve (*ResolveArgs) idiom. Gate confirmed nothing outside ./grok is in the commit; the unrelated dirty files in the shared worktree (agent.go, provider.go, task.go, capability.go, README.md, STABILITY.md, agents-guide.md and the codex test files) are untouched and remain unstaged.

      Oracle re-run BY THE GATE in an isolated worktree at 67121e0: `go test -race -count=1 ./grok/` exit 0; `go test -count=1 -cover ./grok/` → coverage: 92.2% of statements, independently reproducing the implementer's figure (was 0% — ./grok was the module's only "[no test files]" package). Full regression `go test -race -count=1 ./...` exit 0 across all packages and `go vet ./...` exit 0, run with CLAUDIA_CRASH_TEST_HELPER/CLAUDIA_CRASH_TEST_WORKDIR unset per the harness leak (claudia 🎯T20).

      Mutation proof BY THE GATE — six behavioural mutations of grok/realtime.go, each reverted, source restored byte-identical, ALL KILLED:
      - K1 endpoint const retargeted → KILLED by TestConnectDefaultEndpoint.
      - K2 SendAudio skips base64 encoding → KILLED by TestSendAudioEncodesPCM.
      - K3 Close uses StatusInternalError instead of StatusNormalClosure → KILLED by TestCloseNormalClosure.
      - K5 inbound audio delivered without base64 decode → KILLED by TestMalformedServerEventsAreSurvived, TestServerEventCallbacks.
      - K4a assistant role no longer maps to the "text" content type → KILLED by TestInjectConversationItem/assistant.
      - K4b empty-text no-op guard removed → KILLED by TestInjectConversationItemEmptyIsNoop.
      (An earlier K4 attempt by the gate was a no-op edit and correctly detected nothing; it was replaced by K4a/K4b. These six are the gate's own mutations, independent of the three the implementer ran.)

      Hermetic discipline verified: tests speak real WebSocket frames to a loopback httptest server, so Connect exercises its production dial path with no network and no credentials; the fixture key is the literal "test-key-not-a-secret". TestLiveConnect skips unless CLAUDIA_GROK_LIVE=1 or CLAUDIA_LIVE=1 AND XAI_API_KEY is set, and was observed SKIPPED in the gate's runs — live is smoke-only and never sole retirement evidence.

      DECLARED RESIDUE (accepted, not papered over): four log-only error branches after a failed conn.Write (sendFunctionResult ×2, SendSystemNote, InjectAssistantText first-send guards) are uncovered — reaching them needs a write failing between two sends, which the httptest seam cannot stage deterministically, and they only log. Separately the implementer surfaced Client.pendingCalls as a dead field (assigned in Connect, never read) and correctly left it alone rather than fixing out of scope; filed as its own target rather than folded in here.
    acceptance:
    - github.com/marcelocantos/claudia/grok has at least one *_test.go that runs under plain go test ./... without network or XAI_API_KEY.
    - Connect failure paths are covered hermetically (missing API key; optional dial/auth failure via injectable transport or httptest/fake if the WebSocket dial is seam-injected).
    - 'Core Client methods used by consumers are exercised with a fake WebSocket (or equivalent): at least SendText, Close, and one of Commit/CommitAndRespond/RequestResponse or SendAudio; callbacks in Config fire as documented for the simulated server events.'
    - Statement coverage for package grok is non-zero and reported (or package is excluded from total with an explicit documented reason — default expectation is real tests, not exclusion).
    - No live xAI Realtime call is required to retire the target; any live smoke is env-gated and optional.
