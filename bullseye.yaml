    name: A commit that changes another target's test call sites cannot silently disarm that target's mutation evidence
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      scripts/check-mutation-evidence.py + mutation-evidence.json landed in 57f4f85 and wired to make bullseye + CI (.github/workflows/test.yml mutation-evidence job).

      2026-08-16 at e8c83c05f064: make verify-mutation-evidence GREEN 4/4 entries (re-derive) and GREEN 4/4 (--prove-teeth). Worked instance is T28/overbroad-spinner-line: mutation bites TestT28DailyDeliveredFramesAreNotPasteChips and TestT28DeliveredFramesReportSuccessWithoutLandedEvidence; the 8c5e04a decay (landed=true at the Send call site) leaves every named test GREEN alone and makes the landed=false caller-visible half SURVIVE the mutation, so THIS check goes red. Logs: /var/folders/fn/8ffdcmbd13lfwzsm2h93xrx00000gn/T/mutation-evidence-kpbx6cj8.log and mutation-evidence-l724svnw.log.
    acceptance:
    - 'The claudia repo carries an executable check, wired to a standing enforcement point rather than left as an artifact, that re-derives the mutation evidence a converging/achieved target''s acceptance quotes, so that a later commit which edits those tests'' call sites (adding an argument, changing a fixture, relaxing a precondition) fails rather than passing while the named mutation has stopped biting. The check names the target, the mutation, and the test that must go RED, and it is proven by a worked instance: applying the mutation makes the named test RED, and neutering that test''s input the way 8c5e04a neutered TestT28DailyDeliveredFramesReportSuccess makes the CHECK go red, not merely the test go green.'
    context: |-
      Discovered 2026-08-15 while re-verifying 🎯T28 at HEAD after 🎯T30 landed on top of it.

      🎯T30's fix (8c5e04a) added a `landed bool` argument to ensureSubmitted and a branch returning nil for an empty composer whenever the payload was seen in the box before Enter. It also updated 🎯T28's two Send-level tests to pass landed=true — correct for the paste branch those tests model, and no assertion was weakened. But with landed=true, sawContent starts true, so the new composerEmptyIdle branch returns nil before the 🎯T28 classification is consulted at all.

      Re-running 🎯T28's own over-broadness mutation (revert only the spinnerLine disjunct in MatchTurnInProgress) at HEAD showed the decay directly:
        --- FAIL: TestT28DailyDeliveredFramesAreNotPasteChips/frame_daily_spinner_empty_composer.txt
        --- PASS: TestT28DailyDeliveredFramesReportSuccess/frame_daily_spinner_empty_composer.txt
      The second line was a FAIL when aa71680 landed and quoted it as acceptance evidence. The classifier half still bit; the caller-visible half did not. Nobody did anything wrong and every suite stayed green — which is the point: the loss is invisible to CI by construction.

      Covered for 🎯T28 specifically by 9944f39, which pins the contract on the landed=false path (the typed-literal branch, send.go:191, where 🎯T30's guard cannot help because there is no landing to have observed): with fix GATE t28-landedfalse-withfix exit=0 GREEN id=17eff2f1, under mutation GATE t28-landedfalse-mutation exit=1 RED id=2d85c9cf.

      That is a point fix for one target. The general mechanism is untreated: mutation evidence is quoted in a commit message once and never re-run, so any later commit that touches the inputs of those tests can retire the evidence silently. Doctrine already says an oracle is a loop, not an artifact, and that unwired oracles decay; this is that decay observed in the wild, with a named instance and a reproduction.

      Achieved 2026-08-16: scripts/check-mutation-evidence.py + mutation-evidence.json landed in 57f4f85 and wired to make bullseye + CI (.github/workflows/test.yml mutation-evidence job).

