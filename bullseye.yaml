    attestation: 'claudia HEAD after T70: brokerUnownedRingCap=100000; unowned forwarder retainUnowned no longer marks Lagged at 256. go test . -count=1 -timeout 90s -run ''TestT70UnownedStreamSurvivesBounceRing|TestT553MigrateContinuesWithoutConsumerSend|TestBrokerDaemonReclaimReplayReachesFirstSubscriber|TestBrokerDaemonKillMidTurnReclaimPerProvider'' → ok. TestT70: 300 unowned events, ring=300 lagged=false, reclaim WaitForResponse="the answer", no second provider process. Residual: cap 100000 still drops a multi-hour unowned stream.'
    acceptance:
    - 'While a grant is unowned (consumer socket gone), the daemon''s provider client stays subscribed and keeps reading: session/update, tokens, tool progress. The provider process does not block on a full stdout or a missing consumer.'
