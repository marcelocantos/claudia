    - 'Specifically: CLAUDIA_CRASH_TEST_HELPER (and CLAUDIA_CRASH_TEST_WORKDIR) do not reach an agent''s interactive shell. The crash-test helper''s control variables are scoped to the subprocess TestCrashSurvival spawns and no further.'
    - An executable oracle fails when a test-control variable leaks into an agent environment — e.g. a test that asserts the documented set of CLAUDIA_* test-control variables is unset at process start, so any future leak is caught rather than silently changing what the suite does.
    - 'Mutation-verified: reintroducing the leak (exporting CLAUDIA_CRASH_TEST_HELPER=1 into the agent''s environment) turns that oracle RED. An oracle that stays green with the leak present is worthless.'
    - The guard is wired to a standing enforcement point (the normal `go test ./...` path or a CI/hook gate), not left as an unwired helper an agent must remember to run.
    context: |-
      Found by the claudia PO gate on 🎯T4.4 (2026-08-09), and it cost real time. `TestCrashSurvivalHelper` in agent_crash_test.go is guarded by `if os.Getenv("CLAUDIA_CRASH_TEST_HELPER") != "1" { t.Skip(...) }` — correct in isolation. But claudia fleet agents run *inside* claudia-spawned tmux sessions, and that variable (plus CLAUDIA_CRASH_TEST_WORKDIR, pointing at a stale TestCrashSurvival temp dir) was present in the agent's own shell environment. The helper therefore did NOT skip: it called Start(), launched a real agent, and blocked forever, so `go test ./...` hung until the 600s panic timeout. The gate nearly filed a non-existent repo defect over it; re-running with `env -u CLAUDIA_CRASH_TEST_HELPER -u CLAUDIA_CRASH_TEST_WORKDIR` was green in ~10s.

      Why this is not cosmetic: every green a claudia fleet worker reports is produced under an environment the owner never runs. Today it manifests as a hang (loud). The dangerous version is the inverse — a leaked variable that makes a test SKIP inside a worker while passing on the owner's machine, so a worker reports green for a test that never executed. That is exactly the verification-honesty failure mode the fleet's oracle-first doctrine exists to prevent (headline numbers must come from the shipped path, and gate inputs must not be self-owned by the executor's environment).

      Note the fix is likely in how the agent process is launched (environment inheritance at spawn) rather than in the test itself; investigate both sides before choosing. Do not "fix" it by renaming the variable — that moves the leak, it does not close it.

