  T85:
    name: Vendor requests are paced across processes, so restarting a daemon cannot burst a rate limit
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'vcheck PASS 2026-09-21 (cl-t84-t85-vcheck): landed 86e49f93942bf4f389b0e6bd1fb972b31c231d2f. Clean-tree oracles — GATE go-test-TestT85 exit=0 GREEN id=334aad67 tree=clean@86e49f9; headline TestT85SecondProcessIsRefusedWithoutIssuingARequest GREEN id=e44db155; mutation (child wrong CLAUDIA_T85_DIR) exit=1 proves teeth. Residue accepted: make live table rows not run; live 429-invalidate hermetic-only. Full make gate blocked on T96 WaitForResponse park, not T85.'
    acceptance:
    - The interval floor between two requests to one provider is enforced from durable state shared by every process on the host, so a restarted daemon is refused a request its predecessor already spent. A test proves the second process is refused without issuing a request.
    - A rate-limit response starts an escalating penalty that an explicit refresh cannot waive, because the endpoint publishes no Retry-After and re-asking extends the refusal. Any successful response clears it.
    - Pacing applies to every provider that costs a request, not only Anthropic, and a provider withheld by the floor carries its previous reading forward with its original timestamp rather than being published as a hole or a zero.
    context: |-
      Owner 2026-09-20, after the Claude usage endpoint refused us for twenty minutes: "This can also be used to apply rate limiting across runs so that we don't accidentally get rate-limited because we're restarting the server too often." Then: "Do this for all API calls not just Anthropic."

      The in-memory cache already stops a running broker from re-asking inside its TTL, but a restart is born with no memory. Bounce the broker six times during a debugging session and the vendor sees six requests in as many minutes, which is the burst shape that triggered the refusal: on 2026-09-20 roughly eight probes within a couple of minutes put Anthropic's usage endpoint into a multi-hour rejection, which the daemon then misread as an exhausted plan and used to park a live worker holding 387 queued sends (jevons 🎯T677, 🎯T681).

      Evidence the steady state is fine and only bursts are dangerous: the jevons reading store holds roughly 290 Claude samples a day for the preceding week (293 / 300 / 289 / 258 on 19 / 18 / 17 / 16 September), which is one every five minutes, sustained, with claudia's own User-Agent. Community reports say the endpoint buckets by User-Agent and that `claude-code/<version>` gets the generous allowance; the owner declined to impersonate that client, correctly, since the honest agent string has served us for weeks. So the discipline has to be ours.

