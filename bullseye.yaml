  T24:
    name: A request field a provider cannot honour produces a typed error, never a silent drop
    status: achieved
    value: 6.0
    cost: 4.0
    attestation: |-
      Request-field census is TestProviderPathsHonourOrRefuseEveryRequestField (ad60633): reflection over TaskConfig and Config for Claude/Codex/Grok/Bedrock/Ollama × Task, and for every Session path that is not fail-closed. Each field is consumed (appears in argv/plan/API), refused with *CapabilityError via the named prechecks, or declared local/ignored with a rationale. Closed Session paths (Codex/Bedrock/Ollama) fail Start with *CapabilityError before fields are read.

      Production refusals landed in 7bdcff1 / da8f3b2 / 18e8efd (capabilityRefusal, grokACPArgs, per-path prechecks). Wired to go test ./... — the census is an ordinary test.

      Mutations: TestDeclaringAConsumedFieldUnsupportedGoesRed (Claude Task Model marked refused → audit RED); TestReintroducingASilentDropGoesRed (Grok Task DisallowTools precheck must still *CapabilityError, and marking it consumed → audit RED). Both green 2026-08-16.
    acceptance:
    - An executable check enumerates every caller-supplied request field on every provider path (Task and Session, across Claude, Codex, Grok and Bedrock) and fails when a field is neither consumed by that path nor explicitly refused with a typed *CapabilityError. Reflection over the request structs, not a hand-maintained list — a list that must be remembered is the same failure mode this target exists to close.
    - The check is wired to the standing path (`go test ./...` / CI), so a NEW field added to a request struct, or a NEW provider path added, fails until each is either consumed or explicitly declared unsupported.
    - Every field the audit finds silently dropped today is fixed — refused with a typed error or genuinely honoured. The two known instances are Codex DisallowTools (fixed in 399b1c8) and Grok DisallowTools (🎯T23); the audit must find the rest rather than assuming those are all.
    - 'Deliberate no-ops are expressible and explicit: a field a provider legitimately ignores (rather than cannot honour) is declared as such in one reviewable place, with a rationale, and the check consults that declaration.'
    - 'Mutation-verified in both directions: (a) reintroduce a silent drop on any provider path — a named test goes RED; (b) declare a field unsupported that is in fact consumed — a named test goes RED. A check that only catches one direction rots into rubber-stamping.'
    context: |-
      Filed at the overseer's direction 2026-08-09, after the 🎯T4.6 gate. The instance is less interesting than the class.

      The pattern, seen three times in one day: a value is SET by a caller, IGNORED by the code, and NEVER REPORTED. (1) `codexTaskArgs` silently discarded req.DisallowTools — fail-open on a safety control, fixed in 399b1c8. (2) `grokTaskArgs` does the identical thing — filed as 🎯T23. (3) Structurally the same shape as the two other failures hit that day: SendKeys reporting a turn began when it had not (🎯T21), and a test-control variable silently changing which tests ran (🎯T20). In every case the system had a value it could not honour and said nothing.

      What makes it worth a standing target rather than two fixes: DisallowTools was found only because someone was enumerating capabilities for an unrelated purpose. Nothing was watching for it. The capability matrix built in 399b1c8 (capability.go, ProviderCapabilityMatrix, CheckCapability) is the machinery that makes the general rule expressible for the first time — this target wires it into an enforcement loop so the next silently-dropped field fails a test instead of waiting for a lucky audit.

      Deliberately general: the acceptance asks for reflection over the request structs rather than a curated list, because a curated list is itself a thing someone must remember to update, which is the failure being fixed. Related: 🎯T4.6 (Codex instance, achieved), 🎯T23 (Grok instance), and jevons 🎯T386 (the fleet-wide reporting analogue — a gate command whose exit status was swallowed by a pipe).

      Achieved 2026-08-16: Request-field census is TestProviderPathsHonourOrRefuseEveryRequestField (ad60633): reflection over TaskConfig and Config for Claude/Codex/Grok/Bedrock/Ollama × Task, and for every Session path that is not fail-closed. Each field is consumed (appears in argv/plan/API), refused with *CapabilityError via the named prechecks, or declared local/ignored with a rationale. Closed Session paths (Codex/Bedrock/Ollama) fail Start with *CapabilityError before fields are read.

      Production refusals landed in 7bdcff1 / da8f3b2 / 18e8efd (capabilityRefusal, grokACPArgs, per-path prechecks). Wired to go test ./... — the census is an ordinary test.

      Mutations: TestDeclaringAConsumedFieldUnsupportedGoesRed (Claude Task Model marked refused → audit RED); TestReintroducingASilentDropGoesRed (Grok Task DisallowTools precheck must still *CapabilityError, and marking it consumed → audit RED). Both green 2026-08-16.
    depends_on:
    - T23
