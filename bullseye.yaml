      `WaitForResponse` (agent.go:1864) ends in `select { case <-ctx.Done(): ...; case out := <-ch: ... }`. `ch` is fed only by the event subscription's terminal path, so if a turn's terminal event is never published, the only thing that can end the call is the caller's context. A consumer passing a long-lived context — or `t.Context()`, which lives as long as the test — waits forever.

      Observed twice, as an indefinite park rather than a slow return, at BOTH commits under review, which is how it was attributed away from 🎯T91:

      - `make gate` on a clean detached worktree at ed0a30b, exit 2: `panic: test timed out after 10m0s / running tests: TestCursorStuckFirstPromptRecoversOnReissue (9m31s)`, goroutine 460 parked in `(*Agent).WaitForResponse` at agent.go:1864 from cursor_stuck_prompt_test.go:114. Root package `FAIL 600.544s`; every other package green in the same run.
      - CONTROL, clean detached worktree at e18806d (the parent, without the reviewer's added oracle), `go test -count=20 -race -timeout 180s -run '^TestCursorStuckFirstPromptRecoversOnReissue$' .` under sustained load, exit 1: `panic: test timed out after 3m0s`, the same goroutine parked at the same agent.go:1864 from the same cursor_stuck_prompt_test.go:114.

      In both dumps the last line before the park is the 🎯T92 warning — `WARN cursor acp opening prompt drew no response; re-establishing the turn ... bound=400ms observed="no inbound message of any kind in 407ms"` — so the trigger is 🎯T92's bound convicting a healthy-but-slow peer, and this unbounded wait is what converts that misjudgement into a hung suite instead of a failed assertion. 🎯T92 is the trigger; this is the amplifier. Fixing either one alone leaves a gate that cannot be cited: 🎯T92 alone stops the misjudgement in this test, this alone turns every future lost terminal into a named error instead of a 10m timeout.

      The same run passed 20/20 in 17.436s at load average 61, so it is timing-sensitive, not deterministic — which is precisely why the bound, not the flake, is the thing to fix.

      ---

      CALLER SURVEY (cl-t96-waitforresponse-bound, 2026-09-21), answering the acceptance's last clause: which callers legitimately wait a long time, and which changed.

      NONE CHANGED BEHAVIOUR. Every caller that answers today answers identically; the fix only adds ways for a wait that would NEVER have answered to end.

      Production callers are two, and both are already bounded by their own context:

