    attestation: 'claudia 3025491 (code 940a66e). Grants persist in grants.json marked live (AutoStart), stop-release removes them, the table survives daemon exit; on boot resumeSeats adopts what still runs (no nudge) else launches under the registry''s resume rules (Materialized ⇒ RequireResume) with bounded concurrency (default 2) and sends DefaultRestartNudge (--restart-nudge TEXT, ''-'' disables) to relaunched seats; tail carries resume/adopted, resume/launched, nudge, resume_failed/<reason>. Hermetic reconfirmed at 3025491 in the T2.10 18-test run: TestBrokerDaemonResumesSeatsOnBoot, TestBrokerDaemonResumeAdoptsWithoutNudgeAndEmitsTailEvents, TestBrokerDaemonResumeNudgeTextAndDisable, TestBrokerDaemonResumeConcurrencyIsBounded, TestBrokerDaemonGrantsPersistAcrossDaemonRestart PASS. Jevons 69bc2499 reconnects by granting the same names and neither stops nor reaps daemon-held seats. vcheck PASS 2026-09-12 at 940a66e: go test -count=1 -run ''TestBrokerDaemonResumesSeatsOnBoot|TestBrokerDaemonResumeAdoptsWithoutNudgeAndEmitsTailEvents|TestBrokerDaemonResumeNudgeTextAndDisable|TestBrokerDaemonResumeConcurrencyIsBounded|TestBrokerDaemonGrantsPersistAcrossDaemonRestart'' . → 5/5 PASS; make gate → ✓ vet ✓ tests ✓ stability surface ✓ mutation evidence; jevons TestDaemonHeldSeatsAreNeitherStoppedNorReaped ok. Residue: a real host reboot with a real Claude seat is an owner check, not run; the zero-means-2 concurrency default is inspected, not test-asserted.'
    acceptance:
    - Every grant is persisted in the daemon's own registry (grants.json under the claudia state dir) and marked live while held; a stop-release removes it. The set survives daemon exit and host reboot.
    - 'On boot the daemon walks the live set: Adopt first (tmux window or connect-mode serve that survived a daemon-only restart, no nudge), else Launch under the registry''s resume rules (Materialized ⇒ RequireResume, fail-closed, never a silent remint). Concurrency is bounded (default 2) so a large fleet does not stampede providers.'
    - A relaunched seat is sent a restart nudge before any consumer reconnects (DefaultRestartNudge; `--restart-nudge TEXT`, `-` disables), so the agent knows its in-flight tool calls did not finish and picks its task back up. An adopted seat is not nudged.
