  T108:
    name: 'A Claude seat starts reliably at the load this fleet actually runs at: readiness does not report no_composer for a healthy TUI that is merely slow to draw'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A Claude seat spawned at load average 300+ on this host reaches a ready composer, or fails with an error that distinguishes "the TUI never drew a composer" from "the TUI was still drawing when the bound expired". Readiness latency is measured at 300+ the way 🎯T101 measured it at ~200 (WaitReady 16.58s against the 30s readyOverallTimeout), and the bound is set from that measurement with its ratio stated, the way cursor_acp.go:95-113 and turn_wait.go:29-74 do it — not raised blindly and not left at a number chosen against a quieter host. A seat that has already drawn its composer is never reported `startup_stall / no_composer`. The measurement is recorded next to AGENTS.md's existing Claude-row latency table, so a reader seeing no_composer can tell the host from a defect.
    context: |-
      Filed 2026-09-21 by claudia-po on the recommendation of cl-t101-claude-live-submit (report 20260921T041124Z-8ce45b4d), which diagnosed 🎯T101 and correctly separated this from it.

      🎯T101 was the SUBMIT path: a typed-branch send given two samples (800ms) to show its payload, refused as "composer empty after paste" for turns that went on to run. This target is READINESS — a different path, which cl-t101's fix (9847454) deliberately does not touch. Its words: "no_composer is READINESS, a different path, and my fix does not touch it. It is consistent with load: cold readiness measured at 16.6s against a 30s bound at load ~200, so at load 300+ a seat can exhaust the bound and report no_composer with nothing wrong in the composer." It flagged that it had NOT measured readiness at 300+, so this is a strong hypothesis rather than a finding.

      WHY IT MATTERS MORE THAN ITS SIZE. It is the likeliest reason cl-t47.1-proxy-race produced nothing for most of 2026-09-21: its sends failed with `Agent CLI stalled on startup (startup_stall / no_composer): no idle input box within the ready timeout`, and that seat was registered for hours with no reports, no commits and no work in the tree. It is also the likeliest reason a spawn of cl-t95-wire-t91-mutations went `running idle` and vanished from the registry within three minutes at load ~198, never reaching `working`. So the failure is not an edge case: it removes seats from the fleet silently, at exactly the load this fleet sustains — 149 to 309 across the whole of 2026-09-21 by a worker's own observation.

      The headroom arithmetic makes the cliff concrete: 16.6s of a 30s bound at load ~200 leaves about 13s, and latency grows with load, so somewhere above 300 a healthy seat's first draw no longer fits. AGENTS.md already says "a run at load 300+ can exhaust it and report no_composer, which is the host talking, not a defect" — so the repo documents the failure while leaving it indistinguishable from a real one at the moment it happens. That indistinguishability is the defect.

      CHEAP TO MEASURE. Readiness submits no prompt, so measuring WaitReady latency at high load costs no model allowance — only a seat that draws and is then stopped.
    origin: manual
    discovered: 2026-09-21
