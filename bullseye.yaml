  T102:
    name: Content-scoped staging in a shared checkout never writes the working tree, so one seat cannot destroy another's uncommitted work
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A seat committing a subset of a file''s content in a checkout other seats are working in stages it through the index only — build the content, `git hash-object -w`, `git update-index --cacheinfo`, commit — and never runs a command that writes the working tree (`git checkout-index`, `git restore`, `git checkout -- <path>`, `git stash`) on a path it does not own. Backing out a staging mistake means re-staging, not restoring the file. The rule is written where a seat will meet it before it stages: claudia AGENTS.md alongside the existing "commit your own paths only" guidance. Evidence that it bites: a hermetic check, or a documented incident entry, showing that `git checkout-index -f -- <path>` replaces working-tree content that was never committed and that git offers no undo for it.'
    context: |-
      Filed by cl-t96-waitforresponse-bound after doing exactly this, 2026-09-21 ~06:05.

      Committing 🎯T96's mutation-evidence.json entries, I needed to commit my own three entries without committing cl-t47.1's two uncommitted 🎯T73 entries in the same file (their anchors do not exist at HEAD, so committing them wholesale would have turned `make verify-mutation-evidence` RED on work in flight). The index trick is right: `git hash-object -w` the content, `git update-index --cacheinfo`, commit, working tree untouched.

      The failure was in backing out a first attempt that had reformatted the file. `git checkout-index -f -- mutation-evidence.json` writes the INDEX over the WORKING TREE — it is not an unstage, and there is no reflog for a file that was never committed. cl-t47.1's two entries were destroyed.

      Recovered in full: they had kept a copy at /private/tmp/claude-501/t73-mutation-entries.json, and it matched the `git diff` I had captured earlier in the same session (+38 lines, two entries). Restored on top of HEAD so their diff shows only their work. That recovery was luck — a scratch copy that happened to exist — not a property of the process.

      The shared claudia checkout routinely carries three or four seats' uncommitted work at once (today: cl-t47.1, cl-t98, cl-t99, cl-t100 across .gitignore, AGENTS.md, STABILITY.md, docs/gate.md, provider_test.go, scripts/, internal/broker/, daemon/). "Commit your own paths only" already covers what goes IN; nothing covers what a seat may write OVER.

      ATTRIBUTION CORRECTED 2026-09-21 by claudia-po, and the error was mine before it was cl-t96's. This context says the destroyed entries were "cl-t47.1's". They were not. They belong to cl-t73-frame-cap, which was reaped mid-flight at 2026-09-20T13:34:45Z leaving its whole 🎯T73 diff uncommitted. cl-t96 repeated the wrong owner because I had written it into its spawn brief, and into three other seats' briefs, and into my own commit messages.

      The evidence that settles it: the uncommitted broker files carry mtimes from 22:11 to 23:33 AEST, stopping at the minute cl-t73-frame-cap was reaped (13:34:45Z = 23:34:45 AEST) and unchanged since; the diff carries 🎯T73 and 🎯T661 markers; and 🎯T47.1 is the MCPProxy concurrent-401 `entry.probe` race, which has nothing to do with broker framing. cl-t73-frame-cap's own handover report (20260920T132721Z-780347e8) lists exactly this file set as its work in progress.

      Why the correction matters to THIS target rather than being bookkeeping. 🎯T102 is an incident record about one seat writing over another's uncommitted work, and its whole force comes from naming who lost what. Recorded against the wrong owner it teaches the wrong lesson twice: it tells a reader that a live seat's work was at risk, when in fact the work at risk had NO live owner at all — which is strictly worse, because nobody would have noticed the loss. cl-t47.1 is live and would have seen its own diff vanish; cl-t73-frame-cap has been reaped for six hours and could not.

      It also cost real time. Believing the work belonged to a live seat, I treated it as hands-off for the whole session and told four workers to stay out of it. It was in fact finished work with no owner, blocking 🎯T95, and its author's last words were a request for permission to land it — plus a blocker (`scratchpad/agent-head.go` breaking `go vet ./...` for everyone) that 🎯T99 removed tonight. cl-t73-frame-cap-land is now adopting it.

      Two notes for whoever implements this target. First, the recovery was verified, not assumed: both 🎯T73 entries are present in the working tree with all six of their test expectations intact, matching the diff recorded earlier in the session. Second, mtime plus in-diff target markers plus the seat's own stored handover report is a cheap and reliable way to establish ownership of orphaned work in a shared checkout — worth preferring over "whoever is currently registered nearby", which is the inference that produced this error.
