  T21:
    name: Send confirms a turn actually began from positive evidence, never from absence of the idle composer
    status: achieved
    value: 8.0
    cost: 3.0
    actual_cost: 3.0
    attestation: |-
      Product SHA 16ac476 on local master, "T21: confirm a turn began from positive evidence, never from a missing composer". INDEPENDENT PO GATE 2026-08-09 — verifier did not write the code (🎯T31); the implementer left the achieve to the PO.

      Scope: 6 files, +433/-14, all under internal/tmuxagent — send.go, send_turnevidence_test.go, and four captured frame fixtures. Nothing outside.

      THE FIX: composerUnrecognised replaces the inference `if !MatchReady(frame) { return composerWorking }`. A frame with no positive turn chrome and no idle composer is now unrecognised, never working. ensureSubmitted keeps polling and re-pressing Enter within maxSubmitPresses then fails loudly naming the state and quoting the frame tail; waitContentLanded no longer accepts an unrecognised frame as proof the paste rendered.

      THE EVIDENCE THAT MAKES THIS CREDIBLE: the implementer captured all 52 live panes off the claudia tmux socket read-only while the symptom was occurring, and window 994 is the bug caught in the act — a spawned worker with its entire brief sitting in a MULTI-LINE composer, unsubmitted, no turn chrome. readyPattern only matches a single-line composer body, so MatchReady was false and the old code called that "turn began". Four verbatim captures are committed as testdata; three of them (turn_in_progress, queued_during_turn, scrolled_during_turn) exist specifically as the over-broadness guard. This is a real captured referent, not a synthetic fixture.

      MUTATION PROOF BY THE GATE — both reverted, send.go restored byte-identical:
      - P1 restore the exact pre-fix inference, i.e. reintroduce the original bug verbatim → KILLED by TestClassifyComposerRequiresPositiveTurnEvidence including subtests collapsed_paste_chip and mid-redraw,_no_composer_and_no_chrome.
      - P2 OVER-BROADNESS: require MatchReady alongside turn chrome, i.e. distrust every non-idle UI → KILLED by TestClassifyComposerRequiresPositiveTurnEvidence subtests composer_scrolled_during_turn (real capture) and queued_message_during_turn (real capture). The fix cannot silently over-correct into refusing legitimate running turns.
      Both directions pinned, each by a REAL captured frame rather than a hand-written one.

      REGRESSION at 8dadc39 (this commit plus 🎯T22): `go test -race -count=1 ./...` exit 0 across all packages, `go vet ./...` exit 0. Run plain — no `env -u` prefix needed, since 🎯T20 (0961582) closed the harness leak.

      CONTEXT: this is the mechanism behind the fleet-wide symptom the overseer reported — roughly eleven workers across three repos spawned with prompt_delivered=true that then sat idle until a repressure. SendKeys was reporting success whenever the pane merely failed to look like the idle composer, so the host recorded delivery while Enter may have landed on an unexpanded paste chip. A second, distinct non-start remains: two workers registered prompt_delivered=true and died with no session JSONL ever created — that is not this bug and is not closed by this commit.

      RESIDUALS, declared not smoothed over (implementer flagged, PO filing separately):
      - readyPattern recognises only a SINGLE-LINE composer body. The 994 capture proves multi-line briefs in the composer are invisible to MatchReady, so they land in unrecognised rather than the more precise composerTyped. This fix makes that safe (re-press then fail loudly) but a multi-line-aware composerBody would diagnose it exactly and would also make MatchReady honest for WaitReady.
      - Pre-existing and deliberately untouched: ensureSubmitted still errors when content is seen then the composer empties with no chrome; a turn completing before the first 400ms capture can land there. The implementer declined to weaken that anti-silent-failure guard, correctly, but it is a known false-failure class.
      - Specified behaviour, flagged not hidden: pressing Enter on unrecognised frames can answer a permission dialog's default.
    acceptance:
    - '`classifyComposer` returns the working/turn-began verdict ONLY on positive turn evidence (turn-in-progress chrome). A frame that merely fails to match the idle composer is classified as an explicit unrecognised state, not as working.'
    - An unrecognised frame causes `ensureSubmitted` to keep polling and re-pressing Enter until either positive turn evidence appears or the bound is exhausted — it must never short-circuit to success.
    - '`waitContentLanded` likewise does not accept an unrecognised frame as proof that pasted content landed, so Enter is never sent into a pane whose paste has not rendered.'
    - When the bound is exhausted without positive turn evidence, SendKeys returns a loud error naming the state and quoting the frame tail (extending the existing 🎯T305 failure reporting) — silent success is banned.
    - 'Hermetic regression tests cover the frames that currently produce a false success: a startup/resume menu frame, a frame whose composer is not at the pane tail, a mid-redraw frame with neither composer nor spinner, and the post-Enter gap where the composer has cleared but turn chrome has not yet rendered. Each asserts SendKeys does NOT report success while the turn has not begun.'
    - 'Mutation-verified: restoring the `if !MatchReady(frame) { return composerWorking }` fallback turns at least one named test RED. A suite that stays green with the old fallback in place has not closed this.'
    context: |-
      Found by claudia PO 2026-08-09 while investigating an overseer-reported fleet-wide symptom: roughly eleven workers spawned today across jevons, orthograph and claudia all went idle immediately after their opening prompt was reported delivered, and only began work after a repressure — costing a full grace period per worker and making the fleet attended rather than unattended.

      MECHANISM (read in internal/tmuxagent/send.go at cd9361c). `classifyComposer` decides the turn began from a NEGATIVE test:

          if !MatchReady(frame) {
              // No idle box and no paste chip → turn began (or non-idle UI).
              return composerWorking
          }

      The comment already concedes the ambiguity. `MatchReady` is false whenever `composerBody(frame)` is nil — that is, whenever the frame does not END in the input box. That covers a startup/resume menu, a permission dialog, scrolled output, a partial redraw, and the brief post-Enter window where Claude Code has cleared the composer but has not yet painted spinner chrome. `ensureSubmitted` returns nil on composerWorking, so SendKeys reports success and the host records prompt_delivered=true — while the Enter may have landed on an unexpanded paste chip and never submitted. The agent then sits idle forever. A later message presses Enter again, which is exactly why a repressure "fixes" it.

      `MatchTurnInProgress` is the correct POSITIVE signal and is already checked first; the bug is purely that its absence does not prevent the negative fallback from claiming success. `waitContentLanded` has the same flaw — it accepts composerWorking as "content landed", so it can stop waiting mid-redraw and fire Enter before the paste has rendered.

      Timing note for whoever fixes this: the first capture happens at submitSettle (400ms) after Enter, which lands squarely in the clear-composer-but-no-spinner-yet window, so this is not a rare race.

      This is the same class 🎯T305 was meant to close ("silent keys-sent-turn-never-started is banned") — the guard was built but left with a hole that defaults to declaring success. Fixing it should make prompt_delivered=true mean the turn actually began.

