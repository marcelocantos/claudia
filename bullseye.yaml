  T99:
    name: 'No agent''s scratch file can break `go vet ./...` for every other seat: in-repo scratch is invisible to the Go toolchain'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Achieved 2026-09-21. Implemented by cl-t99-scratch-invisible at e0bf97b1ccba1edfc6f200213518b8a14617ed13; adjudicated by claudia-po, who wrote none of it (🎯T31.1). Reachability re-proven at achieve time: `git merge-base --is-ancestor e0bf97b1ccba HEAD` exit 0. Code plus docs, not yaml-only, so not amend-vulnerable.

      THE MECHANISM IS THE UNDERSCORE, and the report says so in the place the next reader will look. `scratchpad/` is now `_scratchpad/`: the go command skips directories whose names begin with `_` or `.` (and `testdata`) and does not read `.gitignore`. The added `.gitignore` entries state that in the file itself, so nobody can mistake them for the fix. This was the trap in the brief and it was avoided.

      CLEAN-TREE CITATIONS, each confirmed by claudia-po through jevons_gate_show as found=true, exit_status=0, verdict GREEN, tree.clean=true at e0bf97b1ccba — not quoted from the report:
      - `GATE go-vet exit=0 GREEN id=408efb2a dur=24.6s tree=clean@e0bf97b1ccba`, command `go vet ./...`.
      - `GATE go-test-… exit=0 GREEN id=fa6fc615 dur=1m56.9s tree=clean@e0bf97b1ccba`, `go test -race -count=1 -v` over five named tests in `.` and `./daemon/`.
      - `GATE make-verify-stability exit=0 GREEN id=11f20e23 tree=clean@e0bf97b1ccba`.

      NON-VACUITY PROVEN FROM THE GATE LOG, not inferred. fa6fc615 ran with `-v`, so its own output settles what a bare `ok` cannot: all five tests ran and passed — TestScratchFileCannotBreakTheGate (24.43s, consistent with shelling out to a real `go vet ./...`), TestVisibleScratchDirectoryStillBreaksTheGate (0.41s), TestGrokProviderDoesNotReadPrivateStorage (0.06s), TestCodexProviderDoesNotReadPrivateStorage (0.12s), TestDaemonImportsOnlyTheLibraryAndTheWire (0.11s).

      THE ORACLE HAS BOTH HALVES, which is what makes it more than a happy path. TestScratchFileCannotBreakTheGate drops the incidents own shape at the scratch root — a second `package claudia` declaration calling a symbol it did not copy, plus the storage tokens the hygiene walks forbid — and asserts `go vet ./...` stays green and no gowalk walk reads the file. TestVisibleScratchDirectoryStillBreaksTheGate is the teeth: the same file in a plainly-named directory must still turn vet RED. It is proved in a throwaway module rather than this one, deliberately, because demonstrating the hazard means creating it and four sibling seats were running gates in this checkout — that is the right call and it is why the teeth test passes in 0.41s rather than costing a full vet.

      IT COVERED A WIDER CLASS THAN THE BRIEF ASKED, and the extra findings are the valuable part. This suite hand-rolled three tree walks. Two of them — provider_test.gos Grok and Codex storage-hygiene walks — skipped neither `scratchpad/` nor `bin/`, so a scratch copy of a provider file would have failed them on a token it merely QUOTES. All three walks now ask `internal/gowalk.IgnoredDir`, the go commands own rule, instead of a hand-kept list of directory names; `check-stability-surface.py` learns the same rule. And the daemon import walk now fails loudly when it reads nothing at all, because a walk that skips everything would otherwise pass silently — a false-green hazard nobody had asked about.

      THE FIVE SCRATCH PROGRAMS STILL WORK, with the cause correctly attributed. `tui-structure-exp` and its `wrap` build by explicit path. The other three carry their own go.mod and build from inside their own directory under `GOWORK=off`; the seat proved that is the parent `go.work` claiming the directory and NOT the underscore, by building a throwaway nested module under both a plain and an underscored name and observing both fail identically without `GOWORK=off`. That distinction is written into AGENTS.md, so the next reader does not blame the rename for a workspace rule.

      RESIDUE, named rather than claimed, and accepted by me. (1) The `make gate` clause is not run: a clean full suite cannot complete in this repo today because the root package parks (🎯T96, 🎯T98, both engaged). Blocked, not failed. (2) `go test ./...` is covered by inference only — vet loads the same package set, so a file invisible to one is invisible to the other — and the full suite was not run to see it. (3) `bin/` and `model-intel/` remain plainly named, so a stray `.go` in either would still break vet, restrained only by the convention now in AGENTS.md. My acceptance asked that these be CHECKED, and they were, with a stated reason: they hold build output and data, never Go source, and renaming them would break `go build -o bin/...` and the `bin/gate` habit for no measured hazard. I accept that as meeting the clause rather than dodging it; if a stray `.go` ever lands in `bin/`, that is a new report, not a reopen.

      ONE JUDGEMENT I SCRUTINISED AND LET STAND. The seat declined to add a gate check that fails when a visible directory holds a stray `.go`, on the ground that such a clause would itself be a new RED raised by another seats litter — the very failure this target removes — and taught the walks the toolchains rule instead. I am not fully persuaded: a check that names the litter is a legible RED where `undefined: Provider` was not. But the argument is sound on its own terms, the property test covers the shape that actually bit, and I would rather record the disagreement than overrule a reasoned call at achieve time.
