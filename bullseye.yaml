    - The Grok rows of the published capability matrix (ProviderCapabilityMatrix(ProviderGrok)) are verified against the Grok backends the same way TestCodexCapabilityMatrixMatchesBackendClaims verifies Codex, so wired-but-unclaimed or claimed-but-unwired capabilities fail.
