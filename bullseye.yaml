  T2:
    name: 'Claudia is a long-running metaharness: it owns agent lifecycles across every provider and keeps each grant''s plan-contract true; consumers name seats and write turns'
    status: converging
    value: 13.0
    cost: 21.0
    acceptance:
    - A standalone claudia daemon owns the lifecycle of every agent it grants — Claude, Codex, Grok, Cursor Sessions and Tasks alike — across all consumers on the host. It is the parent of the provider processes; consumers hold grants, not processes.
    - The daemon tracks and reports plan usage and token spend host-wide; consumers only read. Resolve is a grant's standing query, and a non-pinned grant is rebound (SetModel / Migrate) only to keep that grant's predicates true — never a fleet policy of its own (T13). The tracking, Resolve and rebind mechanisms are library code the daemon runs and passes through (🎯T75).
    - 'A consumer can stop, upgrade, and restart without bouncing its agents: it reconnects and reclaims its grants by name for every Session provider, not only the ones whose transport happens to survive today (Claude tmux, Grok connect-mode).'
    - 'The native published API is the claudia Go surface over the broker socket (T3): Registry-shaped grants by name, Send / Interrupt / WaitForResponse, the Event stream, LoadMCP, Resolve, usage subscribe. ACP-serve and OpenAI-compatible endpoints are facades over one grant or one Task, never the control plane.'
    - The daemon is installable via brew services and `claudia broker tail` / `status` expose throttle, reap, preempt, rebind, usage, and cost events.
    - The library SDK defaults to broker mode when the Unix socket exists and falls back to direct mode when the socket is absent or CLAUDIA_NO_BROKER=1. Direct mode offers the same capabilities minus the ones that imply a server (🎯T75); auto-actuating policy (rebind, reaping, preemption, AIMD admission) is opt-in and off by default there, so the library path never rebinds unasked.
    - All T2.x sub-targets are achieved.
    context: |-
      Explored during 2026-06-10 design session. Original motivation: multiple consumers on the same host competing for Anthropic rate-limit slots, warm pool waste, no cross-process cost visibility. The broker owns lifecycle policy (concurrency, pooling, idle reaping, preemption, cost tracking) while the library API surface is unchanged — Start()/Acquire()/NewTask() become thin RPC calls to the broker socket when it exists, with a brokerless fallback for single-process embedding. Novel value over ccusage / cc-budget / Bifrost is per-agent lifecycle policy.

      Reframed 2026-09-12 (owner, session a549a49e → e6b4b27e): Claudia is a long-running metaharness, not a Claude process allocator and not an OpenRouter. Three reasons stacked on the original rate-limit/cost motive: (1) plan usage is host-global and a library cannot own it — T61's flock+TTL cache is the brokerless fallback, not the architecture; the daemon is the one evaluator and can invalidate on a 429 immediately; (2) consumer upgrade without a fleet bounce — Jevons already pays for the inverse (T171 rehydrate, internal/upgrade/reattach.go) and Cursor/Codex stdio children die with the consumer today (Registry.Adopt → ErrNoSessionWindow); (3) owning the process means owning its standing contract: rebind-to-keep-predicates is the only auto-actuation, and it is a property of the daemon, never of importing the library. Responsibility split: daemon = spawn/grant/reclaim/reap/preempt, usage track+classify+report, Resolve+rebind, MCP/workdir attach; client = name seats (name, purpose, parent, predicates, pin), choose MCP config, write turns, decide park-vs-migrate and fleet topology. Jevons's consumer census (346 AgentDef, 206 NewRegistry, 226 Event vs 3 Config) says the native wire is the Registry contract plus Event, not spawn/release. Wire v1 (spawn/release/status/tail, no name/predicates/MCP/events) is a process allocator and must grow. T2.3 warm pool and T2.6 tmux suspend-pane are Claude-mechanism children and need provider-neutral restatement before they are built. Design record: docs/metaharness.md.

      Amended 2026-09-17 (owner, 🎯T75): some applications still embed claudia as a library, so everything that can feasibly be implemented in the library is, future work included, and the daemon exposes it by pass-through. This replaces point (3)'s "a property of the daemon, never of importing the library" and the responsibility split's assignment of reap, preempt, usage tracking, rebind and MCP attach to the daemon as mechanisms: those are library mechanisms, and the daemon contributes process ownership across consumer restarts, host-wide scope, and switching opt-in policy on. 🎯T2.2–🎯T2.6 and 🎯T2.12 are reworded accordingly. The daemon-only capability that already exists is migrated under 🎯T75.
