      TEETH — five mutations, each applied in a throwaway `git worktree` and reverted, never in the shared tree. Recipes are recorded in 🎯T95 for wiring into mutation-evidence.json (blocked on 🎯T73, whose uncommitted entries hold that file).
        A. drop the Prompt arming guard → reds TestCursorPromptWithoutWakePathDoesNotPark, and also TestACPSteerPromptIDStack and TestT50_2Prompt… all in 0.00s, which is itself the evidence that the second guard makes the old hang legible.
        B. delete `if ch == nil { return report() }` → reds TestAwaitPeerActivityWithoutWakePathReturnsAndSaysWhy, parked at cursor_acp.go:726.
        C. both (= 9bfe2d8's behaviour) → reproduces the original hang, `FAIL 45.505s`.
        D. `watch := false` → reds three 🎯T83 oracles. This is the load-bearing one: it is what establishes that narrowing the arming condition did not quietly disable the 🎯T83 guarantee the commit claims to preserve. 🎯T83's five oracles are all green at ed0a30b.
        E. `closed: closed` → `closed: closed && false` → reds only the new oracle below; the pre-existing one stays green.

      GAP FOUND AND CLOSED (ed0a30b, the reviewer's own commit). `peerWaitOutcome` exists to separate three faults and e18806d asserted two: nothing held the line between "the peer said nothing" and "the peer is gone", which have opposite repairs. 🎯T83's TestCursorStuckPromptWaitEndsWhenTransportDies proves the wait ENDS on a dead transport but discards the outcome, leaving the `closed` rendering unasserted. Added TestAwaitPeerActivityReportsTransportClosed; it is wake-driven, not wall-clock, so it does not join the 🎯T92/🎯T93/🎯T94 family.

      WHAT IS LEFT. Only acceptance 3, and none of it is in cursor_acp.go's wait: 🎯T92 (silence bound convicting a slow peer) and 🎯T96 (WaitForResponse with no bound) between them decide whether the root package finishes. Achieve this the moment a clean-tree `make gate` reaches `✓ tests` twice under load — do not re-litigate clauses 1, 2 and 4, which are verified above and cited by commit.

      ALSO FOUND UNDER LOAD, not this target's: 🎯T93 (TestHermeticCodexThreadStartTimesOut pins initialize instead of thread/start) and 🎯T94 (daemon warm-seat reuse loses to a cold spawn). 🎯T33's depends_on was corrected from [T91] to [T92, T93, T94] so this target's eventual achieve does not make 🎯T33 look unblocked when it is not.

      CORRECTION, 2026-09-21, claudia-po — item E under TEETH above is FALSE, and it was an unobserved inference recorded as an observation.

      I wrote: "E. `closed: closed` → `closed: closed && false` → reds only the new oracle below; the pre-existing one stays green." My ed0a30b commit message said the same: "leaves the old oracle green and hangs only the new one", and I presented the pair as a worked example of an assertion gap.

      cl-t95-wire-t91-mutations tested the mutation instead of transcribing my recipe — as its brief told it to — and found BOTH go red: TestAwaitPeerActivityReportsTransportClosed AND TestCursorStuckPromptWaitEndsWhenTransportDies. Its entry `T91/a-dead-peer-reads-as-silent` in mutation-evidence.json (8a8b807) declares both red and uses TestAwaitPeerActivityReportsPeerSpoke as the green control.

      The mechanism: awaitPeerActivity's loop exits on `out.spoke || out.closed`. Forcing `closed` false means a dead transport never satisfies the exit, so the wait never returns — and TestCursorStuckPromptWaitEndsWhenTransportDies asserts precisely that the wait ENDS. The mutation disables the loop's exit, not merely the outcome's rendering. There was no assertion gap in that pair.

      How I got it wrong, which is the reason to record it: my run of that mutation timed the whole package out at 60s, and the only thing I saw was the new oracle parked at cursor_prompt_wait_test.go:99. I never saw a PASS line for the pre-existing test. I reasoned that it "discards the outcome" and would therefore stay green, and wrote the conclusion as though I had observed it. That is the exact failure this repo's gate discipline exists to prevent, and I spent the same night holding workers to it.

      What still stands: the mutation genuinely bites, and ed0a30b's oracle still pins the transport-closed RENDERING, which nothing else asserts — so the commit is still worth having. What does not stand: the claim that it closed a gap the older test missed. cl-t95's entry is the correct record; this item E is not. Mutations A-D were each observed with named failing tests and are unaffected.

