      THE CHECK IS IN THE GATE, not in prose: internal/livegate.TestLiveGateCoverage runs under `go test ./...`, so `make gate` and the pre-push hook carry it with zero Makefile wiring. It sits outside the root package, which parks, so it can be run and cited on its own — a deliberate choice, and it breaks house style (the repos other two gate oracles are Python scripts) for reasons the seat stated at confidence 7: the toolchains own regexp engine for `-run` semantics, go/ast for the const and helper resolution that made the census correct, and internal/gowalk so the walk sees exactly what the compiler sees.

