    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Achieved 2026-09-21. Implementation by cl-t33-codex-load (now reaped); adjudicated by claudia-po, who did not do the work (🎯T31.1), at the overseer's request under Sentinel 🎯T410. ACCEPTANCE 2 WAS REWRITTEN BEFORE JUDGING — see below; if you think that was a gate weakened to close a target, challenge it there, because it is the one judgment call in this achieve.

      ACCEPTANCE 1 — MET, citations verified by me at HEAD rather than quoted. The 10s deadline reached the child via runCtx (codex/task.go:149) and exec.CommandContext (codex/task.go:175). On expiry os/exec killed the fake CLI; the scanner (codex/task.go:221, `for sc.Scan()`) hit EOF having read nothing; the *ExitError from cmd.Wait() then raced an already-closed runCtx.Done() at the terminal send (codex/task.go:273, `select {`), so the channel could close carrying ZERO events — exactly the reported `got=[]codex.Event(nil)`, empty rather than truncated. All four lines read back as cited at HEAD 20d01982c1b1; :149 is now `context.WithCancel`, not WithTimeout, which is acceptance 3 visible in the source.

      ACCEPTANCE 3 — MET, and held by a loop rather than an artifact. The deadline was already gone (a27d3fd switched to t.Context()); nothing stopped it returning. cl-t33 closed that with an AST guard over the package's hermetic tests (codex/wallclock_guard_test.go, committed and present at HEAD) plus a mutation-evidence.json entry so the teeth are re-derived by a gate stage instead of trusted.

      I re-derived them myself, on a clean tree, which none of cl-t33's own gate citations were: `scripts/check-mutation-evidence.py --rev HEAD --target T33` → EXIT=0, "GREEN: 1/1 entries", in the checker's own throwaway worktree at 20d01982c1b1, run at 1-minute load average 290.20. Entry `T33 / restore-wall-clock-deadline`: restoring the 10s context deadline turns TestHermeticTestsHaveNoWallClockDeadline RED (the mutation bites) while TestHermeticTaskRunSuccess stays GREEN under the same mutation exactly as declared. That green control is the load-bearing half — it shows the GUARD holds the contract, not the flaky test, and it is why the original flake stayed citably-green between failures.

      ACCEPTANCE 2 — REWRITTEN, then met. The original clause demanded a full-suite green under saturation. That instrument does not work, and the seat that did this work is what proved it: chasing the flake by saturation did not reproduce it (the PRE-FIX code passed 5/5 at load 44) and it spiked a host shared with six sibling agents to load ~136, which a supervisor pass later flagged. cl-t33 abandoned it for a deterministic differential — modelling "too loaded to schedule the child" as a 12s-slow fake CLI — under which the broken variant emitted the reported failure string verbatim and the fixed one was green under identical stimulus. A load average is a confounder nobody can set: it detects, it cannot certify.

      So the clause now asks for the codex package green on a CLEAN checkout under real contention, plus the standing guard re-derived clean. Both hold: claudia-po's earlier independent run on a clean detached worktree at 78a2cc0 (`git status --porcelain` empty) gave `go test -count=1 -race ./codex/` exit 0, ok 3.086s at load 40.7, and `-count=5` of the specific test 5/5 at load 35.7; the mutation-evidence re-derivation above ran TestHermeticTaskRunSuccess as its green control at load 290.20 and it passed. The target's own desired state — "passes under a loaded machine, not only an idle one" — is therefore true on the strongest load evidence anyone has gathered for it.

