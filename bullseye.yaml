    discovered: 2026-08-09
    achieved: 2026-08-16
  T25:
    name: MatchReady recognises a multi-line composer, so a pasted brief is diagnosed exactly rather than as unrecognised
    status: achieved
    value: 2.0
    cost: 1.5
    actual_cost: 1.5
    attestation: |-
      Product SHA 603ab70 on local master, "T25: recognise a multi-line composer so a pasted brief is diagnosed exactly". INDEPENDENT PO GATE 2026-08-10 — verifier did not write the code (🎯T31); the implementer left the achieve to the PO.

      Scope: 3 files, +161/-21, all internal/tmuxagent — readiness.go, readiness_test.go, send_turnevidence_test.go. cl-t2.1's untracked internal/broker/wire.go untouched.

      THE CHANGE: readyPattern's body now spans continuation rows via a named const, `composerContinuation = (?:\n(?:[ \t\x{00A0}][^\n]*)?)*`. A continuation row must be blank or start with whitespace — the shape Claude Code actually soft-wraps to, verified by the implementer with od against the real capture. An unindented row (a rule, a ⏺ bullet, a spinner line) ends the composer. That bound is itself the over-broadness guard: with arbitrary rows the body would run from an earlier echoed prompt in the scrollback down to the live box at the tail, so dead transcript would read as composer content.

      ORACLE RE-RUN BY THE GATE in an isolated worktree at 603ab70: TestMatchReadyRecognisesMultiLineComposer, TestComposerBodyStopsAtUnindentedRow, TestWaitReadyReturnsOnMultiLineComposer all observed PASS. Full `go test -race -count=1 ./...` exit 0 across all packages; `go vet ./...` exit 0.

      MUTATION PROOF BY THE GATE — each reverted, readiness.go restored byte-identical:
      - N1 revert to a single-line-only body (the pre-fix bug) → KILLED by TestMatchReadyRecognisesMultiLineComposer AND TestClassifyComposerRequiresPositiveTurnEvidence/unsubmitted_multi-line_brief_(real_capture).
      - N2 OVER-BROADNESS, continuation matches arbitrary rows → KILLED by TestComposerBodyStopsAtUnindentedRow/live_empty_composer_below_an_echoed_prompt. Both directions pinned.

      CROSS-TARGET GATE AGAINST 🎯T21 (run at the overseer's direction, because this commit changes MatchReady in the same package as 16ac476 and two running-turn captures now read MatchReady=true). The question was whether the two fixes disagree about what a live composer means, which would readmit the dead-spawn class through another door. They do not, and the reason is structural:
      - O1 — MatchReady saturated TRUE everywhere: every resulting failure is of the form "classifyComposer = empty_idle, want unrecognised_no_turn_evidence" and "turn not submitted: composer empty after paste". SendKeys still REFUSED in every case. ZERO failures of the form "reported success". A MatchReady misreading degrades diagnosis quality; it cannot manufacture a false "turn began".
      - O2 — MatchTurnInProgress forced FALSE: SendKeys then failed on frames carrying real turn evidence ("SendKeys failed on a frame with real turn evidence: composer state=typed_unsubmitted"). This proves turn chrome is the SOLE source of the working verdict — notably the queued/scrolled captures, which post-T25 read MatchReady=true, fell to typed_unsubmitted rather than working.
      Together: 🎯T21's property (a begun turn is recognised only from positive evidence) is independent of MatchReady, so 🎯T25's readiness changes cannot make an unbegun turn look begun. Claudia's half of jevons 🎯T387 is settled; jv-t387-turn-begin-predicate may build on it.

      BEHAVIOUR CHANGE, reviewed and accepted: frame_queued_during_turn.txt and frame_scrolled_during_turn.txt now report MatchReady=true — their box IS at the tail, live, holding a queued multi-row message. classifyComposer is unaffected (turn chrome wins). The single-line equivalent already read ready before this change, so this is the same class made consistent rather than a new one. pool.go adoptWindow is the only external MatchReady caller, and a warm window holding a queued message is legitimately adoptable.

      RESIDUAL, declared and deliberately un-fixtured: a boxed dialog whose ❯ row sits directly under a ─ rule with only indented rows beneath would still read as a composer. No such capture exists in testdata, and Claude Code's permission dialogs draw │-prefixed rows which the whitespace-start rule already excludes. The implementer declined to hand-write a fixture for a UI it has not observed; the PO endorses that — an imagined fixture pins imagined behaviour. If a real capture appears, that is when it becomes a test.

      PROCESS NOTE: this commit had already landed while the worker sat parked during the account spend limit, and was invisible to a `git status` check — found only by `git log`. Recorded because the near-inverse error (declaring a productive worker wedged on a clean tree) cost the fleet a countermanded kill the same day.
    acceptance:
