  T78:
    name: An agent acquired from the warm pool publishes its turns' Events, so WaitForResponse and subscribers work on it
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Achieved 2026-09-21. Implemented by cl-t78-pool-events at 8800805 (🎯T78: a pooled seat says what it is doing); adjudicated by claudia-po (🎯T31.1). All three cited SHAs re-proven ancestor-of-HEAD at achieve time: 8800805, 2bd849d, a545198.

      WHAT WAS WRONG. A pooled seat carried a `pool-<window>` placeholder where a session id belongs. The daemon reports `proc.SessionID()` to consumers and events are keyed by it, so a placeholder cannot name a transcript — an acquired agent published nothing and `WaitForResponse` on it could never return. It now carries a real session uuid, discovers the transcript Claude writes, and tails it.

      CLAUSE 1 AND 2, evidenced with real session ids rather than assertions. `GATE live-pool-ran exit=0 GREEN id=80b5f0b3 dur=14.3s tree=clean@2bd849df799b`, verified by claudia-po through jevons_gate_show as found=true exit_status=0 tree.clean=true, and I read its log: `TestPoolAgentEventsLive` PASS 7.93s — first holder session 4d04211d-d590-4954-b830-a19209ade8c2 answered "PEAR" over 32 events, the re-acquired window answered "PLUM" over 17 with no PEAR, which is clause 2 exactly (a fresh stream for the new holder, no replay of the previous holders turn). `daemon.TestAcquireLive` PASS 10.18s — first consumer seat 7c3d0dbd-72e9-4a73-9553-01ecbd94ca91 answered "PEAR", warm re-acquire of @1 through the daemon in 440ms answered "PLUM". No SKIP lines in that log at all.

      CLAUSE 3 rests on 80b5f0b3, NOT on the `make live` gate, and the distinction matters. `GATE make-live exit=0 GREEN id=d8abeafc dur=1m3.3s tree=clean@2bd849df799b` is real and green, but the gate record does not capture the environment, and `make live` with no CLAUDIA_*_LIVE set skips every row and still exits 0 — so that citation alone cannot distinguish a live run from a fully-skipped one. cl-t78 evidently understood this, which is why it ran a separate gate whose stated purpose was to prove the rows "ran, not skipped". That instinct is the same one 🎯T100 was filed about, and it is why this achieve cites the per-test PASS lines rather than the suites exit code.

      THE CITATION MOVED OFF ITS OWN SHA, correctly and with the parent proved red separately — this is the part the false-green checker keeps penalising and it is exactly right. A clean gate at 8800805 is RED on `TestHermeticCursorSessionMultiChunkReply` (`GATE make-gate exit=2 RED id=7a9b40c1 tree=clean@880080526249`), and the PARENT fe85b827 fails the same test identically with the change absent (`GATE parent-inherits-red exit=1 RED id=7d3bbc1b tree=clean@fe85b8273444`). cl-t79 fixed that in 2bd849d, so 2bd849d is the first tree that can honestly measure this change, and it is green on both gates: `GATE make-gate exit=0 GREEN id=cec59e91 dur=1m35.1s tree=clean@2bd849df799b`. Citing a RED to establish inheritance is attribution, not a false green; the 🎯T386 checker flagged both REDs as `attestation_not_green` and is wrong, which is filed as jevons 🎯T759 with this report as one of its two fixtures.

      A JUDGEMENT I AM ENDORSING EXPLICITLY. Its confidence=0.5 decision kills idle pool windows with no recorded `@claudia-session-id`, because adopting one hands out a seat whose `WaitForResponse` can never return — the very defect this target fixes. It flagged the race with a sibling between new-window and the first `SetWindowOption`, and narrowed it by stamping `held` before the session id. That is the right trade and the residual race is named rather than hidden. Its confidence=0.9 choice of offset-at-acquire over clearing the window is also right: the acceptance asks for a fresh event STREAM, not a fresh conversation, and clearing would discard the warmth the pool exists for.

      RESIDUE, named and accepted. The mutation-evidence entry for this work sits in a545198 — a sibling 🎯T33 commit that swept it in — rather than in 8800805, so the entrys attribution is wrong in git even though the entry itself is correct and re-derives. That is a provenance blemish, not an evidence gap, and it is the same shared-file sweeping hazard that produced 🎯T102 and that I committed three times myself tonight. Not worth a rewrite of shared history.

      AND A CROSS-TARGET FACT THIS ESTABLISHES, which is worth more than the achieve: the Claude live gate DEMONSTRABLY RAN GREEN on this host at 2026-09-20T13:58Z, with two live Claude turns answering PEAR and PLUM over real transcripts. 🎯T101 records the same gate failing at ~20:00Z at unmodified HEAD with a control (`composer empty after paste`). So the Claude live path worked six hours earlier and does not now. That is evidence for change-over-time rather than a standing property of the host, and it bears directly on 🎯T101s open question of saturation versus a TUI version whose composer the 🎯T30 submit path no longer matches. Passed to cl-t101.
    acceptance:
