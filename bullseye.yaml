  T23:
    name: Grok provider capability gaps are explicit and tested
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      All four acceptance criteria met and mutation-verified.

      (1) grokTaskBackend.RunTask refuses any req with DisallowTools before spawning, returning *CapabilityError{Provider: grok, Capability: tool_restrictions, Status: unsupported} via grokToolRestrictionRefusal, which fails closed even if the claim flips to supported.

      (2) TestGrokTaskToolRestrictionsFailClosed (hermetic, GROK_BIN -> fake CLI that SUCCEEDS, so it cannot pass for the wrong reason on hosts with grok installed). Mutation-tested: deleting the guard makes it FAIL with "Grok Task.Run dropped DisallowTools and spawned anyway". Over-broadness covered by TestGrokTaskWithoutRestrictionsIsNotBlocked, which requires an unrestricted task to reach a TaskEventResult through the real backend.

      (3) TestGrokCapabilityMatrixIsExplicit + TestGrokCapabilityMatrixMatchesBackendClaims (union-over-backends, since Grok splits Task/Session across grokTaskBackend and grokAgentBackend; has a t.Fatal vacuity guard). Found and closed a real blind spot: backendCapabilityNames has no providerCapabilities field for tool_restrictions, so the wired/claimed ratchet structurally could not see it — flipping the claim AND the want map left everything green with argv unwired. Added TestGrokToolRestrictionsClaimTracksTheArgvBuilder, mutation-verified to go red on exactly that edit.

      (4) agents-guide.md matrix cell + sub-agents section and STABILITY.md Grok provider surface now state the position and explicitly say BaseDisallowedTools is Claude-only. Also corrected the TaskConfig.DisallowTools godoc, which claimed BaseDisallowedTools "is always applied" — verified false: disallowedToolList is only called at task.go:500 and agent.go:409, both Claude.

      Oracle: go build ./... , go vet ./... , gofmt clean on touched files, go test -race -count=1 . green (CI parity with .github/workflows/test.yml).

      Residue: the refusal is deliberately the whole implementation — no --deny/--disallowed-tools translation is wired, and TestGrokTaskArgsCarryNoToolRestrictionFlags pins that. Wiring it needs a live grok oracle (docs/grok-provider-oracle-map.md) and belongs with T7.8.
    acceptance:
