    name: 'A healthy-but-slow Cursor peer is not declared stuck: the 🎯T83 silence watch survives a loaded host, and re-establishing a turn neither loses the reply nor hangs the suite'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Commits (cl-t92): 985a88b (fix, differential oracle, slow-peer fake), 7ae95d9 (turnaround probe), 148df5f (margin stated), 1db738d (second wait''s snapshot moved into the stack swap; a product bug found by the gate). Deterministic differential: the snapshot test was RED 17/20 before the fix (3acac48b@577bbf5) and GREEN 20/20 after (c0e4b5cf@1db738d). cursorPromptSilenceBound is untouched. Full suite: `GATE make-gate exit=0 GREEN id=028d9696 tree=clean@1db738d` and df826cc7@7634e06 (inside the freeze window). Cursor live: `GATE make-live exit=0 GREEN id=1bc0a9f6 tree=clean@994f0e8` (CLAUDIA_CURSOR_LIVE=1, load 76→105). The earlier c617a303 RED was TestCursorSavedSessionResumeLive''s exact-string compare against a model preamble; the re-issue path fired 0 times, and the test passed alone at 13d1a0bd. claudia-po verified the records in ~/.jevons/gates.'
    acceptance:
    - 'THE INSTRUMENT, and it is not saturation. `TestCursorStuckFirstPromptRecoversOnReissue` must be shown fixed by a DETERMINISTIC DIFFERENTIAL: model the condition ("the peer was about to answer but the host did not schedule it in time") as a deliberately slow fake peer, and show the broken variant emitting the observed failure verbatim and the fixed one green under identical stimulus. cl-t33 proved saturation is the wrong instrument on exactly this family — at load 44 the pre-fix codex code still passed 5/5, so a load run can neither confirm nor refute, and it degraded a host shared with six sibling agents. A load run may CORROBORATE and is welcome as a second data point; it may not be the primary evidence.'
    - 'Neither outcome survives: `reply "", want pong` (the reply lost) and an indefinite park in `WaitForResponse` that blows the package''s 10m timeout (the suite hung). Both have been observed from this one bound.'
    - The ORACLE's bound stops deciding on wall-clock. `shortenCursorSilenceBound(t, 400*time.Millisecond)` is replaced by a fake peer whose reply is driven by a signal the test controls, so the verdict comes from the event the test needs rather than from how fast the host was. If a bound must remain, it preserves the product's measured margin and its value states that ratio.
    - '`cursorPromptSilenceBound` itself is NOT the defect and is not to be "fixed". It is measured and documented at cursor_acp.go:95-113 — three real cursor-agent mints at 14.0s, 14.1s and 18.3s to first inbound message, bound at 120s, ~6.5x the worst observed, asymmetry stated (recovery is cheap, a false positive is not). Making it non-global (🎯T98) is a different change from changing its value. Any change to the value re-derives the measurement first.'
    - 'A reply that lands after the bound expired but before the re-delivery is not dropped: the caller sees the peer''s answer rather than an empty reply, or the target records why discarding it is correct.'
    - Re-establishing a turn cannot leave a caller with no terminal event to wait for. Either the re-issue guarantees a terminal event for the surviving prompt id, or 🎯T96's bound in `WaitForResponse` catches it — and the target says which, rather than leaving the two fixes to assume each other.
    context: |-
      Found 2026-09-21 by claudia-po's review of 🎯T91's finish, on a CLEAN detached worktree at e18806d (`git status --porcelain` empty), running `make gate` under deliberate saturation (12 parallel `go test -race` builds, load average 121.8 rising to 122.8). GATE exit=2. The root package COMPLETED in 97.759s — the 🎯T91 hang is genuinely gone — but carried:

          --- FAIL: TestCursorStuckFirstPromptRecoversOnReissue (1.23s)
              cursor_stuck_prompt_test.go:119: reply "", want pong
          WARN cursor acp opening prompt drew no response; re-establishing the turn
            session=sess-fake-cursor-1 prompt=4 bound=400ms observed="no inbound message of any kind in 402ms"

      The log line is the whole mechanism, and 🎯T91's new `observed` field is what made it readable: the fake peer WAS going to answer, it just needed more than 402ms on a host at load 122. The harness called a healthy peer stuck, re-established the turn, and the pong was lost — so the test read reply "" .

