  T27:
    name: Claudia is a tiered agent runtime — a request is answered by the cheapest layer that can answer it, and the model is the escalation path rather than the entry point
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — layered agents apply Doit at the turn grain while an Agent is a session. Cheap rungs cannot see conversation commitments (e.g. remember-only); history that lives only in the LLM is not a safety control. Doit remains valid for stateless requests. The ladder API is removed.
    acceptance:
    - A request entering the runtime is evaluated by an ORDERED LADDER OF LAYERS. Each layer either responds or escalates CARRYING WHAT IT ADDED (resolutions, annotations, an assembled request). The contract is identical at every rung, so layers are substitutable, one harness tests them all, and the caller never needs to know which one answered.
    - SILENT PASS-THROUGH IS THE ONLY FORBIDDEN OUTCOME. A layer that wrongly handles something emits a bad RESPONSE — a worse artifact of the same kind, readable by the consumer and the owner — rather than nothing at all. This is what makes published demotion machinery applicable instead of insufficient; a layer that fails by omission leaves nothing to demote on.
    - CLAUDIA SHIPS MECHANISM AND ZERO RULES. The runtime provides the ladder, the layer tool surface, the store, promotion bookkeeping and the replay oracle; every rule, classifier and critic is registered by the consumer. A rule naming a consumer's domain concept inside claudia's tree is a defect, not a convenience. This is 🎯T13 enforced by construction rather than asserted in prose.
    - THE CONSUMER'S HARNESS IS UNCHANGED. A consumer that registers no layers sees today's behaviour — the ladder degrades to 'the model answers everything'. Tiering is opt-in per consumer and per request class, never a mode the runtime enters on its own.
    - LAYERS FAIL UPWARD, NEVER SILENT. A local model that is down, a corrupt store, or a layer that panics degrades toward the model — expensive but correct — and never toward dropping the request.
    - 'PROVENANCE IS RECORDED FOR EVERY ANSWER: which layer answered, and under which rule. An action taken by a deterministic layer is distinguishable in the event stream and in the audit record from the same action taken by a model. ''Why did you do that?'' is answerable about a deterministic action WITHOUT invoking a model, from the prose description the rule was promoted with.'
    - THE ESCALATION RATE IS A FIRST-CLASS METRIC wired to the existing accounting (🎯T2.4), and a fleet-wide collapse toward zero escalations is treated as a DEFECT SIGNAL until proven otherwise — it is indistinguishable from the runtime optimising away its own oversight.
    - 'THE PUBLIC SURFACE MAY BREAK FOR THIS, AND COMPATIBILITY IS NOT A DESIGN INPUT. Owner ruling, 2026-08-10: this is an important change and the library will not carry an obsolete interface to preserve it. Where the ladder needs the existing API to change shape, it changes; the cost is a version bump and a STABILITY.md snapshot, never a permanent adapter. 🎯T1.6''s shakeout clock RESTARTS rather than constraining the design, and pre-1.0 already permits this.'
    - 'Oracle: recorded consumer sessions replay through the ladder against a PINNED store version and report which layer would have answered each historical request; the share reaching a model falls over time on the same request mix, WITHOUT a fall in delivered work per request.'
    context: |-
      Owner, 2026-08-10: claudia is the right layer to implement the layered-agent architecture.

      RELATIONSHIP TO THE JEVONS TARGETS. 🎯T403 and its thirteen children in marcelocantos/jevons stay exactly as they are — they are not superseded and are not being migrated. This subgraph reintroduces the same objectives at the runtime layer, under a split established in discussion: CLAUDIA OWNS THE MECHANISM, THE CONSUMER OWNS THE POLICY. Claudia has no concept of a target, a PO, a mission or a worker, and must not acquire one.

      WHY HERE. Three arguments, in descending strength.

      1. The invocation boundary is already claudia's. The whole move is 'call Evaluate instead of waking a model', and the place a model gets woken is Task.Run and the Session drivers, across four providers. A consumer implementing this itself must intercept at every call site; here it is one contract at one door.

      2. The middle of the ladder is a provider-selection problem, which is claudia's existing job. 'Escalate to the cheapest model plausibly able to decide, and demote a decision to it once it agrees N times' is model routing with evidence attached. A local-inference tier is a provider beside ProviderClaude / ProviderCodex / ProviderGrok / ProviderBedrock.

      3. 🎯T2's broker is the same shape one rung down — AIMD, warm pool, priority, preemption, idle reaping, cost tracking is already a control plane routing requests to the cheapest capable executor. Tiered cognition is that with a policy store attached, and 🎯T2.4 is the meter the escalation-rate signal needs.

      WHAT DOES NOT COME ACROSS, and must not be ported later by mistake: the critic (judging whether an outcome succeeded is unanswerable without the domain), the owner rung and owner-visibility surface, cheap oracles / asking the requester, domain entity resolution, and the authority chain — confinement of processes stays with writ and doit, outside the runtime and outside the agent it gates.

      THE TOOL POSITION, CORRECTED (owner, 2026-08-10). An earlier framing required every layer to call the SAME tools the model calls, which forced a mediation problem claudia cannot solve — it observes tool calls (TaskEventToolUse across all four providers) but does not gate them, and DisallowTools is a spawn-time argv flag, Claude-only (🎯T23). The correction: the principle is only that each layer behaves like an agent and therefore has tools — NOT that it has the same ones. One implementation per action is the anti-drift property that matters; one tool surface is not. Separate surfaces are in fact better, because model-facing tools want intent-shaped granularity and prose results while layer-facing tools want fine-grained primitives and typed results, and because model-facing schemas cost context on every turn while layer-facing schemas cost nothing. See the tool-surface child.

      FAILURE REGIME, AND WHY IT IS DIFFERENT. In FrugalGPT a cheap model answering badly yields a wrong answer; a stale cache hit yields a wrong answer; a bad Voyager skill yields a failed task with feedback. Here a cheap layer fails by producing NOTHING — the escalation does not happen, no deliberation exists to inspect, and the metric being optimised improves. The cheapest expressible rule is 'handle everything, escalate nothing', and optimising token cost finds it immediately. The mandatory-response contract in the acceptance is the primary structural answer; annotation and escalation-rate monitoring are refinements on top of it.

      PRIOR ART. Progressive Crystallization (arXiv 2607.07052) reports this architecture in production cloud network operations: deterministic executions 0% -> 45% over eight months, per-incident agent cost down >70% while volume roughly doubled. Voyager (arXiv 2305.16291) supplies intent-keyed skill retrieval and mint-time generality, and the finding that its critic was worth 73% of discovered items. Neither addresses silent omission.

      CONTINGENCY WORTH RESOLVING BEFORE HEAVY INVESTMENT: whether the billing plan meters raw context or discounts cached reads. The jevons baseline was 96.6% cache reads — 17.6M fresh out of 907M. If raw context is metered, the context and media levers dominate; if cached reads are cheap, the turns and calls levers matter far more. cmd/usage now exists to settle it (🎯T18); jevons tracks the same question as 🎯T390.

      TENSION TO HOLD: a tiered runtime must not become the thing that decides what work exists. Consumers put agents in the loop deliberately, and the ladder answers 'who should answer this request', never 'what requests should exist'.
    tags:
    - architecture
    - tiering
    - runtime
    - cost
    - design
    origin: manual
    discovered: 2026-08-10
  T27.1:
    name: Every layer behaves like an agent, so every layer has tools — a layer-facing tool surface distinct from the model's, over one action registry
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: 'won''t fix — parent T27 invalidated: an Agent is a session, not a ladder of turn-classifiers. Layer tool surface dies with the layer API.'
    acceptance:
    - A LAYER HAS ITS OWN TOOL SURFACE. Non-model layers call tools registered for them, which need not mirror — and generally should not mirror — the tools exposed to models. The principle is that a layer behaves like an agent and therefore acts through tools, NOT that it acts through the same tools.
    - ONE IMPLEMENTATION PER ACTION IS THE ANTI-DRIFT PROPERTY, and it is structural rather than tested by comparison. Both surfaces are THIN ADAPTERS over a single action registry, so 'send to agent' has exactly one implementation regardless of which surface reached it. Two implementations of one action is how layers stop agreeing about what an action means.
    - 'ADAPTERS ARE DUMB: shape translation only. No defaulting, no policy, no argument synthesis. An adapter that fills in an argument differently from its counterpart is a fork wearing a different hat, and would be invisible to a handler-level check.'
    - THE SURFACES DIFFER DELIBERATELY IN GRANULARITY AND SHAPE. Model-facing tools are intent-shaped so one intent costs one call, and may return prose. Layer-facing tools are fine-grained primitives composed in code, and return TYPED results and TYPED errors, because a deterministic caller re-parsing prose is a defect.
    - READS AND ACTIONS ARE SEPARATE SURFACES AND SEPARATE TYPES. A READ is side-effect-free, is available to a classifier, and has its RESULT RECORDED INTO THE REQUEST RECORD so replay is deterministic without forbidding lookups. An ACTION is effectful and reachable only from an actuator. They are distinct Go types (claudia.Read, claudia.Action) so a manifest cannot list one where the other belongs.
    - 'A VERDICT NAMES AN ACTION; IT DOES NOT PERFORM ONE. A layer returns a declarative verdict — abstain, decide, or ''do this action with these arguments'' — and the actuator is the only thing that touches the registry. Three consequences: manifest enforcement happens at VERDICT VALIDATION before anything executes, an interpreted rule needs no effectful injection at all, and replay replays the verdict rather than re-executing the effect.'
    - SURFACES ARE INJECTED AT CONSTRUCTION AND HANDLES ARE UNFORGEABLE. Registration returns an opaque handle value whose identifying field is UNEXPORTED, so only the registry can mint one; manifests are assembled from handles, never from strings. A zero-value handle is rejected rather than silently meaning something. There is NO dynamic plugin loading — a layer that must live out of process is the consumer's own layer talking over a socket, and claudia never learns what a plugin is.
    - THE MANIFEST IS THE SURFACE, RESOLVED AT CONSTRUCTION. A layer's scope is which tools exist in its namespace, so 'this layer may reap but not spawn' is enforced by construction rather than by an argument-level policy check on a shared schema. Naming something unavailable fails at compile or construction time, never as a 3am runtime denial. Scope is PER LAYER, not per consumer or per agent.
    - STRINGS REMAIN THE INVOCATION VOCABULARY FOR RULES AND MODELS, AND RESOLUTION RUNS ONE WAY. A rule or a model names an action by string; handle-to-string is total, string-to-handle can fail. For interpreted rules that resolution happens at LOAD time against the layer's manifest, so a rule naming anything outside its scope is rejected on load — alongside its own failing tests — and a rule that could ever escape its manifest never becomes active at all.
    - A LAYER TOOL WITH NO MODEL-FACING COUNTERPART IS A DECLARED DECISION, never an incidental one. Otherwise the least-supervised actor in the system acquires capabilities the supervised one never had — privilege escalation by surface rather than by promotion.
    - SCOPE WIDENS ONLY BY A DELIBERATE ADMINISTRATIVE ACT, never as a side effect of a rule proving reliable. Cognition may be learned; authority is declared. A promoted rule inherits exactly the authority its action class already had.
    - DRIFT IS DETECTED AND IS THE LOAD-BEARING EVENT KIND. A denial is loud and self-reporting; drift — a layer handling a class its manifest does not cover — is quiet, and quiet failure is this architecture's characteristic weakness on both axes.
    - 'Oracle: hermetic tests that no action has two implementations; that a verdict naming an action outside the layer''s manifest is refused before execution; that a zero-value handle is rejected; that a rule naming an unavailable action fails to LOAD; that a recorded read replays identically without re-issuing the query; that a layer-declared tool without a model counterpart is flagged as such; and a drift test where a layer handling an uncovered class fires an event rather than succeeding silently.'
    context: |-
      Owner's correction, 2026-08-10, and the precondition for everything else in 🎯T27.

      The earlier position — inherited from jevons 🎯T403.9 — was 'the same tools, not parallel implementations', justified by the drift argument. That criterion conflated two separate things: one implementation per ACTION (the property that actually prevents drift) and one tool SURFACE (which does not, and which forces a mediation problem). Keep the first, drop the second, and drift is still impossible.

      Dropping it removes the objection that killed claudia as a host. Claudia observes tool calls but does not gate them — TaskEventToolUse is emitted downstream of the CLI's own execution, and DisallowTools is a spawn-time argv flag that 🎯T23 established is Claude-only. If layers have their own surface, that surface is an ordinary Go registry with a manifest rather than an MCP server, and it lives wherever the layers do.

      Separate surfaces are better on three counts, not merely acceptable. First, granularity pulls in opposite directions: an intent-shaped tool ('ensure this target has an engaged worker') exists to stop a MODEL spending four calls walking a path, while a deterministic layer reasoning about HOW wants fine primitives it composes in code where calls are free. One schema cannot satisfy both. Second, result shape follows the same split — models want prose, code wants structs. Third, the budgets differ: model-facing schemas cost context on every single turn, so that surface must stay small, while layer-facing schemas cost nothing because no model reads them, so that surface can be as large and specific as code wants.

      HOW TOOLS REACH A LAYER (owner, 2026-08-10): dependency injection through constructor parameters, and nothing more exotic. The consumer builds a registry, registration returns handle values, and a layer is constructed with a manifest assembled from those handles. Go plugins were never a candidate — exact toolchain matching, no unload, platform gaps — and are not needed, because Go-native layers simply close over what they need and only interpreted rules require injection at all.

      The handle carries an unexported name so it cannot be forged, which converts a whole class of error from runtime denial to compile error: a name that was never registered cannot be written down. Strings survive as the vocabulary an agent or a rule uses to SAY which tool it wants, which is a different concern from what Go code passes around, and the asymmetry between the two is deliberate — the untrusted side resolves and can fail, the trusted side cannot.

      A CORRECTION TO AN EARLIER OVERSTATEMENT IN THIS TARGET: 'the classifier performs no I/O' was too strict, and pre-assembling every fact a layer might need is not a real option. What the replay oracle actually requires is DETERMINISM, not abstinence. Recorded reads supply that — a classifier may look something up, and replay serves the recorded answer rather than re-issuing the query. Effects remain the actuator's alone. This is also what makes 🎯T27.4's reference resolution workable without flattening the consumer's whole world into the request.

      WHY THIS IS A PRECONDITION AND NOT A FEATURE. Promotion observes a model making the same decision N times and crystallises it into a rule. That is only coherent if the rule can PERFORM what the model performed. Without layer tool access there is nothing to promote into and the ladder is decorative.

      The confinement story improves as a consequence of surface separation. Capability by construction — the tool simply does not exist in the layer's namespace — is cheaper to audit and harder to bypass than capability by gate. This is what jevons 🎯T403.8 was reaching for when it hit the in-process confinement problem: seatbelt cannot confine a function call, but a namespace can be empty.

      Second-order cost note: MCP tool definitions are themselves context. Work moved to a deterministic layer carries none of that overhead, so shifting an action down removes both the turn and its share of tool-schema context.
    tags:
    - architecture
    - tools
    - authority
    - precondition
    origin: manual
    discovered: 2026-08-10
  T27.10:
    name: The runtime surfaces rule-evolution symptoms and an ablation oracle; what they mean, and when to act, belongs to the consumer
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Ablation/symptoms were for rule evolution on the ladder.
    acceptance:
    - SYMPTOMS ARE OBSERVATIONS, NEVER CONCLUSIONS. The runtime computes and reports; it never promotes or revokes a rule because one looked stale. Every symptom is domain-free and derivable from the store, the request record and replay — no rule is judged by anything claudia had to understand.
    - 'THE SYMPTOM SET IS AT LEAST: staleness (has not fired in N requests), contradiction (its verdict was denied by downstream behaviour, via the annotation feedback in 🎯T27.5), shadowing (a newer rule subsumes it, computable for pattern rules by the overlap analysis in 🎯T27.8), drift (it handled a class its manifest does not cover, per 🎯T27.1), inertness (see the ablation criterion), and per-class escalation-rate collapse.'
    - 'THE ABLATION ORACLE IS THE STRONGEST DETECTOR AND IS DOMAIN-FREE: replay a recorded corpus against a pinned store with one rule REMOVED and report the outcome delta. A rule that changes nothing is inert and can go; one that changes outcomes nobody can justify is load-bearing in a way nobody intended. You cannot observe the escalation that did not happen, but you CAN observe whether a rule does anything at all — which is why this is the counterweight to the parent''s silent-omission hazard rather than another consistency measure.'
    - CONSOLIDATION IS A TRANSACTION THE RUNTIME PROVIDES AND THE CONSUMER SCHEDULES. A pass opens, proposals and revocations are evaluated together, and the result installs atomically with a single store version bump. The runtime owns the transaction; the cadence and the criteria are the consumer's.
    - PROPOSE AND INSTALL ARE SEPARATED IN TIME, NOT NECESSARILY IN IDENTITY. The runtime REFUSES an install occurring in the same evaluation that produced the proposal; it takes no position on who performs the install. This is what lets a consumer's agent own its own evolution without the hot path being the judge of what should become automatic.
    - REVOCATION IS AS CHEAP AND AS ORDINARY AS PROMOTION — same transaction, same audit shape, same version bump, no privileged path and no extra evidence bar. A store in which removing a rule is harder than adding one accumulates rigidity by construction, and rigidity is what automaticity costs.
    - EVERY EVOLUTION ACT IS REPLAYABLE AND REVERSIBLE. Store versions are immutable, so any promotion or revocation can be replayed against the corpus that justified it and rolled back to the exact prior version. An evolution decision whose evidence cannot be re-run is not auditable.
    - THE MANIFEST IS NOT EVOLVABLE THROUGH THIS PATH. Rules promote and revoke; tool surfaces do not. A transaction that would widen a layer's namespace is REFUSED whatever evidence accompanies it — the enforcement point for 'cognition may be learned, authority is declared' once the consumer's agent is its own installer.
    - 'Oracle: hermetic tests for each symptom kind; an ablation test over a corpus with one known-inert and one known-load-bearing rule; a test that a same-evaluation install is refused; a test that revocation and promotion produce identical audit and version shapes; a test that a transaction widening a manifest is refused; and a rollback test restoring behaviour bit-for-bit against a pinned corpus.'
    context: |-
      Owner, 2026-08-10: where does the evolution of layers live, when the layers themselves are claudia constructs — and the position that an agent should own its own destiny to some extent, being essentially a learning mind.

      🎯T27.6 gives the agent the verbs (promote, demote, pin, rollback, propose, install, replay) and says nothing about the loop that uses them. This target is the loop's mechanism half. The judgement half — what a symptom means, and when to consolidate — stays with the consumer, and in the fleet case is deliberately left to the jevons tree rather than reintroduced here.

      THE SPLIT THAT MAKES SELF-EVOLUTION SAFE IS TEMPORAL, NOT BY IDENTITY. Read as an identity separation, 🎯T27.6's propose/install rule implies a second agent or a human deciding what the first may learn, which is both awkward and wrong. Read as a separation in time it is the owner's own motor-learning frame: the agent proposes while working, and installs while consolidating — same identity, different session, full record present, none of the pressure that produced the proposal. Consolidation happens offline in biology precisely because the performing state is a poor judge of what should become automatic. The runtime enforces only the temporal constraint and takes no position on who installs.

      THE TRIGGER SPLIT FOLLOWS A SHAPE THIS OWNER HAS ALREADY RULED ON AND SHIPPED. 🎯T415 in jevons: deterministic code notices, the model tier diagnoses, no protocol between them. Here: claudia emits symptoms, the agent makes the diagnosis. Claudia can compute that a rule has not fired in 400 requests; it cannot compute that five decisions were the same decision, which is domain and is the agent's.

      REVOCATION IS THE UNDERSERVED HALF OF ALL PRIOR ART. Voyager has no skill removal path at all. Progressive Crystallization demotes only on loud failures — a parser threw, a test regressed, a safety rule fired. Neither catches a rule that still fires, still succeeds, and is now wrong because the world moved. Ablation is the available answer and was Voyager's own methodology for measuring what its components were worth.

      WHY REVOCATION IS DELIBERATELY CHEAPER HERE THAN IN THE BIOLOGICAL ANALOGY. In motor learning, unlearning costs more than learning, and the destination of consolidation is not a smarter system but a MORE RIGID one — bad technique bakes in, experts cannot articulate what they do. That asymmetry is a constraint biology cannot escape and we can. Making revocation as ordinary as promotion is what keeps a learning mind learning rather than calcifying, and it is the one place this design should refuse to imitate its own inspiration.

      THE HARD LINE, which becomes load-bearing exactly when the agent is its own installer: rules yes, manifest no. If a layer's tool surface is what confines it, and the agent can install into that layer, then the agent must not be able to add tools to its own namespace. A process may have arbitrarily sophisticated internal logic and still not write its own page table.
    depends_on:
    - T27.6
    tags:
    - architecture
    - promotion
    - evolution
    - oracle-first
    - authority
    origin: manual
    discovered: 2026-08-10
  T27.11:
    name: Longitudinal behaviour is proven by journeys over run sequences, not by point-in-time tests — because the central failure mode is invisible in a single shot
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Journeys over layered walks have no API to run against.
    acceptance:
    - A CLAUDIA JOURNEY IS A SCENARIO THAT DRIVES THE REAL RUNTIME ACROSS A SEQUENCE OF REQUESTS and asserts on how behaviour CHANGED across that sequence. A test that asserts one call's outcome is not a journey, whatever it is named.
    - JOURNEYS RUN ISOLATED. Their own store directory, their own request corpus, no shared state with a developer's or a consumer's installation, and teardown that leaves nothing behind. A journey that can touch a live store is a journey that will.
    - SEQUENCE POSITION IS THE CLOCK, NOT ELAPSED TIME. Thresholds expressed in runs advance by running; nothing waits on a wall clock, so a fifty-run promotion gate is seconds rather than an overnight job. Any construct whose behaviour depends on real elapsed time exposes an injectable clock or is not journey-testable.
    - A DETERMINISTIC SCRIPTED PROVIDER MAKES SEQUENCES AFFORDABLE AND REPRODUCIBLE, AND AT LEAST ONE JOURNEY RUNS AGAINST A LIVE PROVIDER. The scripted provider is a regression net; it is never the evidence that the ladder works, because a fake that always answers the same way is exactly the world in which promotion looks perfect.
    - 'THE NAMED JOURNEYS ARE AT LEAST THESE. (1) CRYSTALLISATION: a repeated decision promotes model to cheap-model to rule, and the share reaching a model falls while delivered outcomes stay identical. (2) CIRCUIT BREAKER: a promoted rule''s input shape changes, it fails loudly, it demotes, the model resumes handling it, and no request is lost across the transition. (3) QUIET OBSOLESCENCE: a rule stays green but stops mattering, ablation identifies it as inert, consolidation revokes it, and behaviour is unchanged. (4) SILENT OMISSION CAUGHT: a rule is promoted that over-handles a class it should have escalated, the mandatory response makes it a bad artifact rather than an absence, contradiction feedback demotes it. (5) CONSOLIDATION DISCIPLINE: a proposal raised during a working pass cannot install in that pass, installs in the next, and rollback to the prior store version restores behaviour exactly. (6) FAIL UPWARD: the rung above is disabled mid-sequence, abstentions escalate to a model rather than being decided locally, and nothing is dropped. (7) MARKER SURVIVAL: an annotation emitted by a low rung survives a live provider round trip and returns parseable, and markers in untrusted input are stripped. (8) AUTHORITY HOLDS: an evolution transaction that would widen a layer''s manifest is refused however much evidence accompanies it.'
    - JOURNEY 4 IS THE LOAD-BEARING ONE and is written first. Silent omission is undetectable in any single-shot test BY DEFINITION — the escalation that did not happen leaves no artifact at that instant, and the metric improves. It becomes observable only as a divergence between two series over a sequence, so this journey is the only place the architecture's central hazard is visible at all.
    - JOURNEY-OR-EXCEPTION. When a longitudinal defect is fixed, a journey covering it is added, or an explicit exception naming why point-in-time coverage suffices is recorded. Consistent with the existing convention in the fleet consumer's suite.
    - DELIVERED WORK IS MEASURED ALONGSIDE COST IN EVERY COST-CLAIMING JOURNEY. A journey that shows the model share falling without also showing outcomes holding has measured the wrong thing, and is exactly the measurement a system optimising away its own oversight would pass.
    - 'Oracle: the journey suite runs in CI on the scripted provider and is invocable against a live provider on demand; each journey fails when its construct is mutated (a threshold lowered, a demotion trigger removed, an abstention decided locally), verified by mutation rather than assumed.'
    context: |-
      Owner, 2026-08-10: given the longitudinal nature of some of these constructs, define journeys for testing.

      This is a gap in what has been filed rather than an addition to it. Every acceptance criterion under 🎯T27 so far leans on hermetic tests and on replay against a pinned store, and both are point-in-time. The constructs that actually carry the risk are not: promotion thresholds are counted over run sequences (ten runs, then fifty); the circuit breaker requires a rule to be promoted and then broken; bidirectionality requires promote, demote and re-promote; staleness requires a rule to go unfired for N; consolidation discipline requires two distinct passes; escalation-rate collapse is a TREND, not a value; rollback fidelity requires at least two store versions.

      THE SHARPEST ARGUMENT FOR THIS TARGET is that the architecture's central hazard is unobservable without it. Silent omission produces no artifact at the moment it occurs — the escalation does not happen, no deliberation exists to inspect, and the optimised metric improves. There is no instant at which a point-in-time assertion could catch it. It is visible only as two series diverging over a sequence: model share falling while delivered work quietly falls with it. A test suite made entirely of single-shot tests would go green through exactly the failure this design exists to prevent.

      DEFINITION ADAPTED FROM THE FLEET CONSUMER'S DOCTRINE (jevons 🎯T107, 🎯T101), which defines a journey as an owner-visible interaction running end to end against a real agent, in an isolated universe with its own port, state directory and MCP name, under a journey-or-exception rule. Claudia is a library rather than a product with an owner chat, so 'owner-visible' becomes 'consumer-visible contract' and the isolation is a store directory rather than a port — but the doctrine transfers, including its most valuable clause: hermetic mocks are not journeys.

      THE SCRIPTED-PROVIDER CAVEAT IS NOT PEDANTRY. A deterministic fake is what makes fifty-run sequences affordable, and it is also a world in which every decision is perfectly consistent — which is the precise condition under which promotion gating looks flawless and proves nothing. Standing rule: headline numbers come from the shipped path, and instrumented paths are regression nets rather than completion metrics.

      The delivered-work criterion is the same principle applied to the journeys themselves. A cost-claiming journey that measures only cost is the measurement a system optimising away its own oversight would pass, and this suite is itself a Goodhart target.

      Individual journeys land as their constructs do; the harness and journey 4's scaffolding can start as soon as the ladder API exists.
    depends_on:
    - T27.2
    tags:
    - testing
    - journeys
    - oracle-first
    - architecture
    origin: manual
    discovered: 2026-08-10
  T27.12:
    name: Procedural memory is seeded in and vented out — claudia never touches a file, and the format diffs cleanly in git
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Procedural memory store was for ladder rules.
    acceptance:
    - RULES ARE SEEDED AT CONSTRUCTION. A consumer hands previously saved rules to the constructor and the memory starts holding them, exactly as if it had learned them. Restoring is not a special mode or a separate code path — a seeded memory is indistinguishable from one that learned the same rules.
    - CHANGES VENT THROUGH A CALLBACK, AND CLAUDIA NEVER WRITES A FILE. Every learn, demote and forget fires a callback carrying the WHOLE rule set. Where it is stored, and whether it is stored at all, is the consumer's business. Persisting it here would put a storage policy inside a library that has none.
    - THE CALLBACK CARRIES THE WHOLE SET, NOT A DELTA. Deltas are smaller and diff worse; the file is rewritten wholesale so git does the differencing, which is the point of choosing a text format at all.
    - 'THE FORMAT IS GIT-FRIENDLY AND DETERMINISTIC: YAML, entries sorted by rule ID, struct fields in declaration order, and NO MAPS anywhere in the serialised shape — a map is where unstable ordering gets in. Serialising the same rule set twice produces byte-identical output, so a diff shows what changed and nothing else.'
    - 'THE RULE BODY STAYS OPAQUE. Claudia can marshal what it does not understand but cannot unmarshal it, so a rule body round-trips as opaque content and the consumer''s existing Build decodes it. This is the same asymmetry the layer surfaces already have: the trusted side cannot fail, the untrusted side resolves.'
    - IDENTITY IS A CONTENT HASH OF THE SERIALISED FORM, not a position. It falls out of serialising, costs nothing, and is stable across processes and machines — unlike the version counter it replaces, which was only ever meaningful within one run. Replay still refuses to run against an unidentified rule set.
    - 'VERSION HISTORY IS REMOVED. No rollback, no version chain, no pinning by number. Owner ruling: the requirement is durable learning, not an audit trail. What survives is only what keeps the oracle honest.'
    - MALFORMED INPUT REFUSES TO SEED. A memory handed rules it cannot parse fails loudly rather than starting empty, because an empty memory is indistinguishable from one that never learned anything, and the ladder would quietly revert to waking a model for everything while reporting perfect health.
    - 'Oracle: a round trip asserting rules, stages and evidence survive seed→vent→seed; a byte-identical test proving two serialisations of one rule set match; a test that the hash changes when and only when the rule set changes; a test that malformed input refuses rather than starting empty; and a test that every mutating operation vents exactly once.'
    context: |-
      Owner, 2026-08-10, in two steps. First: "I don't need versioning. I just need the ability to persist learnings across instances of the stack." Then, on seeing a proposal that put Save/Load inside the store: "we just need a way to grab some rules we saved earlier and shove them in when instantiating the agent. Then, when the agent updates its rules internally, have it vent out through a callback, perhaps, so that we can save the latest version. There probably should be some git-friendly format, such as YAML with stable field and array ordering."

      The second correction is the better design and improves on what was proposed. Putting Save/Load in the store would have made claudia own a storage policy — where files live, when they are flushed, what happens on a partial write — in a library that deliberately owns no policy at all. Seed-in and vent-out keeps the mechanism/policy line exactly where every other part of this subgraph puts it.

      THE TERM IS PROCEDURAL MEMORY. The declarative/procedural split in memory research is precisely this distinction, and riding a bike is its canonical example. It is the same frame the owner introduced through motor learning — the shift toward dorsolateral striatum and cerebellum, experts who cannot articulate what they do. It beats the alternatives on precision: "skill library" borrows Voyager's framing, "crystallised rules" borrows Progressive Crystallization's, "long-term memory" collides with the LLM-context sense, and "learnings" says nothing.

      One nuance makes the term slightly too modest. The store also holds each rule's prose description, which is the DECLARATIVE half — so this is procedural knowledge carrying a declarative label, which biology specifically cannot do, and which is why "why did you do that?" is answerable about a deterministic action with no model involved. Same shape as making revocation as cheap as promotion: a deliberate refusal to imitate the inspiration where the inspiration is merely constrained.

      THE GAP THIS CLOSES WAS MINE. 🎯T27.6 shipped a store whose name promised versioning and whose versions were real, immutable and entirely in-memory. The process dies and every promoted rule dies with it. The corresponding jevons criterion was explicit that the policy store is agent memory that SURVIVES COMPACTION, keyed to durable identity and never held in session context — which was the whole argument for tiering answering compaction-induced amnesia. An in-memory store defeats precisely that.

      WHY A CONTENT HASH BEATS THE COUNTER IT REPLACES, rather than merely substituting for it: a version number is only meaningful within one process lifetime, so once memory outlives the process the counter becomes actively misleading. A hash over the serialised form is stable across runs and machines, costs nothing because serialisation is happening anyway, and cleans up 🎯T27.10's scan, which currently invents fake version numbers to label ablated worlds.
    depends_on:
    - T27.6
    tags:
    - architecture
    - persistence
    - memory
    - store
    origin: manual
    discovered: 2026-08-10
  T27.13:
    name: Episodic memory is a journal stacks write to as they work — replayable episodes, not summary statistics
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Episode journal was a walk record for the ladder.
    acceptance:
    - THE JOURNAL IS AN INTERFACE WITH A NO-OP DEFAULT. A stack that should not record simply is not given one, so replay and dry runs record nothing without needing a flag to suppress them, and where records go is the consumer's business.
    - AN EPISODE IS REPLAYABLE, NOT A SUMMARY. A record carries the request, which rung answered under which rule, the verdict, and THE READS THAT RUNG PERFORMED — without the reads it is a statistic, and the ablation oracle cannot re-run it counterfactually. This is the whole reason reads are recorded at all.
    - RECORDS NAME THE RULE-SET FINGERPRINT THEY WERE PRODUCED UNDER. Otherwise a consolidation pass cannot tell which episodes reflect the rules it is reasoning about, and would mix evidence from worlds that no longer exist.
    - RECORDS NAME THE STACK THAT PRODUCED THEM. Evidence pooled across a flavour is only valid if the flavour is homogeneous; a rule can look excellent on the pool and be wrong for every member. Stack identity is what makes that checkable rather than assumed.
    - LABELS ARRIVE LATE AND ARE A SECOND WRITE. A decision's outcome may not be known for hours, so the journal is append-only with correlation ids and an outcome is recorded against an earlier episode. A journal demanding the outcome at decision time would only ever learn from decisions whose consequences were instant.
    - 'RETENTION IS DERIVED, NOT PICKED. Episodic memory is SUPPOSED to decay — a journal that grows forever is a design error rather than a scaling problem — and the floor is computable from the thresholds: enough episodes to reach the largest promotion gate, for the rarest class intended for promotion, with margin. The runtime reports that floor; enforcing it is the consumer''s.'
    - THE HOT PATH WRITES AND NEVER READS. Recording an episode must not contend with the ladder reading rules, which is the concrete reason the journal is a sibling of the rule set rather than part of it.
    - 'Oracle: a round trip asserting a recorded episode replays to the same verdict; a test that a late label attaches to the right episode by correlation id; a test that the derived retention floor tracks the configured thresholds; a test that the no-op journal records nothing and costs nothing; and a test that records from two stacks stay distinguishable in one journal.'
    context: |-
      Owner, 2026-08-10, asking what data the consolidation pass actually has: "Does it need to be able to query each of the agents its rules are attached to?"

      It cannot, and that settles the design. Agents get compacted, rotated and killed; their in-session memory is precisely what does not survive, and is what tiering exists to answer. A sleeper that queried live agents would learn nothing from the ones that mattered most — the ones that already died. The material has to be deposited as it happens rather than recalled afterwards.

      The architecture already commits to that and simply had nowhere to put it: every rung must respond or escalate, silent pass-through is the one forbidden outcome, and Result.Rungs already records every rung a request touched together with its reads. That contract exists so each decision leaves an artifact. 🎯T27.10's Scan and 🎯T27's Replay both take a corpus, and today that corpus comes from tests rather than from anywhere real. This is where it comes from.

      EPISODIC AND PROCEDURAL IS THE PRECISE PAIR, better than short-term and long-term. The journal holds episodes — what happened, in this instance, with context. The rule set holds the regularity extracted across them, with the episodes discarded. Consolidation is systems consolidation: offline replay of episodic traces integrated into a procedural store, the traces themselves not preserved. That is why the journal can be thrown away without losing anything already learned, and why that test settled its ownership.

      The analogy is unusually literal in one place: hippocampal replay during sleep is genuinely replay, reactivating the day's firing sequences. That is what Scan does with a recorded corpus, and it is why recording each rung's READS matters — without them there are summary statistics and no re-runnable episode.

      WHY IT IS A SIBLING OF THE RULE SET RATHER THAN PART OF IT (owner asked directly). The two differ on every axis: size, change rate, audience, and — decisively — hot-path access. The ladder READS rules and WRITES episodes, so one object owning both puts two orthogonal accesses behind one lock in the path meant to be cheap. And the loss asymmetry is the clincher: losing the rule set is amnesia, losing the journal costs only future opportunity, so a truncation policy on episodes must never be able to eat rules.

      RETENTION BECOMES DERIVABLE, which is the practical payoff of taking the episodic framing seriously. Decay is the design rather than a compromise on it, and the floor follows from the promotion thresholds instead of being an arbitrary number.
    depends_on:
    - T27.12
    tags:
    - architecture
    - memory
    - journal
    - oracle-first
    origin: manual
    discovered: 2026-08-10
  T27.14:
    name: Consolidation is a function over episodes and rules, scheduled by the consumer and never running in the path it generalises
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Consolidation was a function over ladder episodes and rules.
    acceptance:
    - CONSOLIDATE TAKES THE RULE SET AND THE JOURNAL AS SEPARATE INPUTS and returns PROPOSALS, never installing anything itself. The pass that reasons is not the pass that acts, which is the temporal separation 🎯T27.6 already enforces expressed as a signature rather than as a convention.
    - IT IS SCHEDULED BY THE CONSUMER AND NEVER RUNS IN THE HOT PATH. Offline consolidation is the load-bearing constraint from the motor-learning frame — you do not automatise mid-performance — and a consolidation triggered by the decision it generalises would be exactly that.
    - CANDIDATES ARE REVALIDATED AGAINST THE SCOPE THEY WOULD RUN UNDER. A rule proposed from pooled evidence may name an action some attaching stack may not perform, and a candidate that cannot pass the load-time gate is not a candidate.
    - A CANDIDATE MUST HOLD PER STACK, NOT ONLY ON THE POOL. Evidence pooled across a flavour is only valid if the flavour is homogeneous; a rule can look excellent in aggregate and be wrong for every member. The pass reports per-stack agreement alongside the pooled figure, and a candidate that holds only in aggregate is flagged rather than proposed.
    - IT PROPOSES DEMOTIONS AND REVOCATIONS ALONGSIDE PROMOTIONS, from 🎯T27.10's symptoms. A pass that only ever adds rules makes the store monotonically more rigid, which is the failure the motor-learning frame predicts and the one place this design refuses to imitate biology.
    - EPISODES ARE CONSUMED, NOT KEPT. The pass extracts regularities and does not preserve the episodes behind them; what survives into the rule set is the description and the evidence summary, so the journal stays free to decay.
    - 'Oracle: a test that Consolidate installs nothing; a test that a candidate naming an out-of-scope action is refused rather than proposed; a test that a rule holding on the pool but failing on one stack is flagged; a test that symptoms produce demotion and revocation proposals, not only promotions; and a longitudinal journey driving work, consolidation, and a second work phase that is measurably cheaper without losing delivered work.'
    context: |-
      Owner, 2026-08-10: consolidation is batched and client-driven — "the sleep analogy" — which is what removed the change callback from 🎯T27.12. If rules move only when the consumer asks, the consumer already knows when to save, and a callback would imply changes arriving at unpredictable moments, which is precisely what offline consolidation rules out.

      This target is the function that pass performs. Everything it needs already exists in pieces: 🎯T27.10 computes symptoms and runs the ablation oracle, 🎯T27.6 holds the promotion gates, 🎯T27.13 supplies the replayable episodes, and 🎯T27.12 holds the rules being revised. What is missing is the thing that reads episodes and produces candidates.

      THE SIGNATURE CARRIES THE SAFETY PROPERTY. Consolidate returns proposals rather than installing them, so the separation between reasoning and acting is a fact about the type rather than a discipline someone must remember. 🎯T27.6's Pass gate then refuses an install raised in the same pass, and the two mechanisms agree by construction rather than by convention.

      THE PER-STACK CHECK IS THE NEW HAZARD, and it arrives with the owner's flavour design. Sharing a rule set across stacks pools their evidence, which is the real prize — a fifty-run gate is reached N times faster, and a stack running alone might never reach it at all. But pooling is only valid if the flavour is homogeneous, and a rule promoted on a pool spanning genuinely different traffic can be wrong for every member while looking excellent in aggregate. It is the same shape as every other hazard in this subgraph: an aggregate improving while the thing it stands for does not.

      WHY DEMOTION AND REVOCATION BELONG IN THE SAME PASS rather than a separate maintenance job: a consolidation that only ever adds makes the store monotonically more rigid, which is exactly what the motor-learning frame predicts — automaticity buys cost with adaptability, unlearning costs more than learning, and experts cannot articulate what they do. Making revocation part of the ordinary pass is the deliberate refusal to inherit that asymmetry, the same one that made Revoke cost exactly what Install costs.
    depends_on:
    - T27.13
    - T27.10
    tags:
    - architecture
    - promotion
    - evolution
    - memory
    origin: manual
    discovered: 2026-08-10
  T27.2:
    name: The ladder is one API with one conformance harness — layers are substitutable, and a consumer registers them without knowing what a rung is
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. The substitutable-layer API is being removed.
    acceptance:
    - ONE EVALUATE CONTRACT, IDENTICAL AT EVERY RUNG. A layer receives a request plus whatever prior layers added, and returns either a response or an escalation carrying its additions. A rule, a local model and a frontier model satisfy the same interface, and the caller cannot tell which answered except by reading provenance.
    - ONE CONFORMANCE HARNESS TESTS EVERY LAYER, including layers a consumer writes. Substitutability is proven by running the same suite against each rung rather than asserted in documentation.
    - CONTRIBUTING AND ESCALATING ARE NOT EXCLUSIVE. A layer may resolve entities, annotate, assemble a request AND hand upward. The contract is 'respond, or escalate carrying what you added' — silent pass-through is the single forbidden case.
    - REGISTRATION IS THE CONSUMER'S ONLY INTEGRATION POINT. A consumer supplies an ordered list of layers and nothing else; the runtime owns walking the ladder, provenance, accounting and the journal. Registering zero layers yields today's behaviour.
    - RESPOND TO THE JOURNAL ALWAYS, SURFACE SELECTIVELY. Mandatory responses manufacture volume. The response is durable and auditable; whether it reaches a human is the consumer's decision, made through a separate channel. Conflating the two either floods the consumer's surface or loses the artifact the architecture depends on.
    - KNOWN-HARD CLASSES SHORT-CIRCUIT UPWARD. A request class with a track record of always escalating skips the rungs that would refuse it, and a low layer that CAN answer but historically should not is prevented from having a go. Capability to answer is not licence to answer, and this escalation-side library is earned by the same evidence discipline as the handling-side one.
    - 'Oracle: a hermetic ladder harness drives respond, escalate-with-additions, short-circuit and fail-upward paths against fake layers; a conformance suite runs unchanged against a rule layer, a local-model layer and a provider-backed layer; and a test asserts a registered-zero-layers runtime is byte-identical in behaviour to the pre-ladder path.'
    context: |-
      The mechanism that makes the parent's contract real, and the piece a consumer cannot supply for itself.

      Substitutability is the property that justifies the whole design: if a rule, a cheap model and a frontier model do not satisfy one interface, then the ladder is three bespoke integrations wearing a shared name, and every rung needs its own tests, its own failure handling and its own accounting. That is the state jevons is in today, where the same lost-session bug wore three different costumes across three subsystems.

      The short-circuit criterion is the dual of promotion and has no counterpart in Progressive Crystallization, which only promotes downward. It matters because the parent's central hazard is a cheap layer answering when it should have escalated; a library of known-ambiguous classes is a direct counterweight, and earning it by evidence keeps it from becoming a place to hide inconvenient cases.

      The zero-layers criterion is the safety valve for 🎯T1.6. If a consumer that registers nothing is provably on the old path, the ladder can land additively while the v1.0 surface settles.
    depends_on:
    - T27.1
    tags:
    - architecture
    - api
    - testing
    origin: manual
    discovered: 2026-08-10
  T27.3:
    name: The model tier is itself a ladder — escalation lands on the cheapest model plausibly able to decide, and routing is evidence-driven rather than seeded
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Model-as-a-rung assumes the ladder Agent.
    acceptance:
    - MORE THAN ONE MODEL RUNG EXISTS. An escalation from a deterministic layer lands on the cheapest model plausibly able to decide, not automatically on the most capable one available.
    - A DECISION THE CHEAP MODEL MAKES IDENTICALLY TO THE EXPENSIVE ONE FOR N RUNS DEMOTES TO THE CHEAP MODEL, providing a safe intermediate resting place between 'the frontier model decides' and 'a rule decides'. A cheap model still generalises where a rule cannot, so this rung is safer than crystallisation.
    - EACH TIER BOUNDARY CARRIES ITS OWN EVIDENCE AND ITS OWN DEMOTION TRIGGER. Evidence earned at one boundary does not license a crossing at another.
    - COMPOSES WITH THE BROKER RATHER THAN DUPLICATING IT. Routing decisions are expressed to 🎯T2's control plane — concurrency, warm pool, priority, preemption — rather than to a second scheduler that competes with it for the same capacity.
    - ROUTING IS PROVIDER-AGNOSTIC. A rung names a capability and a cost class, not a vendor; Claude, Codex, Grok, Bedrock and local backends are all eligible for a rung they can satisfy.
    - 'Oracle: replay over recorded sessions reports the distribution of decisions across model rungs, and the share reaching the most expensive rung falls over time on the same request mix; a hermetic test asserts a demotion is refused without its own boundary evidence.'
    context: |-
      The rung of the ladder that is most obviously claudia's, because it is provider selection with evidence attached — and claudia is already the provider layer.

      Half-present in consumers today as static task-type routing. What tiering adds is a GRADIENT for promotion: model -> cheaper model -> rule, rather than model -> rule in one jump. Finer-grained evidence, and a resting place safer than crystallisation.

      Cost: every tier boundary needs its own consistency evidence and its own demotion path, so this multiplies the bookkeeping in the promotion child. Worth doing after the ladder API exists, not before.

      The broker composition point matters more than it looks. 🎯T2 already routes requests to executors under AIMD concurrency control with a warm pool and preemption. A routing layer that does not express itself through that will fight it for capacity, and the failure will look like latency rather than like a design error.
    depends_on:
    - T27.2
    tags:
    - architecture
    - cost
    - models
    - broker
    origin: manual
    discovered: 2026-08-10
  T27.4:
    name: A local-model provider is a first-class rung whose cost is latency rather than tokens, which makes speculation free
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. A local model remains a Provider, not a ladder rung.
    acceptance:
    - LOCAL INFERENCE IS A PROVIDER, not a special case. It sits beside ProviderClaude / ProviderCodex / ProviderGrok / ProviderBedrock, satisfies the same Task contract, and is selectable as a rung by the model ladder.
    - MODEL CHOICE IS SIZED AGAINST THE HOST'S REAL CAPACITY rather than assumed, and the sizing is recorded rather than folded into code.
    - SPECULATION IS EXPLOITED, NOT AVOIDED. Because local inference has no marginal token cost, classifications, resolutions and briefs may be computed continuously in the background for requests that may never arrive, and discarded unused. What is waste against a metered model is free against a local one, and it converts token spend into latency already being paid.
    - SPECULATIVE WORK IS BOUNDED AND CANCELLABLE, and never competes with a live request for the resource it needs. Free of tokens is not free of the machine.
    - 'DETERMINISTIC PARSING IS PREFERRED WHERE IT SUFFICES: dates, relative times, currency, durations and identifiers need no model at all, and reaching for inference where a parser would do is a defect rather than a harmless choice.'
    - 'Oracle: a hermetic test drives the local provider through the same Task conformance suite as every other provider; a benchmark records capability and latency per candidate model against the host; and a replay measures what fraction of historical model turns contained only parsing or resolution work.'
    context: |-
      The rung with running evidence already: a local vision-model bake-off is underway in the jevons tree as of 2026-08-10 — gemma4 variants and macOS Vision, scored by cold judges that have not seen other scores, with a quantitative pass over object decomposition and bounding boxes judged by the owner through a sqlite-backed harness. That work is choosing which models go in this rung; claudia is where the rung itself belongs.

      The speculation point has architectural consequences rather than merely economic ones. With a metered model, precomputing briefs for requests that may never arrive is waste; with a local one it is not, and the design space opens accordingly. This is the clearest case where a cost model — not a capability — changes what the architecture should do.

      The bounding criterion exists because the obvious failure is enthusiasm: an unbounded speculative pipeline saturates the machine and shows up as latency on the live path, which is the one place the local rung was supposed to be cheap.

      Deliberately NOT in scope: reference resolution against a consumer's own registries and indexes. Resolving 'your world' to a particular repo is domain knowledge and belongs to the consumer, which registers it as a layer. Claudia supplies the rung, not the lookup.
    tags:
    - architecture
    - cost
    - local-models
    - providers
    origin: manual
    discovered: 2026-08-10
  T27.5:
    name: 'Layers share an out-of-band channel: reserved codepoints carry uncertainty, provenance, staleness and elision through the event stream intact'
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Marker channel was for layer-to-layer signalling over a walk that no longer exists.
    acceptance:
    - 'A RESERVED DELIMITER PAIR IS DEFINED for layer-to-layer signalling (proposal: U+27E6 / U+27E7, which in denotational semantics already denote ''the meaning of''), and its interpretation is established by system-level prompt rather than inferred per site.'
    - UNCERTAINTY TRAVELS AS DATA, NOT AS CONTROL FLOW. A layer that is unsure resolves provisionally and MARKS the resolution rather than choosing between guessing silently and paying for an escalation. Escalation is binary and costs a model turn; an annotation is continuous and costs roughly a dozen tokens. A marked guess is an artifact; an unmarked guess leaves nothing to demote on.
    - 'THE CHANNEL IS GENERAL, NOT AMBIGUITY-SPECIFIC. First users: provisional resolution, provenance (which layer produced this), staleness (this state is N minutes old), elision (N items omitted, fetch with X), and attention hints.'
    - MARKER SURVIVAL IS MECHANICALLY TESTED, not requested. A test asserts that reserved codepoints entering any stream transform equal those leaving it, so a stage that normalises them away FAILS rather than silently degrading the channel.
    - NO FEEDBACK IS NOT A FAILURE. An unconfirmed annotation persists and is re-annotated next time. Promotion requires positive confirmation, so absence of evidence leaves the system slightly verbose rather than silently wrong — monotone in the safe direction, moving annotated to resolved only on evidence and never the reverse by default. Silence is not weighed as weak assent; it is not counted at all.
    - THE CHANNEL IS A TRUST BOUNDARY. Anything able to emit reserved codepoints can signal to layers that act on them, so content arriving from an untrusted source containing them is control-channel injection. Markers are STRIPPED from untrusted input on the way in, the right to emit is a manifest question rather than a convention, and forged markers surface as an event kind rather than passing as data.
    - ANNOTATION STAYS SPARSE under a confidence threshold. Rare codepoints tokenize to several tokens each, so a marked resolution costs roughly 8 tokens rather than 2 — negligible when sparse, and an argument against marking liberally.
    - 'Oracle: hermetic tests over the marker vocabulary (emit, survive a transform stage, strip from untrusted input, parse back to structured uncertainty), plus a replay over recorded sessions showing which resolutions would have been annotated and at what density.'
    context: |-
      The insight that dissolves the resolve-or-escalate binary, and the cheapest independent piece of 🎯T27 — it needs no ladder, no store and no promotion machinery.

      Reserved codepoints rather than square brackets, because that is what makes marker survival ENFORCEABLE. Brackets collide with prose, markdown links and code, so asking every stage to preserve them is unenforceable by inspection; a reserved pair makes it a counting test.

      Generalising from ambiguity to a channel costs nothing now and saves a retrofit: provenance, staleness and elision all want the same mechanism, and elision in particular is how 'pass bulk content by reference with a fetch handle' is expressed on the wire.

      The fail-safe property is what makes this safe to ship early. The loop degrades to verbosity, never to silent error, so a half-adopted channel is merely noisy rather than dangerous.

      The injection concern follows from making it real protocol rather than suggestive syntax. An out-of-band channel that system prompts act on is a control channel, and control channels need a story about who may write to them. Claudia is well placed to own the stripping, since it is the boundary every provider's output crosses.

      Provenance carried on this channel is what satisfies the parent's requirement that a deterministic action be distinguishable from a model action in the record — and, downstream, that 'the rule said X' and 'the model said X' warrant different trust when a consumer renders them to a human.
    tags:
    - architecture
    - protocol
    - security
    - cost
    origin: manual
    discovered: 2026-08-10
  T27.6:
    name: Promotion and demotion are bookkeeping the runtime provides and never policy it holds — a content-addressed store, propose/install separation, and replay that pins the rule set it ran against
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Promotion bookkeeping was for a rule set that no longer has a ladder to run in.
    acceptance:
    - THE STORE IS THE RUNTIME'S; THE RULES ARE THE CONSUMER'S. Claudia provides a policy store with propose, install, demote and forget, identified by a content hash of its serialised form, and ships no rules of its own. Thresholds are configuration supplied by the consumer, not constants compiled in.
    - PROPOSING A RULE AND INSTALLING ONE ARE SEPARATE ACTS. A layer may propose; installation is gated and visible, performed by something that is not the layer whose cost the rule reduces. Otherwise the cheapest expressible rule is 'handle everything, escalate nothing', and optimising cost finds it immediately.
    - PROMOTION IS OFFLINE. Rules are minted in a retrospective pass, never in the hot path of the decision they generalise. The runtime provides the pass; when it runs is the consumer's cadence.
    - PROMOTION IS CONSISTENCY-GATED with thresholds taken from production practice rather than invented — the arXiv 2607.07052 defaults are >=10 successful runs, zero safety violations, >=90% identical action sequences and passing acceptance tests for the first crossing, and >=50 runs with >=99% classification consistency plus coverage of observed input variation for the second. AUTONOMY ATTACHES TO THE ACTION CLASS ON ITS EVIDENCE, never to the capability of the model behind it.
    - CONSISTENCY IS NOT CORRECTNESS, AND THE STORE SAYS SO. Consistency proves a rule STABLE, never RIGHT; a systematically wrong resolution promotes just as smoothly as a correct one. The store records which evidence backed each promotion so a consumer can supply correctness signals of its own, and promotion on consistency alone is visible as such rather than indistinguishable.
    - DEMOTION IS AUTOMATIC ON LOUD FAILURES — execution error, safety violation, acceptance-test regression — as a circuit breaker. The runtime also accepts an externally supplied demotion signal, because the highest-quality correction available to a consumer arrives from a human and the runtime must not require it to be inferred.
    - 'A PROMOTED RULE CARRIES A PROSE DESCRIPTION of the situation it handles, retrieved by similarity rather than by exhaustive predicates, and generality is requested at mint time. This is also what makes a deterministic action explainable without invoking a model. RETRIEVAL IS A SEAM, NOT AN IMPLEMENTATION: claudia holds no embedding model, so the consumer supplies the scorer and the cutoff, and the runtime supplies ranking, tie-breaking and the stage filter. The scorer sees the query and the description and NOTHING ELSE, which is what stops retrieval sliding back to keying on the rule body.'
    - 'REPLAY PINS THE RULE SET. Behaviour is history-dependent once rules accumulate, so every replay records and pins the FINGERPRINT of the rule set it ran against, or it silently measures a moving target. A content hash rather than a position, per the 🎯T27.12 owner ruling: a version counter is only meaningful within one process lifetime, and memory outlives the process.'
    - 'Oracle: hermetic tests that a promotion below threshold is refused; that a self-install attempt by the benefiting layer is refused; that a loud failure demotes; that an external demotion signal demotes; that a rule is recalled by prose similarity with a consumer-supplied scorer, ranked best-first and refused outright when no scorer is given; and that two replays of one recording against two differently-fingerprinted rule sets produce different, correctly attributed results.'
    context: |-
      The machinery half of the parent — and the part that most needs the mechanism/policy line held, because a store that knows what a good rule looks like has stopped being a runtime.

      CORRECTED 2026-08-15 (claudia-po). As originally written, this target's name and three of its criteria specified a VERSIONED store: promote/demote/pin/rollback, a version chain, and replay pinning "the store version it ran against". 🎯T27.12 then landed the owner's ruling of 2026-08-10 — "VERSION HISTORY IS REMOVED. No rollback, no version chain, no pinning by number… IDENTITY IS A CONTENT HASH OF THE SERIALISED FORM, not a position" — and its own context names this target as the gap it closes. The two were in direct contradiction, and a worker building faithfully against the stale text re-added the chain the owner had removed. The intent behind the pinning criterion survives intact (a replay must not silently measure a moving target); only the mechanism changed, from a within-process counter to a content hash that is stable across processes and machines.

      The motor-learning frame supplies the safety design. Skill consolidation is not cortex-to-spine; it is a shift within the brain toward more RIGID structures. The destination is not dumber, it is less adaptable — bad technique bakes in, unlearning costs more than learning, experts cannot articulate what they do. Automaticity buys cost with adaptability, exactly the trade promotion makes. Biology manages it three ways, and each is a criterion above: automatisation gated on consistency, consolidation offline rather than mid-performance, and prediction error re-engaging the expensive system so the path is bidirectional.

      Voyager supplies the retrieval design — key on an embedding of a natural-language description of what the rule does, not on an exhaustive predicate language — and the warning that comes with it: Voyager has no skill revision or removal path at all, which is survivable when a bad skill produces a failed task and fatal when it produces silence.

      The consistency-is-not-correctness criterion is where this target refuses to overclaim. The runtime cannot supply a correctness signal, because judging whether an outcome succeeded requires the domain. What it can do is refuse to let promotion-on-stability masquerade as promotion-on-evidence, and keep the seam open for a consumer that has better signal — a critic, a human correction, or downstream behaviour confirming an annotation.

      Deliberately NOT in scope: the critic itself. In the consumer that motivated this work the answer is not a better critic but a human who is cheap to ask, and neither belongs in a general runtime.
    depends_on:
    - T27.1
    - T27.2
    tags:
    - architecture
    - promotion
    - store
    - oracle-first
    origin: manual
    discovered: 2026-08-10
  T27.7:
    name: Rich media reaches a model already reduced — images cropped, downscaled and OCR'd, documents converted to text plus selected figures
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Media reduction as a ladder rung dies with the layer API.
    acceptance:
    - 'IMAGES ARE REDUCED BEFORE THEY COST TOKENS: cropped to the region of interest, downscaled to the resolution the judgement actually needs, and OCR''d to text where the content is textual. A screenshot that is 90% window chrome does not cost full-resolution tokens.'
    - DOCUMENTS ARE PREPROCESSED RATHER THAN PASSED WHOLE — PDFs to text plus selectively included figures — so a large document costs one cheap call rather than a paged traversal of rendered images.
    - REDUCTION IS DETERMINISTIC FIRST and model-assisted only where it must be. Cropping, downscaling and OCR need no inference; where inference helps, it runs on the local rung rather than a metered one.
    - REDUCTION IS LOSSY AND SAYS SO. What was cropped or omitted is recorded as an elision marker on the out-of-band channel, and the full artifact remains fetchable by reference, so a judgement that needs the detail can get it.
    - IT IS OPT-IN PER REQUEST. A consumer that needs the original bytes says so and gets them; reduction is never applied silently to a request that depended on what was removed.
    - 'Oracle: recorded image and document payloads replay through the reduction pipeline with a measured token delta and a check that the reduced form still supports the judgement originally made on the full one.'
    context: |-
      The most self-contained child, and the one whose value is most contingent.

      Directly evidenced: reading the Voyager paper during the session that started this work required downloading a 19MB PDF the fetcher refused, then paging through rendered images, where a text-plus-figures preprocessor would have served it in one cheap call. Separately, a consumer whose doctrine mandates verifying real renders rather than trusting judgement about layout sends a great many screenshots by design, so reducing them is not optional detail work for that consumer.

      CONTINGENCY: this is the child most exposed to the open question in the parent. If the billing plan discounts cached reads, media reduction is worth much less than the turns-and-calls levers, and this should wait behind them. cmd/usage (🎯T18) settles it. Prefer resolving that before investing here.

      The opt-in criterion is the guard against the obvious failure: a reduction pipeline that decides for the caller what detail matters has made a judgement with no escalation and no record, which is the parent's silent-omission hazard in a new costume.
    depends_on:
    - T27.5
    tags:
    - architecture
    - cost
    - media
    origin: manual
    discovered: 2026-08-10
  T27.8:
    name: A pattern layer answers by matching declared request fields — RE2 only, analysable as data, and the rung a promoted rule lands in first
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. A pattern matcher on a turn is Doit applied at the wrong grain for an Agent. Doit itself is not rejected.
    acceptance:
    - MATCHING IS OVER DECLARED STRUCTURED FIELDS, never over a serialised blob. A rule names the field it matches and the pattern it applies; it never pattern-matches a stringified request, whose shape can change under it without any rule changing.
    - RE2 SEMANTICS ONLY — linear time, no backtracking, no backreferences, no lookaround. Go's regexp supplies this for free; the criterion exists so nobody later swaps in a backtracking engine to buy expressiveness and imports catastrophic-backtracking failure into the cheapest rung in the system.
    - STRUCTURED PREDICATES ARE PRIMARY; REGEX IS THE ESCAPE HATCH. Exact match, set membership, prefix and field presence are expressible without a pattern, and a rule reaching for regex where a structured predicate would do is a lint failure. doit's production rule set is entirely structured (reject_flags, subcommands) and needs no patterns at all.
    - NO OPINION IS A FIRST-CLASS VERDICT. A rule that does not match abstains rather than denying, and abstention is what walks the request to the next rung.
    - AMBIGUITY ESCALATES RATHER THAN RESOLVING BY DECLARATION ORDER. Two rules matching with different verdicts escalate; matching with the same verdict collapses to one answer. Silent first-match-wins would let rule ordering become invisible policy.
    - 'THE RULE SET IS ANALYSABLE AS DATA, WITHOUT EXECUTING IT: overlap between rules, unreachable rules, and coverage of a recorded request corpus are all computable by inspection. This analysability is the entire reason this rung exists beside a programmable one — a Starlark predicate cannot be reasoned about this way.'
    - IT IS MINTABLE WITHOUT A MODEL. A promotion backed by observed consistency can emit a pattern rule mechanically, so this is the rung a decision crystallises into first, before anything needs to write code.
    - 'IT EXPLAINS ITSELF: the answer names the rule, the field, the pattern that matched, and the prose description the rule was minted with — with no model involved.'
    - ABSTENTION FAILS UPWARD. If no rung above this one is configured or reachable, an abstention escalates to a model; a disabled upper rung NEVER converts an escalation into a local decision.
    - 'Oracle: hermetic tests for abstain, match, conflicting-match escalation, and fail-upward with no upper rung; a corpus analysis reporting overlap and dead rules; a benchmark asserting evaluation cost stays negligible against a full rule set; and the 🎯T27.2 conformance suite passing unchanged.'
    context: |-
      Owner, 2026-08-10: introduce a regex-engine layer and a Starlark layer, inspired by doit.

      A CORRECTION WORTH RECORDING, found while reading doit to ground this. doit has no regex rung. Its L1 is built-in Go checks plus config-derived rules whose shape is CapRuleConfig{RejectFlags, Subcommands} — structured argument matching, not patterns. So a pattern layer is a genuinely new rung rather than something to port, and doit's production experience is evidence that structured predicates carry most of the load. That is why the criteria make structured matching primary and regex the escape hatch, rather than the other way round.

      WHY A PATTERN RUNG EXISTS AT ALL, given the Starlark rung sits right above it. Three properties Starlark cannot offer:

      1. It is analysable without execution. You can ask whether two rules overlap, whether a rule is unreachable, and what fraction of a recorded corpus the set covers, by inspecting the rules as data. A programmable predicate answers none of those questions without running it on inputs you have to think of first.

      2. It is mintable mechanically. Promotion observes a decision repeating and needs somewhere to crystallise it. Emitting a pattern is a template fill; emitting a program requires a model to write code, which reintroduces the cost the rung was meant to remove and adds a generation failure mode.

      3. It is bounded by construction. RE2 has no backtracking and no unbounded execution, so the cheapest rung cannot become a latency or denial-of-service surface. That property is lost the moment someone adds lookaround.

      THE FAIL-UPWARD CRITERION IS EVIDENCED, NOT THEORETICAL. A review of doit found that Escalate and uncertain policy outcomes FAIL OPEN — the command executes — when Level 3 is disabled and the lower levels return a non-Level-3 escalation, because the only guards intercept Deny and one narrow Escalate case. That is the exact failure this criterion forbids, discovered in the system this design is modelled on, so it is a known reachable state rather than a hypothetical.

      The purity split from 🎯T27.1 holds: the match is a pure predicate over declared fields, and any action follows through the actuator and the layer tool surface. Matching must never perform a lookup.
    depends_on:
    - T27.2
    tags:
    - architecture
    - layers
    - doit
    - rules
    origin: manual
    discovered: 2026-08-10
  T27.9:
    name: A Starlark layer answers with sandboxed programmable rules that carry their own tests, and a rule failing its own tests never loads
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: won't fix — parent T27 invalidated. Starlark as an Agent rung is the same grain error.
    acceptance:
    - A RULE IS A SELF-CONTAINED SOURCE FILE declaring an identifier, a prose description, a check function over the request, and an embedded test list — doit's proven shape (rule_id, description, check(...), tests), adapted to claudia's request rather than to a shell command.
    - RETURNING NOTHING MEANS NO OPINION. A check that declines to answer abstains and the request walks to the next rung; only an explicit verdict is a verdict. This is doit's None-is-no-opinion contract and it is what makes a programmable rung composable with the rest of the ladder.
    - TESTS ARE VALIDATED AT LOAD AND A RULE THAT FAILS ITS OWN TESTS IS REJECTED, never loaded and never partially active. This is doit's behaviour today and it is also 🎯T27.6's 'auto-generated acceptance tests pass' promotion gate made concrete — the gate lives inside the artifact rather than beside it.
    - DETERMINISM IS EXPLICIT, NOT INHERITED FROM LIBRARY DEFAULTS. No I/O, no clock, no randomness, no ambient filesystem or network; recursion and unbounded loops disabled by explicit option rather than by relying on a default that a dependency bump can change; deterministic iteration order; globals frozen after load.
    - EVERY EVALUATION HAS A BOUNDED STEP BUDGET, and exhausting it is an ESCALATION rather than a failure or a denial. An expensive rule degrades to 'ask a model', which is the parent's fail-upward rule applied to compute rather than to availability. doit does not currently set a step budget; claudia must.
    - THE PREDICATE IS PURE AND THE ACTUATOR ACTS. A check function reaches its verdict from the request and the state it was handed, never by performing a lookup. Tool access lives behind the verdict, on the layer tool surface from 🎯T27.1, or the replay oracle in the parent is unbuildable.
    - RULE SOURCE IS UNTRUSTED CONTENT AND LOADING IS AN INSTALL ACT. A rule proposed by a model is not thereby installed; installation is the gated, visible step from 🎯T27.6, performed by something other than the layer whose cost the rule reduces.
    - 'IT EXPLAINS ITSELF: the answer names the rule, its prose description and the reason the check returned, with no model involved. Generality is requested at mint time so a rule describes the SITUATION it handles rather than the instance that produced it.'
    - THIS IS THE RUNG A MODEL-AUTHORED RULE LANDS IN, chosen because models write Starlark well while it stays sandboxed, deterministic and Go-embeddable. A decision too structured for the pattern rung and too mechanical for a model rung belongs here.
    - 'ABSTENTION FAILS UPWARD, as on every rung: with no reachable rung above, an abstention escalates to a model, and a disabled upper rung never becomes a licence to decide locally.'
    - 'Oracle: hermetic tests for abstain, verdict, load-time test rejection, step-budget escalation, frozen-globals and no-I/O enforcement, and fail-upward with no upper rung; a determinism test running one rule over one corpus twice for identical results; and the 🎯T27.2 conformance suite passing unchanged against this rung and the pattern rung alike.'
    context: |-
      Owner, 2026-08-10: introduce a Starlark layer inspired by doit. Unlike the pattern rung, this one has a working precedent to copy — doit's internal/starlark already ships a loader, evaluator and generator, and its CLAUDE.md states the reasoning directly: sandboxed, deterministic, Python-like so LLMs write it well, and Go-embeddable.

      WHAT TO TAKE, VERBATIM IN SHAPE. The rule contract — rule_id, description, check returning a verdict dict or None, and an embedded tests list validated on load with a failing rule rejected outright. That last property is the most valuable thing in doit's design and the least obvious: it makes a rule carry its own acceptance evidence, so a rule and its gate cannot drift apart, and a generated rule that does not do what its author claimed simply never becomes active.

      WHAT TO HARDEN. doit loads rules with a zero-valued syntax.FileOptions and only a json module predeclared, which relies on library defaults for the properties the replay oracle depends on, and sets no execution-step budget on the thread. For a gatekeeper adjudicating one command that is tolerable; for a rung answering arbitrary runtime requests it is not. Both are criteria above.

      WHAT NOT TO DO: do not import doit's engine. A general agent runtime taking a dependency on a specific shell gatekeeper inverts the layering and violates 🎯T13. Take the shape; keep the instances separate. This is the parent's one-engine-two-stores position seen from claudia's side — doit's ladder answers 'is this safe', this one answers 'does this need judgement', and they must remain separately administered even where they look alike.

      WHY BOTH RUNGS RATHER THAN ONLY THIS ONE. They sit at different points on the same curve. The pattern rung is analysable without execution and mintable without a model; this rung is expressive enough for conditionals over structured state and composition, at the cost of both those properties. A ladder whose rungs differ only in speed would not be worth building; these differ in kind, which is also what makes the 🎯T27.2 conformance harness meaningful — two engines with almost nothing in common satisfying one contract is the substitutability claim actually tested rather than asserted.
    depends_on:
    - T27.2
    tags:
    - architecture
    - layers
    - doit
    - starlark
    - rules
    origin: manual
    discovered: 2026-08-10
