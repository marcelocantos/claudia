  T100:
    name: Every live test is reachable from `make live` and named in AGENTS.md's gate table, or is recorded as deliberately excluded
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      Achieved 2026-09-21. Implemented by cl-t100-live-gate-coverage at 5742b78ddbf30eb87df772acdfa645cbfa864b4b; adjudicated by claudia-po, who wrote none of it (🎯T31.1). Reachability re-proven at achieve time. 10 files, code plus docs, already built on by siblings — not amend-vulnerable.

      IT CORRECTED THE TARGET IT WAS GIVEN, and that is the achievement rather than a footnote. My census said "32 live tests by name, 22 wired". The name scan is wrong in BOTH directions: TestT30LiveReproSendSucceeds carries "Live" and replays two committed frames, spending nothing; TestT30LargePayloadSubmitsOnRealPath spends a real turn and has no "Live" in it. Eleven more were hidden behind helper-gating — `t96measure(t, ProviderGrok, "CLAUDIA_GROK_LIVE")` and a requireLive-style helper concealing all eight of pool_test.gos live tests. Real figures: 49 live tests by behaviour, 23 reachable before, 22 wired in, 4 excluded with written reasons, 0 undecided. My acceptance told it to enumerate `func Test…Live`, which would have built this targets own defect into the enforcement mechanism and looked green forever; it ignored that and used the behavioural definition.

      THE CHECK IS IN THE GATE, not in prose: internal/livegate.TestLiveGateCoverage runs under `go test ./...`, so `make gate` and the pre-push hook carry it with zero Makefile wiring. It sits outside the root package, which parks, so it can be run and cited on its own — a deliberate choice, and it breaks house style (the repos other two gate oracles are Python scripts) for reasons the seat stated at confidence 7: the toolchains own regexp engine for `-run` semantics, go/ast for the const and helper resolution that made the census correct, and internal/gowalk so the walk sees exactly what the compiler sees.

      TEETH, VERIFIED BY ME FROM THE GATE LOG rather than counted from the report. `GATE livegate-teeth exit=0 GREEN id=ce2680f6 tree=clean@5742b78ddbf3`, confirmed found=true exit_status=0 tree.clean=true, 13 subtests each breaking one thing against the real inputs: new_live_test_nobody_wired; wired_but_no_row_in_AGENTS.md; named_in_make_live_but_in_an_unlisted_package; exclusion_without_a_reason; exclusion_that_is_no_longer_needed; exclusion_for_a_test_that_does_not_exist; live_gate_the_strip_registry_does_not_know; a_-run_name_that_matches_nothing; a_test_whose_gating_cannot_be_read; gate_passed_into_a_helper; helper_declared_hermetic_is_not_descended_into; hermetic_directive_without_a_reason; hermetic_directive_that_contradicts_the_source.

      THE ACCEPTANCES RED DEMONSTRATION, verified: `GATE livegate-red-demo exit=1 RED id=f057d894 tree=dirty+1@5742b78ddbf3`. The dirty+1 is the injected brand_new_backend_live_test.go, removed afterwards. Its output names BOTH obligations and says what to do: "spends CLAUDIA_GROK_LIVE and its name is not in `make live`s -run expression. Wire it into the `live:` recipe, or exclude it with a reason" and "is not named in AGENTS.mds live-test table. An agent that changes this surface reads that table and finds no row, so no gate binds it." That second sentence is this targets own rationale, reproduced in the error a future reader will actually meet. The false-green checker flagged this RED as `attestation_not_green`; it is wrong, this is the third such instance tonight, and it is filed as jevons 🎯T759.

      THE FOUR EXCLUSIONS, CHECKED INDIVIDUALLY because I said I would and because "excluded with a reason" is the clause most easily satisfied in appearance only. TestProbeMCPLiveAtlassian asks mcp.atlassian.com what auth it advertises, so it reddens when a vendor changes, which is not a defect in this repo and must not be able to fail a claudia gate. The three TestT96MeasureSilence probes assert nothing — they print the longest silent gap inside a live turn, the quantity turnSilenceBound is measured from — so on every gate they would spend a turn per backend for a verdict they cannot give. All four waive ONLY make-live and keep their AGENTS.md rows: excluded from running, not from being found, which is precisely the concern my acceptance had. And the list polices itself — `make gate` fails on an entry with no reason, on one naming a test that is not live, and on one whose obligation is already met, because "a stale exclusion is how this list would rot into the silence it exists to prevent". I did not ask for that anti-decay property and it is the best thing in the commit.

      STRICTER THAN WRITTEN, deliberately. My acceptance said "absent from both"; it enforced reachable AND named, on the ground that a test reachable from `make live` but missing from the table still leaves an agent reading the table and finding nothing. The targets title says AND. It is right.

      BETTER SHAPE THAN I SPECIFIED for the plan-usage wire. Rather than a seventh backend row or a bare mention, AGENTS.md gains a second table, "Shared surfaces", keyed by surface and naming the gate that un-skips each — because a backend-keyed table cannot carry a mechanism several backends run through without lying about which backend owns it. Five other silent surfaces got rows: goal continuation, broker seat reclaim, tmux paste-submit framing, MCP attach/host seats, and the turn-silence bound.

      A FINDING BEYOND THE TARGET, and the one I would escalate: the census found two live gates testctlenv.LiveGates() did not name — CLAUDIA_LIVE_SEND and CLAUDIA_MCP_OAUTH_LIVE. They had been un-skipping tests for months while nothing stripped them from a spawned agents environment, which is the 🎯T20 leak class, found by reading the tests instead of the list. Both added; the pinned registry test updated.

      OTHER EVIDENCE: `GATE livegate-oracle exit=0 GREEN id=50268086 tree=clean@5742b78ddbf3`, `GATE livegate-vet exit=0 GREEN id=f8403d18`, `GATE livegate-stability exit=0 GREEN id=37dfe46b`, and `GATE livegate-at-head exit=0 GREEN id=c22200f3 tree=clean@fd72f40b417f` — the last run after two sibling commits, which is the evidence the oracle still holds as master moves. Cross-checked against the toolchains own answer: `go test -list` over the new recipe selects 45 of 49, the 4 absent are exactly the 4 with written exclusions, and the 1 extra is the deliberate hermetic net TestMCPExclusiveGrokInspectJourney.

      RESIDUE, named and accepted. Full `make gate` not run to completion: it started one clean-tree and killed it (exit 144, its own SIGTERM, no gate record written so nothing to void) because cl-t98 was running the identical gate at that moment and a sibling was driving a live Grok turn that `go test -race ./...` would perturb. That is good fleet citizenship and the clause was already blocked on 🎯T96/🎯T98 by my instruction. No live tests were run at all — no live gate env was ever set in this session, per the brief. Its commit message says "twenty-four unreachable" where the figures are 22 wired and 4 excluded of 26 previously unreachable; self-corrected in the report and not amended because master had moved on, which is the right call.

      ONE OPEN CONSEQUENCE, not a defect in this work: the shared working tree now reddens the new check, correctly, on an untracked sibling file — TestProbeCursorMintFirstSignOfLife at zz_probe_live_test.go:15, a temporary 🎯T83 scout probe left at the module root by the reaped cl-t79-cursor-stream. 🎯T99s rule already says in-repo scratch belongs under `_scratchpad/`, which both the go command and this census ignore. Committed master is clean of it (livegate-at-head is GREEN), so no citation is blocked. The seat correctly did not touch another agents file.
    acceptance:
    - 'No live test exists that the repo''s own live gate cannot reach. A check — in the gate, not in prose — enumerates `func Test…Live` across the module and fails when one is absent from both `make live`''s `-run` expression and AGENTS.md''s per-backend table, unless it appears in an explicit exclusions list with a stated reason. Measured starting point to close: 32 live test functions exist, 22 names appear in the `live` target, so roughly ten are currently unreachable; the target records what happened to each one — wired in, or excluded with a reason. `TestGrokPlanUsageLive` (plan_usage_grok_test.go:124) is wired in specifically, and AGENTS.md''s table gains the plan-usage wire as a gated surface so a future change to it consults a row that exists. The check itself must fail when a new live test is added without wiring, demonstrated by adding one.'
    context: |-
      Filed 2026-09-21 by claudia-po. Found because cl-t85-vendor-pacing noticed, unprompted, that the provider wire it had changed had a live test the gate did not ask for: "found a live test on the wire I touched that the `make live` target doesn't include — TestGrokPlanUsageLive — and ran it against the real grok billing endpoint now that the mutex is free… It also covers the unpaced direct-caller path, which live had not exercised."

      Verified by claudia-po rather than taken on report: `grep -c TestGrokPlanUsageLive Makefile` → 0, `grep -c TestGrokPlanUsageLive AGENTS.md` → 0, and the function exists at plan_usage_grok_test.go:124. The gap is not one test — the module defines 32 `func Test…Live` functions while `make live`'s `-run` expression names 22. About a third of this repo's live tests cannot be reached by the command the project documents as its live gate.

      Why this is a gate defect and not housekeeping. AGENTS.md's live-test section is written as a hard gate — "Run every backend whose wire you touched… Unset gates skip. CI never sets them. You are the gate" — and it hands the agent a table of required tests per backend. An agent doing exactly what that section says will consult the table, not find the surface it touched, and correctly conclude no live gate binds. That is how a live test that exists still fails to run. It only surfaced here because one seat went looking beyond its brief; the next seat will not.

      It also matters for what has already been attested. 🎯T84/🎯T85 were achieved on the plan-usage wire, and the live evidence for the paced-fetch mechanism came from `go run ./cmd/usage` observation plus, belatedly, this test — which no gate row required. The achieve stands on cl-t84-t85-vcheck's clean-tree citations (7b8efef9, 334aad67, e44db155, each verified found=true GREEN tree=clean@86e49f9), not on this, so nothing is retracted. But the plan-usage wire being live-green on all four fetching backends is corroboration this repo could not have demanded, and that asymmetry is the defect.

      Related principle, already in the shared doctrine: an oracle is a loop, not an artifact — a verification asset that is not wired to a standing enforcement point decays. Ten unwired live tests are ten such assets. Note the companion impediment recorded separately: cl-t85's attempt to obtain a clean-tree citation (`bin/gate -clean -commit 86e49f9 -- make gate`) was declined at the approval prompt twice, which is why its three GREENs are all dirty-tree and why the false-green checker flagged them. It declared that plainly instead of presenting them as sufficient.

      MY MEASUREMENT WAS WRONG AND MY ACCEPTANCE WOULD HAVE BUILT THE HOLE INTO THE CHECK. Corrected 2026-09-21 by claudia-po after cl-t100-live-gate-coverage reported its census.

      I wrote "32 live test functions exist, 22 named in the live target" from `grep 'func Test.*Live.*(t \*testing.T)'` — a NAME-based count. cl-t100 counted by BEHAVIOUR instead, meaning tests that actually gate on a CLAUDIA_*_LIVE environment variable, and got 49 in the module with 23 reachable before its change. I re-derived the gap myself: 48 test functions sit within reach of a live env gate, 38 have "Live" in the name, so roughly ten live-gated tests are invisible to any name-based audit — among them TestAgentSendAndWaitForResponse, TestAgentMultiTurn, TestCrashSurvival, TestCodexTaskRunSmoke, TestGrokTaskRunSmoke, TestMCPExclusiveSessionRoundTrip and TestMCPExclusiveCursorSessionRoundTrip. Several of those are named in AGENTS.md's own gate table, so they are required tests whose live-ness a name scan cannot see.

      The important part is not that my number was low. It is that the acceptance above says the check should enumerate `func Test…Live`, and a check built to that wording would have reproduced this target's own defect inside the enforcement mechanism: it would have certified coverage while ten live-gated tests stayed invisible to it, and it would have looked green forever. cl-t100 deviated from the stated method and used the behavioural definition. That was correct and it is the deviation that makes the check worth having — read the acceptance's "enumerates `func Test…Live`" as illustrative, not normative, and take the behavioural definition as binding.

      A SECOND THING WORTH KEEPING from that seat's progress report: while its enumerator ran, it met a live test that had landed on master an hour earlier, gated through a helper rather than an inline env read, and extended the census to follow the helper. So the loop caught a real new instance during its own construction — which is the only evidence that an enforcement point actually enforces, as against merely existing.

