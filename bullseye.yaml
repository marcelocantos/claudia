  T103:
    name: An abandoned turn inside the test suite is named by the wait, not by a nameless process-wide timeout panic
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'A hermetic test that waits on a turn whose terminal event never arrives fails with 🎯T96''s own diagnosis — ErrTurnAbandoned naming the session, the turn, what last arrived and how long ago — and the rest of its package still reports, instead of the process dying on `panic: test timed out` with every other test''s result lost. Demonstrated by a test that parks a fake-backed agent deliberately and asserts the named error arrives well inside the package timeout, with the whole package still completing. The repair does not lower turnSilenceBound for production (30 minutes is measured and load-bearing — see its comment) and does not raise any package timeout; it makes the effective bound answer to the deadline the wait is actually running under. 🎯T98''s park is NOT the test case: that one is a cross-test interaction and its repair must remove the wait, not bound it.'
    context: |-
      Filed 2026-09-21 by cl-t96-waitforresponse-bound, recording a limitation of 🎯T96's own fix that its acceptance did not reach.

      🎯T96 gave WaitForResponse four wakes so a turn whose terminal event never arrives ends with a named error. The silence bound behind the last of those is 30 minutes, measured against healthy-turn silence (four live ACP mints; a 90s tool call goes 1m30s–2m34s with nothing at all on the wire, and ACP sessions have no pane to repaint, so nothing else fills the gap).

      `go test` allows ten minutes by default. Thirty is longer than ten. So inside the suite — the one place this defect has actually bitten, twice, and the place the fanout of 🎯T92/🎯T91/🎯T83 is waiting on — an abandoned turn still kills the process before the wait can say anything about it. The fix is correct and inert exactly where it was needed as a diagnostic.

      Observed at HEAD, after the fix, on a clean checkout:

          GATE t96-make-gate exit=2 RED id=2e307e38 dur=12m6.9s tree=clean@41ed187dd89c
          panic: test timed out after 10m0s
            running tests:
              TestCursorSlowFirstPromptIsNotStuck (9m3s)
          goroutine 577 [select, 9 minutes]:
            claudia.(*Agent).WaitForResponse ... agent.go:1962
            claudia.TestCursorSlowFirstPromptIsNotStuck ... cursor_stuck_prompt_test.go:87
          FAIL github.com/marcelocantos/claudia 600.593s   (every other package green)

      The park itself is 🎯T98's and predates the fix — `git merge-base --is-ancestor 02cec52e4949 038f7ff` — so this target is not about that hang. It is about what the suite learns when a hang happens: today, nothing. The goroutine dump names the frame only because the runtime prints every goroutine; the wait, which knows the session id, the turn id, the last event and its age, is never asked.

      Shape of a repair, not a decision: the wait could take the smaller of turnSilenceBound and the caller's own remaining deadline when the caller has one, which costs nothing in production (a consumer with no deadline keeps the full 30 minutes) and makes a `t.Context()` wait answer inside the test's budget. That does not help a test using context.Background(), which is the shape at cursor_stuck_prompt_test.go:87 — so a test-facing default may be needed too. Both need thought about not re-introducing a host-speed verdict (🎯T33/🎯T92/🎯T93), which is why this is a target and not a patch.
