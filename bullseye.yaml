  T2.2:
    name: AIMD concurrency control with per-model tuning
    status: identified
    value: 5.0
    cost: 5.0
    acceptance:
    - 'The AIMD controller is exported library API (🎯T75): it tracks in-flight agent slots per model, halves a model''s available slots on a 429 observed from any agent it watches, and recovers additively (one slot per clean turn-completion window), all against an injectable clock.'
    - A library application can opt a Registry into the controller with no daemon; it is off by default in direct mode. The daemon runs one instance across every consumer's seats, which is the only host-wide part.
    - The controller publishes throttle and recover events through the library's lifecycle events (🎯T75.6); the daemon forwards them on the tail stream.
    - No static concurrency knob is exposed to the consumer — policy is fully self-tuning.
    - '`claudia broker status` reports the per-model AIMD slot counts; `claudia broker tail` streams the throttle and recover events (split from T2.7).'
    - 'Hermetic: the controller is tested in direct mode with no daemon, and the daemon test asserts its handler only forwards.'
    context: |-
      Anthropic rate limits hit fast with parallel agents; opus-4-7 accounted for 96% of a 7-day $14.9k spend (62% of messages at 14x per-token cost vs sonnet). Per-model AIMD is therefore the single highest-leverage lever. The 429 signal is the authoritative backpressure signal — no need to guess at rate-limit headroom.

      Owner 2026-09-17 (🎯T75): the mechanism is built in the library and the daemon passes through; the daemon adds cross-consumer scope only. Originally worded as a broker feature.
