  T31:
    name: The hermetic Task oracles are deterministic under fleet load, not only on an idle machine — no wall-clock readiness deadline decides a pass
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: |-
      waitHermeticTaskReady is gone; readiness is watchHermeticTask.waitReady on TaskEventInit (hermetic_wait_test.go, earlier T31 commits 206f4ac / 4f9e6da). Remaining oracles landed in 2d53fbf:

      - RED-without-fix: TestHermeticTaskReadyStallContrast — fake delayed 6s past the old 5s deadline; waitHermeticTaskReadyLegacy errors, waitReady sees init.
      - Load: TestHermeticOraclesSurviveFleetLoad — 16 holding Task.Run agents plus a second -race-suite analog, then signal-ready / spawn-drain / Cancel on a slow fake.
      - Deadline inventory in the 2d53fbf commit body; remaining time.After/WithTimeout are live-binary bounds or elapsing-is-PASS.

      Assembled onto master and re-run 2026-08-16: TestHermeticOraclesSurviveFleetLoad + TestHermeticTaskReadyStallContrast PASS (go test -race -count=1).
    acceptance:
    - go test -race -count=1 ./... is green while the machine carries the load a live fleet actually applies (a dozen-plus concurrent agents plus a second -race suite), demonstrated against a synthetic load generator rather than on a quiet machine.
    - 'waitHermeticTaskReady (claude_provider_hermetic_test.go:251) no longer decides the verdict by wall clock: readiness is awaited on a signal the fake emits (channel/event), so a slow machine makes the test slower, never RED. Widening the 5s constant is explicitly NOT the fix — the same prohibition 🎯T17 carried.'
    - 'The same sweep is applied to every other wall-clock deadline in the hermetic oracles, not only the one that happened to fire: an inventory of time.After / deadline constants in *_test.go is produced, and each is either signal-driven or justified in the diff.'
    - 'RED-without-fix evidence: the pre-fix helper is shown to fail under an artificial stall (e.g. the fake delayed past the deadline) and the post-fix helper passes the same stall.'
    context: |-
      Observed 2026-08-15 by cl-t28-send-submit while gating 🎯T28 work at claudia master 5bb2527. A full-suite run went RED — GATE go-test exit=1 RED id=b69f7650 dur=57.7s — on: `--- FAIL: TestHermeticTaskCancelSendsSIGINT (5.01s) claude_provider_hermetic_test.go:191: hermetic task never became ready (no TaskEventInit / ClaudeID)`.

      That is NOT the assertion 🎯T17 fixed. 🎯T17 made the Cancel/Stop/drain path deterministic and its acceptance explicitly forbade fixing the symptom by widening a deadline. But the helper it left in place, waitHermeticTaskReady (claude_provider_hermetic_test.go:251), still spins on a 5s WALL-CLOCK deadline waiting for the fake CLI to emit init. Under load that deadline is what is being measured, not the product.

      Evidence it is load, not a defect in the code under test: the same test on the same tree in isolation went 10/10 green — GATE go-test-TestHermeticTaskCancelSendsSIGINT exit=0 GREEN id=4676e479 dur=5.3s (go test -race -count=10 -run TestHermeticTaskCancelSendsSIGINT .) — and a full-suite re-run minutes later was green — GATE go-test exit=0 GREEN id=a831969b dur=16.7s. The file is untouched by any recent commit (last changes f1e783c, eb20776), and both 🎯T28 commits (aa71680, e5237a6) are confined to internal/tmuxagent and cmd/.

