\* Mutation 3: stale-handle reclaim enabled — Reclaim drops the broker's
\* ownership record without invalidating the consumer's handle. The agent then
\* reaps legitimately and the consumer Sends to a torn-down session, so TLC MUST
\* report an Inv_NoSendAfterReap violation. If this run passes, the Send-after-
\* reap invariant is toothless. verify-specs asserts this run fails.
SPECIFICATION Spec

CONSTANTS
    Agents = {a1, a2}
    Consumers = {c1, c2}
    AllowReapWhileHeld = FALSE
    AllowStealGrant = FALSE
    AllowStaleHandle = TRUE

INVARIANTS
    TypeOK
    Inv_NoDoubleOwnership
    Inv_NoHeldReap
    Inv_NoSendAfterReap
